name: release-e2e

# Release-PR gate for the bundle, THIN WRAPPER edition (e2e migration W3b):
# the e2e stack no longer runs here — this workflow detects Release PRs,
# resolves the exact candidate artifact set, submits the Argo
# WorkflowTemplate e2e-stack on the persistent e2e environment
# (gitops/e2e/argo-workflows/), waits for it, and posts the Argo UI +
# ReportPortal launch links to the PR. All orchestration (env-prep, seed,
# suites, JUnit upload) lives in the cluster.
#
#   1. resolve — candidate set from the PR: charts-ref = PR head SHA;
#      server/console/agent image tags from the bumped chart appVersions
#      (agent: the platform chart's agent.recommended); cosign-verify=true,
#      ha=true, quarantined excluded (hard rule 5: exactly this artifact set).
#   2. submit  — argo submit --from workflowtemplate/e2e-stack (HTTP/1.1 —
#      gRPC does not survive the istio internet-gateway, probed 2026-11-06),
#      then a stateless poll loop (no long-lived watch streams).
#   3. report  — Argo UI + ReportPortal launch links posted to the PR at
#      submit AND with the final result (pass/fail).
#
# Trigger: pull_request on release-please Release PRs only (branch prefix
# `release-please--` or Chart.yaml/appVersion changes), plus
# workflow_dispatch as a repair/debug path. Runs on `pull_request` (never
# `pull_request_target`) with in-repo branches only — release-please
# branches always live in this repo, so no untrusted checkout ever gets
# secrets. Fork PRs are hard-skipped.
#
# PREREQUISITES (done 2026-11-06):
#   - repo secret ARGO_TOKEN: the e2e-submitter ServiceAccount token
#     (Secret e2e-submitter-token in ns inari-e2e — created by
#     gitops/e2e/argo-workflows/rbac.yaml). SET by the owner.
#     The value must be the FULL Authorization header — the argo CLI sends
#     ARGO_TOKEN VERBATIM (v4 cmd/argo/commands/client/conn.go
#     GetAuthString); a bare JWT fails with "token not valid". Harvest:
#       printf 'Bearer %s' "$(kubectl -n inari-e2e get secret \
#         e2e-submitter-token -o jsonpath='{.data.token}' | base64 -d)"
#   - the public argo-workflows route (argo-workflows.7kgroup.org)
#     from 7k-app-of-apps#32. LIVE.
#
# REQUIRED CHECK: once this workflow has a green live run, it becomes a
# required check on Release PRs. Enabling that is a MANUAL branch-
# protection/admin step — intentionally not encoded here; land the Argo gate
# as non-required first (plan §10 P1d: ~2 weeks of stable signal before
# flipping branch protection).
on:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode (edge = gate selection without cosign, for repair/debug)
        type: choice
        options: [edge, release]
        default: edge
      chart-path:
        description: Chart directory whose appVersion pins the server under test (release mode)
        required: true
        default: charts/inari-server
      image-tag:
        description: >-
          Optional server image tag override (e.g. a specific published tag or
          "edge"). Release mode still requires a version tag and derives the
          inari-server source ref as v<tag>.
        required: false
        default: ""
      charts-ref:
        description: "Bundle repo ref to test (default: the dispatched ref)"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write # post the run links to the Release PR

concurrency:
  group: release-e2e-${{ github.ref }}
  # Superseded PR pushes kill in-flight runs; main/dispatch runs never cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Detect Release PR (or dispatch)
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "workflow_dispatch — running"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Never run heavy legs against fork PRs (secrets/GITHUB_TOKEN
          # package pulls are only safe same-repo; release-please branches
          # are always in-repo anyway).
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "fork PR ($HEAD_REPO) — skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Docs/markdown-only changes can't affect the stack — skip.
          # Fail-safe: only skips when EVERY changed file is ignorable.
          docs_only() {
            ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
              | grep -qvE '^(docs/|.*\.md$|LICENSE$|\.gitignore$)'
          }
          if [[ "$HEAD_REF" == release-please--* ]]; then
            if docs_only; then
              echo "release-please branch $HEAD_REF but docs-only change — skipping"
              echo "run=false" >> "$GITHUB_OUTPUT"
            else
              echo "release-please branch $HEAD_REF — running"
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          # Chart.yaml / appVersion changes on an in-repo branch also count.
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -q 'charts/.*/Chart.yaml'; then
            echo "Chart.yaml changes detected — running"
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff "$BASE_SHA" "$HEAD_SHA" | grep -qE '^[+-]appVersion:'; then
            echo "appVersion change detected — running"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "not a Release PR — skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  resolve:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      charts-ref: ${{ steps.resolve.outputs.charts-ref }}
      server-image: ${{ steps.resolve.outputs.server-image }}
      console-image: ${{ steps.resolve.outputs.console-image }}
      agent-image: ${{ steps.resolve.outputs.agent-image }}
      server-src-ref: ${{ steps.resolve.outputs.server-src-ref }}
      cosign-verify: ${{ steps.resolve.outputs.cosign-verify }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: Resolve the candidate artifact set
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MODE_IN: ${{ github.event.inputs.mode }}
          CHART_PATH: ${{ github.event.inputs.chart-path || 'charts/inari-server' }}
          IMAGE_TAG_OVERRIDE: ${{ github.event.inputs.image-tag }}
          CHARTS_REF_IN: ${{ github.event.inputs.charts-ref }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          app_version() { awk '/^appVersion:/ {print $2}' "$1/Chart.yaml" | tr -d '"'; }

          # The agent image under test for release runs is the platform
          # chart's declared recommendation (inari-agent-compat ConfigMap
          # source) — the agent has no chart in this repo to bump.
          agent_recommended() {
            awk '/^  recommended:/ {print $2; exit}' charts/inari-platform/values.yaml | tr -d '"'
          }

          if [ "$EVENT" = "pull_request" ]; then
            # Release PR: exactly the candidate set, cosign ON, quarantined
            # excluded (hard rule 5). ghcr tags are UNPREFIXED, git tags
            # v-prefixed.
            server_app="$(app_version "$CHART_PATH")"
            console_app="$(app_version charts/inari-console)"
            [ -n "$server_app" ] && [ -n "$console_app" ] || { echo "missing appVersion" >&2; exit 1; }
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "charts-ref=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "server-image=${server_app#v}" >> "$GITHUB_OUTPUT"
            echo "console-image=${console_app#v}" >> "$GITHUB_OUTPUT"
            echo "agent-image=$(agent_recommended)" >> "$GITHUB_OUTPUT"
            echo "server-src-ref=v${server_app#v}" >> "$GITHUB_OUTPUT"
            echo "cosign-verify=true" >> "$GITHUB_OUTPUT"
            # The Release PR must point at a published server tag.
            if ! git ls-remote --exit-code https://github.com/7K-Inari/inari-server.git "refs/tags/v${server_app#v}" >/dev/null 2>&1; then
              echo "inari-server tag v${server_app#v} does not exist — refuse to gate an unpublished server" >&2
              exit 1
            fi
            echo "resolved release candidate: server=${server_app#v} console=${console_app#v} agent=$(agent_recommended) charts@${HEAD_SHA:0:8}"
            exit 0
          fi

          # workflow_dispatch repair/debug path. mode=edge (default): gate
          # label selection without cosign (unsigned edge images). mode=
          # release: exact candidate combo, still validated by the workflow's
          # own resolve step.
          charts_ref="${CHARTS_REF_IN:-$GITHUB_SHA}"
          echo "charts-ref=$charts_ref" >> "$GITHUB_OUTPUT"
          echo "console-image=edge" >> "$GITHUB_OUTPUT"
          echo "agent-image=edge" >> "$GITHUB_OUTPUT"
          if [ "$MODE_IN" = "release" ]; then
            tag="${IMAGE_TAG_OVERRIDE:-$(app_version "$CHART_PATH")}"
            tag="${tag#v}"
            echo "$tag" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "release mode needs a version tag (got $tag)" >&2; exit 1; }
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "server-image=$tag" >> "$GITHUB_OUTPUT"
            echo "console-image=$(app_version charts/inari-console | tr -d v)" >> "$GITHUB_OUTPUT"
            echo "agent-image=$(agent_recommended)" >> "$GITHUB_OUTPUT"
            echo "server-src-ref=v$tag" >> "$GITHUB_OUTPUT"
            echo "cosign-verify=true" >> "$GITHUB_OUTPUT"
          else
            echo "mode=edge" >> "$GITHUB_OUTPUT"
            echo "server-image=${IMAGE_TAG_OVERRIDE:-edge}" >> "$GITHUB_OUTPUT"
            echo "server-src-ref=main" >> "$GITHUB_OUTPUT"
            echo "cosign-verify=false" >> "$GITHUB_OUTPUT"
          fi

  submit:
    needs: resolve
    runs-on: ubuntu-latest
    # Must exceed the workflow's activeDeadlineSeconds (10800s = 3h): if this
    # job timed out first, the check would go red while the Argo run was
    # still legitimately in flight (and still holding the env semaphore).
    timeout-minutes: 185
    env:
      ARGO_SERVER: argo-workflows.7kgroup.org:443
      ARGO_SECURE: "true"
      # gRPC does not survive the istio internet-gateway ("server closed the
      # stream without sending trailers" on every submit — reproduced and
      # probed 2026-11-06); the HTTP/1.1 gateway API is verified working.
      ARGO_HTTP1: "true"
      ARGO_TOKEN: ${{ secrets.ARGO_TOKEN }}
      WF_NAME: ""
    steps:
      - name: Install argo CLI (matches the cluster's controller)
        run: |
          set -euo pipefail
          curl -sfL -o argo.gz https://github.com/argoproj/argo-workflows/releases/download/v4.1.6/argo-linux-amd64.gz
          gunzip -f argo.gz
          chmod +x argo
          sudo mv argo /usr/local/bin/argo
          argo version --short

      - name: "Preflight: submitter token present"
        run: |
          if [ -z "$ARGO_TOKEN" ]; then
            echo "::error::repo secret ARGO_TOKEN is not set — harvest the e2e-submitter-token Secret"
            echo "  (ns inari-e2e, created by gitops/e2e/argo-workflows/rbac.yaml) into repo secrets."
            echo "  See the release-e2e.yaml header for the full prerequisite list."
            exit 1
          fi

      - name: Submit e2e-stack to the e2e environment
        id: submit
        env:
          MODE: ${{ needs.resolve.outputs.mode }}
          CHARTS_REF: ${{ needs.resolve.outputs.charts-ref }}
          SERVER_IMAGE: ${{ needs.resolve.outputs.server-image }}
          CONSOLE_IMAGE: ${{ needs.resolve.outputs.console-image }}
          AGENT_IMAGE: ${{ needs.resolve.outputs.agent-image }}
          SERVER_SRC_REF: ${{ needs.resolve.outputs.server-src-ref }}
          COSIGN: ${{ needs.resolve.outputs.cosign-verify }}
          # Release gate runs the env-wide HA flip + disruption specs (the
          # release contract); edge repair/debug stays non-HA and fast.
          HA: ${{ needs.resolve.outputs.mode == 'release' && 'true' || 'false' }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          name=$(argo submit --from workflowtemplate/e2e-stack -n inari-e2e \
            -p mode="$MODE" \
            -p ha="$HA" \
            -p charts-ref="$CHARTS_REF" \
            -p server-image="$SERVER_IMAGE" \
            -p console-image="$CONSOLE_IMAGE" \
            -p agent-image="$AGENT_IMAGE" \
            -p server-src-ref="$SERVER_SRC_REF" \
            -p cosign-verify="$COSIGN" \
            -p include-quarantined=false \
            -p reportportal-launch="release-$RUN_ID" \
            -o name)
          echo "submitted: $name"
          echo "wf-name=$name" >> "$GITHUB_OUTPUT"

      - name: Post run links to the Release PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WF: ${{ steps.submit.outputs.wf-name }}
          PR: ${{ github.event.pull_request.number }}
          LAUNCH: release-${{ github.run_id }}
        run: |
          set -euo pipefail
          gh pr comment "$PR" --body "$(cat <<EOF
          ### e2e release gate (Argo Workflows)

          Submitted \`$WF\` to the persistent e2e environment (mode=release —
          exact candidate artifact set, cosign on, quarantined excluded).

          - **Argo UI:** https://argo-workflows.7kgroup.org/workflows/inari-e2e/$WF
          - **ReportPortal launch:** [\`$LAUNCH\`](https://reportportal.int.7kgroup.org/ui/#inari-e2e/launches/all?filter.eq.name=$LAUNCH) — JUnit imports at run end, including on failure/abort

          This check waits for the workflow and reports its result.
          EOF
          )"

      - name: Wait for the workflow (poll — no long-lived watch streams)
        id: wait
        if: steps.submit.outputs.wf-name != ''
        env:
          WF: ${{ steps.submit.outputs.wf-name }}
        run: |
          set -uo pipefail
          # Stateless GET polling instead of `argo wait`: a multi-hour watch
          # stream risks being cut by gateway stream-idle timeouts mid-run.
          # 175x60s = 175m < the job's 185m timeout; the workflow's own
          # activeDeadlineSeconds (3h) is the real run cap.
          rc=1
          for i in $(seq 1 175); do
            phase=$(argo get -n inari-e2e "$WF" -o json 2>/dev/null | jq -r '.status.phase // empty' || true)
            echo "[$i/175] $(date -u +%H:%M:%SZ) phase=${phase:-unknown}"
            case "$phase" in
              Succeeded) rc=0; break;;
              Failed|Error) rc=1; break;;
            esac
            sleep 60
          done
          argo get -n inari-e2e "$WF" 2>/dev/null | tail -30 || true
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # Never fail HERE — the result comment must post first; the final
          # "Gate result" step re-raises the recorded exit code.
          exit 0

      - name: Post result to the Release PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WF: ${{ steps.submit.outputs.wf-name }}
          PR: ${{ github.event.pull_request.number }}
          LAUNCH: release-${{ github.run_id }}
          RC: ${{ steps.wait.outputs.rc }}
        run: |
          set -euo pipefail
          if [ -z "$WF" ]; then
            result="❌ **submission failed** — see this workflow's logs"
          elif [ "$RC" = "0" ]; then
            result="✅ **PASSED** — \`$WF\`"
          else
            result="❌ **FAILED** — \`$WF\` (or the wait budget elapsed; the Argo run may still be in flight)"
          fi
          gh pr comment "$PR" --body "$(cat <<EOF
          ### e2e release gate — result

          $result

          - **Argo UI:** https://argo-workflows.7kgroup.org/workflows/inari-e2e/$WF
          - **ReportPortal launch:** [\`$LAUNCH\`](https://reportportal.int.7kgroup.org/ui/#inari-e2e/launches/all?filter.eq.name=$LAUNCH)
          EOF
          )"

      - name: Gate result
        if: always() && steps.submit.outputs.wf-name != ''
        env:
          RC: ${{ steps.wait.outputs.rc }}
        run: |
          echo "gate result: rc=${RC:-1}"
          exit "${RC:-1}"

  server-integration:
    # Unchanged repo-native layer: the full inari-server integration suite at
    # the resolved source ref (the artifact being released, not a floating
    # branch). Runs beside the Argo gate, not inside it.
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout inari-server at pinned ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: 7K-Inari/inari-server
          ref: ${{ needs.resolve.outputs.server-src-ref }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Integration suite @ ${{ needs.resolve.outputs.server-src-ref }}
        run: go test -tags=integration -count=1 ./...
