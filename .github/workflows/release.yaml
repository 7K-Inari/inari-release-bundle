name: release

# Runs after a Release PR is merged to main: creates per-chart tags +
# GitHub Releases via release-please, then publishes the released charts
# to GHCR as OCI artifacts. Not tag-triggered: tags are created here.
on:
  push:
    branches: [main]
  workflow_dispatch:
    # Repair path (still workflow-driven): force-publish a chart whose
    # publish job previously failed after the release was already tagged.
    inputs:
      chart-path:
        description: 'Chart path to (re)publish, e.g. charts/inari-platform'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  # release-please comments on the merged Release PR; the Actions token
  # classifies PR conversation comments under pull-requests (and issues).
  issues: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      paths_released: ${{ steps.rp.outputs.paths_released || steps.disp.outputs.paths || '[]' }}
    steps:
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Dispatch override
        id: disp
        if: github.event_name == 'workflow_dispatch'
        env:
          CHART_PATH: ${{ inputs.chart-path }}
        run: |
          path="$CHART_PATH"
          test -f "$path/Chart.yaml" || { echo "no Chart.yaml at $path"; exit 1; }
          jq -n --arg p "$path" '[$p]' > /dev/null  # validate
          echo "paths=$(jq -cn --arg p "$path" '[$p]')" >> "$GITHUB_OUTPUT"
      - if: github.event_name != 'workflow_dispatch'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: rp
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # Detect merged Release PRs + create tags/Releases only; PR
          # maintenance lives in release-please.yml (skip-github-release).
          skip-github-pull-request: true

  publish:
    needs: detect
    if: needs.detect.outputs.paths_released != '' && needs.detect.outputs.paths_released != '[]'
    strategy:
      fail-fast: false
      matrix:
        chart-path: ${{ fromJSON(needs.detect.outputs.paths_released) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.0

      - name: Set up chart-testing
        # v2.8.0: fixes sigstore/cosign-installer v3.8.1 (pinned inside v2.7.0)
        # failing with "Unable to validate cosign version: 'v2.4.1'".
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
        with:
          version: v3.14.0

      - name: Resolve chart name and version
        id: chart
        run: |
          CHART_PATH="${{ matrix.chart-path }}"
          echo "name=$(basename "$CHART_PATH")" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '."'$CHART_PATH'"' .release-please-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: chart-testing lint
        run: ct lint --config ct.yaml --charts "${{ matrix.chart-path }}" --validate-maintainers=false

      - name: Package chart
        run: |
          helm dependency build "${{ matrix.chart-path }}"
          mkdir -p dist
          helm package "${{ matrix.chart-path }}" -d dist

      - name: Verify package version matches manifest
        run: |
          ls "dist/${{ steps.chart.outputs.name }}-${{ steps.chart.outputs.version }}.tgz"

      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push chart as OCI artifact
        # Org-level namespace shared with the agent/operator charts; never
        # derive this from the repo name (the repo was renamed once already).
        run: helm push "dist/${{ steps.chart.outputs.name }}-${{ steps.chart.outputs.version }}.tgz" oci://ghcr.io/7k-inari/charts

      - name: Verify published chart
        run: |
          TAG="${{ steps.chart.outputs.version }}"
          for i in $(seq 1 12); do
            if helm show chart "oci://ghcr.io/7k-inari/charts/${{ steps.chart.outputs.name }}" --version "$TAG" > /dev/null 2>&1; then
              echo "Published ${{ steps.chart.outputs.name }}:$TAG verified"
              exit 0
            fi
            sleep 5
          done
          echo "::error::chart not visible in GHCR after push"
          exit 1
