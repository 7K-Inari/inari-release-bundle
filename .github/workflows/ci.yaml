name: ci

on:
  pull_request:
    paths-ignore: ["**.md"]

permissions:
  contents: read
  # ArgoCD pulls the inari-* OCI charts from ghcr.io during bootstrap.
  packages: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.1

      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5

      - name: Set up chart-testing
        # v2.8.0: fixes sigstore/cosign-installer v3.8.1 (pinned inside v2.7.0)
        # failing with "Unable to validate cosign version: 'v2.4.1'".
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
        with:
          version: v3.15.0

      - name: Set up helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --verify=false --version v1.1.2

      - name: Shellcheck scripts
        run: |
          sudo apt-get update -y && sudo apt-get install -y shellcheck
          shellcheck -S warning scripts/*.sh scripts/lib/*.sh
          bash -n scripts/*.sh scripts/lib/*.sh

      - name: helm lint
        run: |
          helm lint charts/inari-platform
          # inari-server has subchart deps (redis, nats) that must resolve first
          helm dependency build charts/inari-server
          helm lint charts/inari-server
          helm lint charts/inari-console
          helm lint charts/inari-platform-graphs --set keycloak.enabled=true --set keycloak.issuerBaseURL=https://keycloak.example.org

      - name: helm unittest
        run: helm unittest charts/inari-platform charts/inari-server charts/inari-console charts/inari-platform-graphs

      - name: e2e helper unit tests
        # The .mjs/.ts decision-logic tests for the e2e harness (env contract,
        # git probe, flake reporter, quarantine automation, poll contract) —
        # previously only run locally, so a contract break (e.g. poll's
        # void-fn rule) shipped silently.
        run: |
          node --test --experimental-strip-types \
            scripts/e2e/ui/helpers/poll.test.ts \
            scripts/e2e/ui/helpers/env.test.ts \
            scripts/e2e/ui/helpers/git.test.ts \
            scripts/e2e/ui/report-flakes.test.mjs \
            scripts/e2e/ui/quarantine-issues.test.mjs

      - name: Set up Go (e2e seed)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: scripts/e2e/seed/go.mod

      - name: e2e seed unit tests (go test)
        # The persona seed / handoff publisher (scripts/e2e/seed) — decision
        # logic, client wire shapes, handoff contract with the stack suite.
        working-directory: scripts/e2e/seed
        run: go test ./...

      - name: e2e scan-gate unit tests (go test)
        # The Harbor/Trivy scan-gate driver (scripts/e2e/scan) — poll state
        # machine, threshold math, JUnit wrapper, Harbor API encoding. Same
        # Go toolchain as the seed (both go.mod files pin go 1.26).
        working-directory: scripts/e2e/scan
        run: go test ./...

      - name: chart-testing lint
        run: ct lint --config ct.yaml

      - name: Validate gitops manifests
        run: |
          # kustomize overlay must build (pulls the upstream keycloak-operator
          # manifests and applies the cluster-wide patch)
          kubectl kustomize gitops/operators/keycloak-operator > /dev/null
          kubectl kustomize gitops/operators/crossplane-provider-keycloak > /dev/null
          # every Application points at a declared sync wave
          for f in gitops/operators/*.yaml gitops/platform/*.yaml gitops/apps/*.yaml; do
            grep -q 'argocd.argoproj.io/sync-wave' "$f" || { echo "$f: missing sync-wave annotation"; exit 1; }
          done

  # The kind-based install-test job (bootstrap + backup/DR drill on
  # helm/kind-action clusters, fed by the prep job's image-tar cache) was
  # REMOVED 2026-11-07 with the rest of the kind-era CI machinery
  # (scripts/ci/{kind-config.yaml,images.txt,normalize-image-tar.py}). It had
  # been disabled (if: false) since 2026-10-31 — the bootstrap gate wedged on
  # Application/platform-rgd health (provider-keycloak's
  # ClusterProviderConfig never writes status.conditions, so ArgoCD's stock
  # *.crossplane.io wildcard health check holds it "Progressing" forever;
  # scripts/install-argocd.sh patches argocd-cm with a health override, see
  # git history). The stack gate is being rebuilt on Argo Workflows
  # (gitops/e2e/argo-workflows/, invoked via release-e2e.yaml) — the kind job
  # is not coming back; recover it from git history if ever needed.
