name: edge

# Per-merge edge releases: every push to main publishes each chart at
# <pending-version>-<shortsha> to the org OCI namespace, cuts a per-chart
# GitHub prerelease, and moves the `edge` channel tag/release to the latest
# merge. Stable releases are untouched — release.yaml owns those. Skipped
# when the push is itself a release merge (stable publishes cover that
# commit).
on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: edge-main
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - name: Skip on release merges
        id: gate
        # Same guard as release-please.yml: the release merge is covered by
        # the stable release.yaml run.
        run: |
          set -euo pipefail
          msg="$(git log -1 --pretty=%s)"
          parent2=""
          if [ "$(git rev-list --parents -n1 HEAD | wc -w)" -gt 2 ]; then
            parent2="$(git log -1 --pretty=%s HEAD^2)"
          fi
          if echo "$msg" | grep -qiE '^chore(\(.*\))?: release' \
             || echo "$parent2" | grep -qiE '^chore(\(.*\))?: release'; then
            echo "release merge detected ($msg) — skipping edge"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  resolve:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve edge version per chart
        id: versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          entries="[]"
          for chart_yaml in charts/*/Chart.yaml; do
            chart_path="$(dirname "$chart_yaml")"
            version="$(scripts/resolve-edge-version.sh "$chart_path")"
            entries="$(jq -c --arg p "$chart_path" --arg v "$version" '. + [{path: $p, version: $v}]' <<< "$entries")"
          done
          echo "matrix=$entries" >> "$GITHUB_OUTPUT"

  publish:
    needs: resolve
    if: needs.resolve.outputs.matrix != '' && needs.resolve.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ubuntu-latest
    env:
      CHART_PATH: ${{ matrix.chart.path }}
      EDGE_VERSION: ${{ matrix.chart.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.0

      - name: Package chart at edge version
        run: |
          if grep -q '^dependencies:' "$CHART_PATH/Chart.yaml"; then
            helm dependency build "$CHART_PATH"
          fi
          mkdir -p dist
          helm package "$CHART_PATH" --version "$EDGE_VERSION" -d dist

      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push chart as OCI artifact
        run: helm push "dist/$(basename "$CHART_PATH")-${EDGE_VERSION}.tgz" oci://ghcr.io/7k-inari/charts

      - name: Create edge prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name="$(basename "$CHART_PATH")"
          tag="${name}-v${EDGE_VERSION}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "prerelease $tag already exists — skipping create (workflow rerun)"
          else
            gh release create "$tag" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "$name $EDGE_VERSION" \
              --notes "Edge build of chart \`$name\` from ${GITHUB_SHA}. OCI: \`oci://ghcr.io/7k-inari/charts/${name}:${EDGE_VERSION}\`. Latest edge channel: the moving \`edge\` tag. Superseded by the next stable \`${name}-vX.Y.Z\` release."
          fi

  channel:
    needs: [resolve, publish]
    if: always() && needs.resolve.outputs.matrix != '' && needs.resolve.outputs.matrix != '[]' && needs.publish.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Move the edge channel tag + release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHARTS: ${{ needs.resolve.outputs.matrix }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f edge "$GITHUB_SHA"
          git push -f origin refs/tags/edge
          list="$(jq -r '.[] | "- \(.path | sub("charts/"; "")): oci://ghcr.io/7k-inari/charts/\(.path | sub("charts/"; "")):\(.version)"' <<< "$CHARTS")"
          title="edge (${GITHUB_SHA:0:7})"
          notes="$(printf 'Latest edge build from %s.\n\nCharts:\n%s' "$GITHUB_SHA" "$list")"
          if gh release view edge > /dev/null 2>&1; then
            gh release edit edge --prerelease --title "$title" --notes "$notes"
          else
            gh release create edge --prerelease --target "$GITHUB_SHA" --title "$title" --notes "$notes"
          fi
