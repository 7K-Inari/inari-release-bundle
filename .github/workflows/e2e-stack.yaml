name: e2e-stack

# Reusable full-stack e2e leg (migration phase 4 of the golden-path design,
# plan §3 phase 4 + §6.4/§6.5): the ONE shared definition of stack bring-up,
# follow-on suites, artifacts and teardown. Callers:
#   - release-e2e.yaml job golden-path (mode=gate, HA matrix) — Release-PR
#     gate; quarantined tests (Playwright @quarantine AND Ginkgo
#     Label("quarantine")) NEVER run here.
#   - e2e-nightly.yaml job nightly-stack (mode=nightly, non-HA) — full
#     Playwright suite incl. @quarantine (continue-on-error) and the Go
#     stack suite with the p0||p1||p2 label filter (includes quarantine);
#     artifacts 14 days.
#
# A workflow_call job is job-level: callers cannot add steps before/after,
# and the api-schema/UI suites must share the runner with the kind cluster —
# so this workflow owns the entire leg and selects behavior via `mode`.
#
# KEEP_CLUSTER: the Go suite always runs with KEEP_CLUSTER=<keep-cluster>
# (default true) so the api-schema/UI/diagnostics steps have a live stack,
# and this workflow owns teardown as a final if:always() step. The cluster
# never outlives its runner — there is no cross-job handoff; a hard-killed
# runner is reclaimed by GitHub wholesale (plan §7 risk 10).
on:
  workflow_call:
    inputs:
      mode:
        description: >-
          gate: api-schema + Playwright @p0 minus @quarantine, gating.
          nightly: full Playwright @p0|@p1|@p2 incl. @quarantine
          (continue-on-error) + Go suite with --ginkgo.label-filter=p0||p1||p2.
        required: true
        type: string
      ha:
        description: HA leg — E2E_HA=1, longer timeouts, HA diagnostics.
        required: false
        type: boolean
        default: false
      bundle-ref:
        description: Ref of this repo (charts/scripts under test) to check out.
        required: true
        type: string
      server-src-ref:
        description: inari-server git ref for the Go suites + migrations dir.
        required: true
        type: string
      image-tag:
        description: Published ghcr.io image tag (UNPREFIXED, e.g. 1.8.0).
        required: true
        type: string
      build-from-ref:
        description: >-
          inari-server ref to build the e2e image from instead of pulling
          the published one (repair path). Sentinel "none" = pull published.
        required: false
        type: string
        default: "none"
      cosign-verify:
        description: >-
          Verify the published image with cosign. False only for unsigned
          edge-image repair runs.
        required: false
        type: boolean
        default: true
      branch-hint:
        description: >-
          Branch name matched against inari-agent/inari-operator for the
          component checkouts (fallback main). The reusable workflow cannot
          see the caller's github.head_ref, so callers pass it explicitly.
        required: false
        type: string
        default: main
      keep-cluster:
        description: >-
          KEEP_CLUSTER value for the Go suite. Teardown is always owned by
          this workflow's final step; false only shortens the window.
        required: false
        type: boolean
        default: true
      retention-days:
        description: Artifact retention (gate 7, nightly 14).
        required: false
        type: number
        default: 7

permissions:
  contents: read

env:
  # Artifact name suffix: gate keeps the historical ui-e2e-ha-<bool> /
  # golden-path-go-ha-<bool> names; nightly uses its own.
  LEG: ${{ inputs.mode == 'nightly' && 'nightly' || format('ha-{0}', inputs.ha) }}

jobs:
  stack:
    name: e2e-stack (${{ inputs.mode }}, E2E_HA=${{ inputs.ha && '1' || '0' }})
    runs-on: ubuntu-latest
    # Gate legs keep the historical 45/60 (plan §6.2 budget). The nightly
    # needs more: same bring-up + FULL Go assertions (-timeout 40m) + the
    # FULL Playwright suite @p0|@p1|@p2 on one runner (the pre-extraction
    # nightly had 60m with provision-only + UI).
    timeout-minutes: ${{ inputs.mode == 'nightly' && 75 || (inputs.ha && 60 || 45) }}
    env:
      IMAGE_REF: ghcr.io/7k-inari/inari-server:${{ inputs.image-tag }}
    steps:
      # ubuntu-26.04 runners default docker to the containerd image store,
      # whose docker save export breaks kind side-loads downstream (dangling
      # OCI index entries, attestation unpack failures). Force the classic
      # image store for save/load fidelity.
      - name: Use classic docker image store
        run: |
          set -euo pipefail
          if [ -f /etc/docker/daemon.json ]; then
            jq '.features["containerd-snapshotter"] = false' /etc/docker/daemon.json | sudo tee /etc/docker/daemon.json > /dev/null
          else
            echo '{"features":{"containerd-snapshotter":false}}' | sudo tee /etc/docker/daemon.json > /dev/null
          fi
          sudo systemctl restart docker
          docker info --format 'storage-driver={{.Driver}}'

      - name: Checkout inari-server (Go suites + migrations dir)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: 7K-Inari/inari-server
          ref: ${{ inputs.server-src-ref }}
          path: inari-server

      - name: Checkout bundle (charts under test)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.bundle-ref }}
          path: bundle

      - name: Resolve matching inari-agent ref
        id: agent
        env:
          BRANCH: ${{ inputs.branch-hint }}
        run: |
          if git ls-remote --exit-code https://github.com/7K-Inari/inari-agent.git \
            "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout inari-agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: 7K-Inari/inari-agent
          ref: ${{ steps.agent.outputs.ref }}
          path: inari-agent

      - name: Resolve matching inari-operator ref
        id: operator
        env:
          BRANCH: ${{ inputs.branch-hint }}
        run: |
          if git ls-remote --exit-code https://github.com/7K-Inari/inari-operator.git \
            "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout inari-operator (operator + console smoke charts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: 7K-Inari/inari-operator
          ref: ${{ steps.operator.outputs.ref }}
          path: inari-operator

      - name: Set up Go
        # The stack suite is what runs here — pin the toolchain to ITS
        # module (the nested module under scripts/e2e/stack).
        # cache-dependency-path: the module is nested, so setup-go's
        # default go.sum discovery would miss it and cache nothing.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: bundle/scripts/e2e/stack/go.mod
          cache-dependency-path: bundle/scripts/e2e/stack/go.sum

      - name: Install cosign
        if: inputs.build-from-ref == 'none' && inputs.cosign-verify
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Pull and verify published server image
        # Prefer the cosign-signed artifact that actually ships over a
        # rebuild. The pulled image is re-tagged to `inari/server:e2e` —
        # the tag the Go stack provisioner loads into kind — so no rebuild
        # happens. cosign verification is skipped only for unsigned
        # edge-image repair runs (cosign-verify=false).
        if: inputs.build-from-ref == 'none'
        run: |
          set -euo pipefail
          if [ "${{ inputs.cosign-verify }}" = "true" ]; then
            cosign verify "$IMAGE_REF" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp https://github.com/7K-Inari/inari-server/
          else
            echo "cosign-verify=false — skipping verification (unsigned edge image)"
          fi
          docker pull "$IMAGE_REF"
          docker tag "$IMAGE_REF" inari/server:e2e

      - name: Set up Docker Buildx
        # The agent image is ALWAYS built in-job (there is no published
        # agent tag to pull) — the GHA layer cache turns every rebuild
        # after the first into a cache replay. The server repair-path
        # build below uses the same cache backend (own scope).
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build server image from ref
        # Repair path for unreleased combos.
        if: inputs.build-from-ref != 'none'
        working-directory: inari-server
        run: |
          git checkout "${{ inputs.build-from-ref }}"
          docker buildx build --load \
            --cache-from type=gha,scope=inari-server \
            --cache-to type=gha,mode=max,scope=inari-server \
            -f deploy/docker/Dockerfile -t inari/server:e2e .

      - name: Build agent image
        run: >-
          docker buildx build --load
          --cache-from type=gha,scope=inari-agent
          --cache-to type=gha,mode=max,scope=inari-agent
          -f inari-agent/Dockerfile -t inari/agent:e2e ./inari-agent

      - name: Install kind
        # The Go provisioner creates the cluster itself (it needs a custom
        # extraMounts config for the git hostPath), so only the binary is
        # installed here. One cluster name for both modes — per-runner
        # isolation makes a nightly-specific name unnecessary.
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: inari-e2e
          install_only: true

      # --- CI caching (see scripts/e2e/README.md "CI caching") -----------
      # The whole stack's images are pinned in
      # bundle/scripts/e2e/stack/testdata/images.txt; that file's hash IS
      # the cache key, so any pin bump misses the cache. No restore-keys:
      # a near-miss would load the wrong images silently. Mechanism choice:
      # a single docker-save tar + `kind load image-archive` was chosen
      # over a runner-local registry + containerd mirror — fewer moving
      # parts, no mirror plumbing in the suite's kind config, identical on
      # the HA leg (kind load targets every node of the cluster).
      - name: Cache e2e image tar
        id: imgcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/e2e-images/images.tar
          key: e2e-images-v3-${{ runner.os }}-${{ hashFiles('bundle/scripts/e2e/stack/testdata/images.txt') }}

      - name: Pull + save images (cache miss)
        if: steps.imgcache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          t0=$(date +%s)
          mkdir -p /tmp/e2e-images
          MANIFEST=bundle/scripts/e2e/stack/testdata/images.txt
          grep -vE '^\s*(#|$)' "$MANIFEST" | xargs -P8 -n1 docker pull
          grep -vE '^\s*(#|$)' "$MANIFEST" | xargs docker save -o /tmp/e2e-images/images.tar
          # containerd-store docker exports dangling index entries (unpulled
          # platforms/attestations) that break ctr import in kind load
          python3 bundle/scripts/ci/normalize-image-tar.py /tmp/e2e-images/images.tar
          echo "[timing] image pull+save (miss): $(( $(date +%s) - t0 ))s"

      - name: Pre-create cluster + preload images
        # The Go suite adopts this cluster (E2E_ADOPT_CLUSTER=1) and reuses
        # the fixed git host dir (GIT_HOST_DIR) — it must NOT recreate it,
        # or the preloaded images would be lost. docker load is only needed
        # for the kindest/node image (kind create resolves it from the
        # local daemon); `kind load image-archive` reads the tar directly.
        run: |
          set -euo pipefail
          MANIFEST=bundle/scripts/e2e/stack/testdata/images.txt
          # Strip the digest for kind create: `docker load` does NOT restore
          # RepoDigests, so `docker inspect repo:tag@digest` fails on the
          # loaded image and kind's inspect-then-pull would re-fetch the
          # manifest from Docker Hub on every cache hit. The plain tag
          # inspects fine after load; its content was already pinned by the
          # digest-pinned pull on the miss path. The manifest keeps the
          # digest — it is the cache-key input and the pull pin.
          NODE_IMAGE=$(grep '^kindest/node' "$MANIFEST" | cut -d@ -f1)
          t0=$(date +%s)
          docker load -i /tmp/e2e-images/images.tar
          echo "[timing] docker load: $(( $(date +%s) - t0 ))s"

          mkdir -p /tmp/inari-e2e-git && chmod 777 /tmp/inari-e2e-git
          {
            echo "kind: Cluster"
            echo "apiVersion: kind.x-k8s.io/v1alpha4"
            echo "nodes:"
            echo "  - role: control-plane"
            echo "    image: $NODE_IMAGE"
            echo "    extraMounts:"
            echo "      - hostPath: /tmp/inari-e2e-git"
            echo "        containerPath: /git"
            # NodePort mappings for the browser path (UI e2e): no per-connection
            # port-forward state to lose mid-suite (the migrating UI stalls).
            echo "    extraPortMappings:"
            echo "      - containerPort: 30080  # inari-console -> host 127.0.0.1:18080"
            echo "        hostPort: 18080"
            echo "      - containerPort: 30090  # inari-server -> host 127.0.0.1:18090"
            echo "        hostPort: 18090"
            echo "      - containerPort: 30081  # keycloak -> host 127.0.0.2:8080 (browser)"
            echo "        hostPort: 8080"
            echo '        listenAddress: "127.0.0.2"'
            echo "      - containerPort: 30082  # keycloak -> host 127.0.0.1:18091 (api-schema step)"
            echo "        hostPort: 18091"
          } > /tmp/kind-config.yaml
          t0=$(date +%s)
          kind create cluster --name inari-e2e --config /tmp/kind-config.yaml --wait 60s
          echo "[timing] kind create: $(( $(date +%s) - t0 ))s"

          t0=$(date +%s)
          kind load image-archive /tmp/e2e-images/images.tar --name inari-e2e
          echo "[timing] kind load image-archive: $(( $(date +%s) - t0 ))s"

      - name: Cache helm repo index + charts
        # Repo adds/index downloads (~30-60s across 6 repos). BOTH dirs are
        # needed: ~/.config/helm holds repositories.yaml, ~/.cache/helm the
        # index files. On a hit the suite + install-operators.sh run with
        # HELM_REPOS_SEEDED=1 and SKIP repo add/update — without that skip
        # the cache is dead weight, because add/update always re-fetch every
        # index over the network. Keyed on the image manifest because it
        # records the chart pins; a chart bump changes the manifest -> fresh
        # index. Soft restore-key: a stale index missing a newly pinned
        # version fails loudly (version not found) — the correct signal to
        # regenerate images.txt.
        id: helmcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/helm
            ~/.config/helm
          key: helm-${{ runner.os }}-${{ hashFiles('bundle/scripts/e2e/stack/testdata/images.txt') }}
          restore-keys: helm-${{ runner.os }}-

      - name: Provision + assert golden path (Go stack suite)
        # The stack suite provisions the whole stack in-process (kind
        # cluster incl. the git hostPath mount, operators, every helm chart
        # in dependency layers, KC seeding, tenant/cluster/agent), then runs
        # the golden-path assertions as a Ginkgo suite (per-spec failure
        # identity + native JUnit in CI output). E2E_HA=1 flips the helm
        # replica values AND unlocks the disruption specs. Quarantined specs
        # (Ginkgo Label "quarantine") are excluded by the gate's label
        # filter — nightly mode selects the full priority surface INCLUDING
        # quarantine (same rule as inari-server's flaky build tag). The
        # stack suite is a nested Go module: go test must run from INSIDE
        # it. -timeout exceeds the 10m go test default.
        working-directory: bundle/scripts/e2e/stack
        env:
          E2E_HA: ${{ inputs.ha && '1' || '0' }}
          KEEP_CLUSTER: ${{ inputs.keep-cluster }}
          # Adopt the pre-created, image-preloaded cluster (see the preload
          # step above) instead of recreating an empty one.
          E2E_ADOPT_CLUSTER: '1'
          GIT_HOST_DIR: /tmp/inari-e2e-git
          # Helm cache hit => repo config + index were restored; the suite
          # and install-operators.sh skip repo add/update (they would
          # re-fetch every index and defeat the cache).
          HELM_REPOS_SEEDED: ${{ steps.helmcache.outputs.cache-hit == 'true' && '1' || '0' }}
          E2E_HANDOFF_PATH: /tmp/inari-e2e-handoff.json
          E2E_MIGRATIONS_DIR: ${{ github.workspace }}/inari-server/internal/db/migrations
          # Space-free label filters: the release gate runs
          # (p0||smoke)&&!quarantine, the nightly the full p0|p1|p2 surface
          # including quarantine-labeled specs.
          GINKGO_LABEL_FILTER: ${{ inputs.mode == 'nightly' && 'p0||p1||p2' || '(p0||smoke)&&!quarantine' }}
        run: |
          set -euo pipefail
          AGENT_CHART_DIR=${{ github.workspace }}/inari-agent/charts/inari-agent
          OPERATOR_CHART_DIR=${{ github.workspace }}/inari-operator/charts/inari-operator
          go test -tags=e2e -count=1 -timeout ${{ inputs.ha && '50m' || '40m' }} -json ./... \
            -args "--ginkgo.label-filter=${GINKGO_LABEL_FILTER}" \
                  --ginkgo.junit-report=/tmp/golden-path-junit.xml \
            2>&1 | tee /tmp/golden-path-go.json

      - name: Run api-schema e2e against the live stack
        # Gate-only: the driver imports inari-server modules and reads
        # dist/openapi.yaml (generated here — not committed at server tags).
        if: inputs.mode == 'gate'
        working-directory: inari-server
        run: |
          set -euo pipefail
          # server-src-ref=main has no e2e/ dir (assets relocated to the
          # bundle in inari-server #122; released tags still have one).
          mkdir -p e2e
          cp "${{ github.workspace }}/bundle/scripts/e2e/api/api_schema_e2e_test.go" e2e/
          make export-openapi
          # NodePort (see the UI step): stable across pod churn; no
          # port-forward to die silently mid-step.
          kubectl -n inari patch svc inari-server --type=strategic -p \
            '{"spec":{"type":"NodePort","ports":[{"port":8080,"nodePort":30090}]}}'
          kubectl -n inari patch svc keycloak-service --type=strategic -p \
            '{"spec":{"type":"NodePort","ports":[{"port":8080,"nodePort":30082}]}}'
          # KC for this step stays on 127.0.0.1:18091 (no browser here, so no
          # issuer-hostname mapping needed) — via NodePort 30082 on the
          # control-plane container's second mapping.
          for url in http://127.0.0.1:18090/healthz http://127.0.0.1:18091/realms/inari; do
            for i in $(seq 1 30); do
              curl -sf -o /dev/null "$url" && break
              [ "$i" = 30 ] && { echo "endpoint $url never came up" >&2; exit 1; }
              sleep 2
            done
          done
          E2E_BASE_URL=http://127.0.0.1:18090 \
          E2E_KEYCLOAK_URL=http://127.0.0.1:18091 \
          E2E_OPENAPI="${{ github.workspace }}/inari-server/dist/openapi.yaml" \
          go test -tags=e2e ./e2e/ -run TestAPISchemaConformance -count=1 -v

      - name: Resolve Playwright cache key
        # $ImageVersion is set on GH-hosted runners (not visible to
        # workflow expressions, so it is resolved in a step): runner image
        # bumps change the browser's system deps, so they must invalidate
        # the cache cleanly instead of restoring broken browsers.
        id: pwkey
        run: >-
          echo "key=playwright-${{ runner.os }}-${ImageVersion:-unknown}-${{
          hashFiles('bundle/scripts/e2e/ui/package-lock.json') }}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pwkey.outputs.key }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Run console UI e2e (Playwright)
        # Gate: @p0 WITHOUT @quarantine (gating; a quarantined test never
        # blocks a release). Nightly: the FULL suite @p0|@p1|@p2 INCLUDING
        # @quarantine, continue-on-error — signal for the flake sweep, not
        # a gate. Persona seeding + the inari-ui redirect whitelist live in
        # scripts/e2e/ui/seed/seed-personas.mjs; lib/ui-proxy.mjs merges
        # console + API onto one origin for the browser.
        continue-on-error: ${{ inputs.mode == 'nightly' }}
        working-directory: bundle
        env:
          GREP: ${{ inputs.mode == 'nightly' && '@p0|@p1|@p2' || '@p0' }}
          GREP_INVERT: ${{ inputs.mode == 'nightly' && '' || '--grep-invert @quarantine' }}
        run: |
          set -euo pipefail
          # The provisioner pins KC's hostname to the in-cluster issuer
          # (keycloak-service.inari.svc:8080, strict) so server-side OIDC is
          # consistent — but KC renders that hostname into the login FORM
          # action and the discovery endpoints, and a browser on the runner
          # cannot resolve it (the username submit POSTed to
          # keycloak-service.inari.svc:8080 and died). Map the issuer
          # hostname to a dedicated loopback alias and forward KC there on
          # its canonical port: the browser then talks to KC at the EXACT
          # issuer URL, so forms, redirects, discovery and token iss all
          # line up without touching the pinned hostname. 127.0.0.2 keeps
          # 8080 free for the ui-proxy on 127.0.0.1.
          grep -q "keycloak-service.inari.svc" /etc/hosts || \
            echo "127.0.0.2 keycloak-service.inari.svc" | sudo tee -a /etc/hosts
          KC=http://keycloak-service.inari.svc:8080
          # API_BASE must include /api/v1: the ui-proxy routes /api/* to the
          # server and everything else to the console — without the prefix
          # the suite's REST client got the SPA's index.html ("<!doctype").
          export KC_URL="$KC" KC_HOST="keycloak-service.inari.svc:8080" \
            API_BASE="http://127.0.0.1:8080/api/v1"

          # NodePort, not port-forwards: kind extraPortMappings (control-plane
          # container) carry host 18080/18090/127.0.0.2:8080 straight to the
          # Services, immune to pod churn and apiserver watch resets — the
          # failure mode behind the migrating UI-suite stalls (2026-10-14).
          # kubectl port-forward remains in use only inside the Go suite.
          pkill -f "kubectl -n inari port-forward" 2>/dev/null || true
          # KC's nodePort is handed off: 30082 (api-schema step) -> 30081
          # here (browser path via the 127.0.0.2 issuer alias).
          for spec in "inari-console 80 30080" "inari-server 8080 30090" "keycloak-service 8080 30081"; do
            set -- $spec
            # Strategic merge: Service ports merge by the "port" key, so
            # targetPort/name survive; only type + nodePort change.
            kubectl -n inari patch svc "$1" --type=strategic -p \
              '{"spec":{"type":"NodePort","ports":[{"port":'$2',"nodePort":'$3'}]}}'
          done

          # Wait for the re-patched NodePort routes to actually accept
          # connections before seeding: the nodePort switch above (30082 ->
          # 30081 for KC) races kube-proxy/iptables programming, and a fetch
          # in that window fails instantly ("seed-personas: FAIL: fetch
          # failed", observed 2026-10-14).
          for url in "http://127.0.0.1:18090/healthz" "$KC/realms/inari"; do
            for i in $(seq 1 30); do
              curl -sf -o /dev/null "$url" && break
              [ "$i" = 30 ] && { echo "endpoint $url never came up" >&2; exit 1; }
              sleep 2
            done
          done

          # Seed the e2e personas (idempotent) and whitelist the browser
          # origin on the realm-imported inari-ui client. Fails the job here —
          # before browser install — if the membership API is broken (P0).
          node scripts/e2e/ui/seed/seed-personas.mjs

          # Point the SPA's Keycloak URL at the browser-reachable KC (which
          # is also the issuer URL, so no hostname mismatch anywhere).
          # --force-conflicts: the NodePort re-patch above owns spec.type via
          # kubectl-patch, and runner helm (v4) applies server-side by
          # default — without this the upgrade fails on a .spec.type SSA
          # conflict. The re-patch after the rollout re-asserts NodePort.
          helm upgrade inari-console charts/inari-console --namespace inari \
            --reuse-values --set keycloakUrl="$KC" --force-conflicts
          kubectl -n inari rollout status deployment/inari-console --timeout=180s

          # The console rollout may reset the Service back to ClusterIP (the
          # chart renders type: ClusterIP) — re-assert the NodePort mapping.
          kubectl -n inari patch svc inari-console --type=strategic -p \
            '{"spec":{"type":"NodePort","ports":[{"port":80,"nodePort":30080}]}}'
          # The endpoints must actually accept connections before the proxy
          # and the browser hit them (a pending NodePort route fails
          # identically to a dead forward).
          for url in http://127.0.0.1:18080 http://127.0.0.1:18090/healthz "$KC/realms/inari"; do
            for i in $(seq 1 30); do
              curl -sf -o /dev/null "$url" && break
              [ "$i" = 30 ] && { echo "endpoint for $url never came up" >&2; exit 1; }
              sleep 2
            done
          done
          # Diagnostics for the browser-side auth init: the served SPA config
          # MUST point keycloakUrl at the browser-reachable forward, and KC's
          # discovery document must be fetchable cross-origin (keycloak-js).
          echo "--- served config.js ---"
          curl -sf http://127.0.0.1:18080/config.js || echo "config.js NOT served"
          echo "--- KC discovery (browser path) ---"
          curl -sf -H "Origin: http://127.0.0.1:8080" \
            "$KC/realms/inari/.well-known/openid-configuration" \
            | head -c 400 || echo "discovery NOT fetchable"
          echo

          # Supervised like the forwards: a crashed proxy fails every hop
          # while all direct probes stay green (observed 2026-10-14).
          while :; do node scripts/e2e/lib/ui-proxy.mjs; sleep 1; done &
          PROXY_PID=$!
          trap 'kill $PROXY_PID 2>/dev/null || true' EXIT

          # Stall observability: probe every browser-path hop every 15s for
          # the whole suite and print the timeline at teardown. The migrating
          # UI failures all smell like a stalled hop; this pinpoints which
          # one instead of guessing from failure screenshots.
          PROBE_LOG=/tmp/ui-path-probe.log; : > "$PROBE_LOG"
          # Fail-fast: when the proxy hop dies 3 probes running, every
          # browser/API call is failing and the suite can only burn timeouts
          # for 10-20min (observed 2026-10-14, proxy crash). Kill playwright
          # so the run fails in seconds WITH the probe timeline, instead of
          # after a wall of misleading per-test timeouts.
          consecutive_proxy_fail=0
          while :; do
            line="$(date +%H:%M:%S)"
            for hop in "console-direct http://127.0.0.1:18080/config.js"                        "server-direct http://127.0.0.1:18090/healthz"                        "kc-direct http://keycloak-service.inari.svc:8080/realms/inari/.well-known/openid-configuration"                        "proxy-console http://127.0.0.1:8080/config.js"                        "proxy-api http://127.0.0.1:8080/api/v1/openapi.json"; do
              name=${hop%% *}; url=${hop#* }
              code=$(curl -sS -m 5 -o /dev/null -w "%{http_code}" "$url" 2>/dev/null || echo FAIL)
              line="$line $name=$code"
            done
            echo "$line" >> "$PROBE_LOG"
            if echo "$line" | grep -q "proxy-console=000FAIL"; then
              consecutive_proxy_fail=$((consecutive_proxy_fail+1))
            else
              consecutive_proxy_fail=0
            fi
            if [ "$consecutive_proxy_fail" -ge 3 ]; then
              echo "$(date +%H:%M:%S) FATAL: proxy hop dead 3 probes in a row — killing the suite (see timeline above)" >> "$PROBE_LOG"
              pkill -f "playwright test" || true
              consecutive_proxy_fail=0
            fi
            sleep 15
          done &
          PROBE_PID=$!
          trap 'kill $PROBE_PID $PROXY_PID 2>/dev/null || true; echo "--- ui path probe ---"; cat /tmp/ui-path-probe.log' EXIT
          cd scripts/e2e/ui
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --config playwright.config.ci.ts --grep "$GREP" $GREP_INVERT

      - name: Report UI e2e flakes
        # Post-process the Playwright JSON report: any test that passed
        # only after a retry is a flake candidate. Never fails; writes
        # test-results/flake-report.json (uploaded below) for the nightly
        # quarantine sweep.
        if: always()
        working-directory: bundle/scripts/e2e/ui
        run: node report-flakes.mjs

      - name: Upload flake report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-e2e-flakes-${{ env.LEG }}
          path: bundle/scripts/e2e/ui/test-results/flake-report.json
          if-no-files-found: ignore
          retention-days: ${{ inputs.retention-days }}

      - name: Upload UI e2e artifacts
        # Gate: failure-only (PR #63 convention). Nightly: always — the
        # full results feed the flake/quarantine triage.
        if: failure() || inputs.mode == 'nightly'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-e2e-${{ env.LEG }}
          path: |
            bundle/scripts/e2e/ui/test-results/
            bundle/scripts/e2e/ui/playwright-report/
          if-no-files-found: ignore
          retention-days: ${{ inputs.retention-days }}
          # Traces/videos/screenshots are already zip/mp4/png — skip gzip.
          compression-level: 0

      - name: Collect diagnostics bundle on failure
        if: failure()
        run: |
          set +e
          kubectl config use-context kind-inari-e2e || true
          mkdir -p /tmp/e2e-diag
          kubectl -n inari get pods -o wide > /tmp/e2e-diag/pods.txt 2>&1
          kubectl -n inari get events --sort-by=.lastTimestamp > /tmp/e2e-diag/events.txt 2>&1
          kubectl -n inari describe pods > /tmp/e2e-diag/describe-pods.txt 2>&1
          # Hub prereqs (Phase 0 gitops gap): a failure there (e.g.
          # external-dns Deployment never ready) is invisible from the inari
          # namespaces alone.
          kubectl get pods -A -o wide > /tmp/e2e-diag/pods-all.txt 2>&1
          for ns in cert-manager external-dns external-secrets kro crossplane-system; do
            kubectl -n "$ns" describe pods > "/tmp/e2e-diag/describe-$ns.txt" 2>&1
            for p in $(kubectl -n "$ns" get pods -o name 2>/dev/null); do
              kubectl -n "$ns" logs "$p" --all-containers --prefix --tail=300 2>&1
            done > "/tmp/e2e-diag/logs-$ns.txt" 2>&1
          done
          kubectl -n inari logs -l app.kubernetes.io/name=inari-server --prefix --tail=2000 \
            > /tmp/e2e-diag/inari-server.log 2>&1
          kubectl -n inari logs statefulset/nats --all-containers --tail=500 > /tmp/e2e-diag/nats.log 2>&1
          kubectl -n inari exec deploy/nats-box -- nats stream ls --server nats:4222 \
            > /tmp/e2e-diag/nats-streams.txt 2>&1
          kubectl -n inari exec deploy/nats-box -- nats stream info INARI_OUTBOX --server nats:4222 \
            > /tmp/e2e-diag/nats-outbox-info.txt 2>&1
          kubectl -n inari-system logs deployment/inari-agent --tail=500 > /tmp/e2e-diag/inari-agent.log 2>&1
          kubectl -n inari logs deployment/inari-console --tail=100 > /tmp/e2e-diag/inari-console.log 2>&1
          kubectl -n inari logs deployment/inari-operator --tail=100 > /tmp/e2e-diag/inari-operator.log 2>&1
          cp /tmp/inari-e2e-handoff.json /tmp/e2e-diag/ 2>/dev/null
          if [ "${{ inputs.ha }}" = "true" ]; then
            kubectl -n inari get pdb,deployment inari-server -o wide > /tmp/e2e-diag/ha.txt 2>&1
            PRIMARY=$(kubectl -n inari get cluster.postgresql.cnpg.io/postgresql \
              -o jsonpath='{.status.currentPrimary}' 2>/dev/null)
            if [ -n "$PRIMARY" ]; then
              URI=$(kubectl -n inari get secret inari-db -o jsonpath='{.data.inari-uri}' | base64 -d)
              kubectl -n inari exec "$PRIMARY" -c postgres -- \
                psql "$URI" -c 'SELECT name, holder, expires_at FROM leader_leases' \
                > /tmp/e2e-diag/leader-leases.txt 2>&1
            fi
          fi
          # Keep the summary visible in the job log too.
          cat /tmp/e2e-diag/pods.txt
          tail -100 /tmp/e2e-diag/inari-server.log
          tail -100 /tmp/e2e-diag/inari-agent.log
          exit 0

      - name: Upload Go test JSON + diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: golden-path-go-${{ env.LEG }}
          path: |
            /tmp/golden-path-go.json
            /tmp/golden-path-junit.xml
            /tmp/e2e-diag/
          if-no-files-found: ignore
          retention-days: ${{ inputs.retention-days }}

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name inari-e2e || true
