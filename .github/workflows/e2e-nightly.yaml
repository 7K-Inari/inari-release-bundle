name: e2e-nightly

# Nightly full-surface e2e — NON-BLOCKING by construction: this is a
# separate workflow, nothing references it from branch protection, and the
# Playwright step in the reusable leg is continue-on-error. Nightly failure
# ≠ release gate.
#
# What it does (migration phase 4 — bring-up extracted to e2e-stack.yaml,
# one stack bring-up per run, not per suite):
#   1. resolve        — read charts/inari-server appVersion on main, resolve
#                       the matching inari-server git tag vX.Y.Z.
#   2. nightly-stack  — the reusable e2e-stack.yaml leg (mode=nightly,
#                       non-HA): full bring-up, Go stack suite WITH
#                       -args -include-quarantined (quarantined Go tests run
#                       only here), then the FULL Playwright suite
#                       @p0|@p1|@p2 INCLUDING @quarantine.
#   3. quarantine-sweep — files/dedupes `e2e-flake` issues for tests flaky
#                       in 2+ nightly runs within 7 days. Kept in this
#                       workflow (not the reusable leg) because it needs
#                       issues:write and downloads artifacts, not a cluster.
#   4. kubectl-tunnel — docker-only kubectl gateway chain e2e
#                       (scripts/e2e/kubectl/kubectl-tunnel.sh): kubeproxy
#                       built from the resolved inari-server tag, tunnel-agent
#                       built from inari-agent main; no kind cluster.
#
# Artifacts (flake report + full Playwright results) are retained 14 days.
on:
  schedule:
    # 03:17 UTC daily — off-peak.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read # download prior runs' ui-e2e-flakes artifacts
  issues: write # quarantine-issues.mjs files e2e-flake issues

concurrency:
  group: e2e-nightly
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      server-tag: ${{ steps.resolve.outputs.server-tag }}
      image-tag: ${{ steps.resolve.outputs.image-tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve inari-server tag from chart appVersion
        id: resolve
        run: |
          set -euo pipefail
          app_version="$(awk '/^appVersion:/ {print $2}' charts/inari-server/Chart.yaml | tr -d '"')"
          server_tag="v${app_version#v}"
          # GHCR image tags are UNPREFIXED (1.8.0), git tags are v-prefixed.
          echo "server-tag=$server_tag" >> "$GITHUB_OUTPUT"
          echo "image-tag=${app_version#v}" >> "$GITHUB_OUTPUT"
          if ! git ls-remote --exit-code https://github.com/7K-Inari/inari-server.git \
            "refs/tags/$server_tag" >/dev/null 2>&1; then
            echo "inari-server tag $server_tag does not exist" >&2
            exit 1
          fi
          echo "resolved inari-server tag: $server_tag"

  nightly-stack:
    needs: resolve
    # The reusable leg owns bring-up + both suites + artifacts + teardown.
    # Non-HA only; quarantined tests (Go -include-quarantined and Playwright
    # @quarantine) run ONLY here — never in the release gate.
    uses: ./.github/workflows/e2e-stack.yaml
    with:
      mode: nightly
      ha: false
      bundle-ref: ${{ github.ref }}
      server-src-ref: ${{ needs.resolve.outputs.server-tag }}
      image-tag: ${{ needs.resolve.outputs.image-tag }}
      branch-hint: main
      retention-days: 14

  quarantine-sweep:
    needs: nightly-stack
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Quarantine sweep (file/dedupe e2e-flake issues)
        # Files an `e2e-flake` issue for any test flaky in 2+ nightly runs
        # within 7 days; comments on the existing open issue for the same
        # test path instead of opening duplicates.
        working-directory: scripts/e2e/ui
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node quarantine-issues.mjs

  kubectl-tunnel:
    # Docker-only kubectl gateway e2e (scripts/e2e/kubectl/kubectl-tunnel.sh):
    # kubeproxy (built from inari-server at the resolved tag) → tunnel-agent
    # (built from inari-agent) → real etcd/kube-apiserver/Keycloak/Postgres/
    # OpenFGA containers. No kind cluster needed. Non-blocking like the rest
    # of this workflow; failures here ≠ release gate.
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          path: bundle

      # kubeproxy (cmd/inari-kubeproxy) is not in any inari-server release
      # tag yet — the resolved server-tag (chart appVersion, v3.0.0) predates
      # it, and the script aborts on the missing cmd/inari-kubeproxy dir.
      # Build from main until a release tag contains kubeproxy.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 7K-Inari/inari-server
          ref: main
          path: inari-server

      - name: Resolve matching inari-agent ref
        id: agent
        run: |
          if git ls-remote --exit-code https://github.com/7K-Inari/inari-agent.git \
            "refs/heads/main" >/dev/null 2>&1; then
            echo "ref=main" >> "$GITHUB_OUTPUT"
          else
            echo "no inari-agent main branch" >&2; exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 7K-Inari/inari-agent
          ref: ${{ steps.agent.outputs.ref }}
          path: inari-agent

      - name: Install kubectl
        run: |
          curl -sfL -o kubectl "https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Run kubectl tunnel e2e
        working-directory: bundle/scripts/e2e/kubectl
        env:
          INARI_SERVER_DIR: ${{ github.workspace }}/inari-server
          INARI_AGENT_DIR: ${{ github.workspace }}/inari-agent
        # pipefail so a script failure fails the step despite the tee.
        run: bash -o pipefail -c './kubectl-tunnel.sh 2>&1 | tee "$GITHUB_WORKSPACE/tunnel-e2e.log"'

      - name: Upload tunnel e2e log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kubectl-tunnel-e2e-log
          path: tunnel-e2e.log
          retention-days: 14
          if-no-files-found: ignore
