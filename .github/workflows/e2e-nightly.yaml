name: e2e-nightly

# Nightly GHA remainder — the full-stack nightly moved to the cluster as the
# Argo CronWorkflow e2e-nightly (gitops/e2e/argo-workflows/, 03:17 UTC, full
# surface incl. quarantined, HA). What stays here is what needs GitHub, not
# a cluster:
#   1. quarantine-sweep — the ReportPortal-fed quarantine pipeline
#      (docs/e2e/test-taxonomy.md §4):
#      a. sweep: queries the inari-e2e ReportPortal project for tests
#         unstable (flaky: passed after retry / recurring failure) in 2+
#         nightly launches within 7 days and files/dedupes `e2e-flake`
#         issues. RP visualizes, GitHub issues act.
#      b. expiry (14/30-day policy): 14 days without human activity on an
#         open e2e-flake issue ⇒ warning comment; 30 days ⇒ escalation +
#         `quarantine-overdue` label (the test must be fixed, re-scoped, or
#         deleted — enforcement is human, the sweep never closes/deletes).
#      c. budget: quarantined-test count (grepped from the specs) in a
#         pinned [quarantine-budget] issue; over QUARANTINE_BUDGET (10) is
#         flagged. NEEDS issues:write.
#      Auth: read-only ReportPortal API key from the REPORTPORTAL_API_KEY
#      repo secret (RP user e2e-sweeper, project role CUSTOMER — owner
#      action, gitops/e2e/README.md §Prerequisites; NOT the importer key,
#      which stays cluster-only). Missing key/unreachable RP ⇒ the sweep
#      skips with a warning (exit 0); expiry + budget are GitHub-only and
#      always run. DRY_RUN=1 plans without mutating GitHub.
#   2. kubectl-tunnel — docker-only kubectl gateway chain e2e
#      (scripts/e2e/kubectl/kubectl-tunnel.sh): kubeproxy built from
#      inari-server main, tunnel-agent built from inari-agent main; no kind
#      cluster, no e2e env.
#
# NON-BLOCKING by construction: nothing references this workflow from branch
# protection. Nightly failure ≠ release gate.
on:
  schedule:
    # 03:17 UTC daily — off-peak (same slot as the Argo e2e-nightly cron).
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write # quarantine-issues.mjs files/labels/comments e2e-flake issues

concurrency:
  group: e2e-nightly
  cancel-in-progress: false

jobs:
  quarantine-sweep:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: "Quarantine sweep (ReportPortal-fed — flake issues, 14/30d expiry, budget)"
        # A test unstable (flaky or recurring failure) in 2+ nightly
        # launches within 7 days gets an `e2e-flake` issue; an open issue
        # gets a comment instead of a duplicate. Open issues idle 14 days
        # get a warning, 30 days an escalation + quarantine-overdue label.
        # The pinned [quarantine-budget] issue tracks the quarantined-test
        # count. See docs/e2e/test-taxonomy.md §4.
        working-directory: scripts/e2e/ui
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORTPORTAL_API_KEY: ${{ secrets.REPORTPORTAL_API_KEY }}
          REPORTPORTAL_BASE_URL: https://reportportal.7kgroup.org
          REPORTPORTAL_PROJECT: inari-e2e
          # QUARANTINE_BUDGET: "10"  # default; uncomment to override
          # DRY_RUN: "1"             # plan only, no GitHub mutations
        run: node quarantine-issues.mjs

  kubectl-tunnel:
    # Docker-only kubectl gateway e2e (scripts/e2e/kubectl/kubectl-tunnel.sh):
    # kubeproxy (built from inari-server main — no release tag contains
    # cmd/inari-kubeproxy yet) → tunnel-agent (inari-agent main) → real
    # etcd/kube-apiserver/Keycloak/Postgres/OpenFGA containers.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          path: bundle

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: 7K-Inari/inari-server
          ref: main
          path: inari-server

      - name: Resolve matching inari-agent ref
        id: agent
        run: |
          if git ls-remote --exit-code https://github.com/7K-Inari/inari-agent.git \
            "refs/heads/main" >/dev/null 2>&1; then
            echo "ref=main" >> "$GITHUB_OUTPUT"
          else
            echo "no inari-agent main branch" >&2; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: 7K-Inari/inari-agent
          ref: ${{ steps.agent.outputs.ref }}
          path: inari-agent

      - name: Install kubectl
        run: |
          curl -sfL -o kubectl "https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Run kubectl tunnel e2e
        working-directory: bundle/scripts/e2e/kubectl
        env:
          INARI_SERVER_DIR: ${{ github.workspace }}/inari-server
          INARI_AGENT_DIR: ${{ github.workspace }}/inari-agent
        # pipefail so a script failure fails the step despite the tee.
        run: bash -o pipefail -c './kubectl-tunnel.sh 2>&1 | tee "$GITHUB_WORKSPACE/tunnel-e2e.log"'

      - name: Upload tunnel e2e log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kubectl-tunnel-e2e-log
          path: tunnel-e2e.log
          retention-days: 14
          if-no-files-found: ignore
