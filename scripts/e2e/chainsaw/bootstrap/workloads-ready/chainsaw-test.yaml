# Parity with verify.sh verify_workloads: keycloak + nats StatefulSets fully
# ready, nats-box + openfga Deployments fully available (rollout-status
# equivalent).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: workloads-ready
  labels:
    e2e.inari.io/set: smoke
    e2e.inari.io/tier: p0
spec:
  steps:
  - name: keycloak StatefulSet ready
    try:
    - assert:
        resource:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: keycloak
          spec:
            replicas: ($values.keycloak.instances)
          status:
            readyReplicas: ($values.keycloak.instances)
  - name: nats StatefulSet ready
    try:
    - assert:
        resource:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: nats
          # Count-agnostic ("fully rolled"): the persistent e2e env flips
          # nats between 1 (baseline) and 3 (env-prep HA runs), and this
          # smoke set also fires as the ArgoCD PostSync hook in BOTH
          # shapes. ($values.nats.replicas pinned the kind-era HA shape
          # and failed the non-HA baseline — live-verified 2026-11-06.)
          (spec.replicas == status.readyReplicas): true
  - name: nats-box Deployment available
    try:
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: nats-box
          status:
            availableReplicas: ($values.natsBox.replicas)
  - name: openfga Deployment available
    try:
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: openfga
          status:
            availableReplicas: ($values.openfga.replicas)
