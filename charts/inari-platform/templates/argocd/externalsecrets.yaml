{{- if and .Values.argocd.enabled .Values.argocd.secrets.enabled }}
{{- if not .Values.argocd.secrets.vaultPath }}
{{- fail "argocd.secrets.vaultPath is required when argocd.secrets.enabled=true — the cluster's Vault path (inari/clusters/<id>/oidc-client-secret) written by inari-server at registration" }}
{{- end }}
{{- if not .Values.argocd.secrets.secretStore }}
{{- fail "argocd.secrets.secretStore is required when argocd.secrets.enabled=true — the ESO ClusterSecretStore/SecretStore holding the platform Vault" }}
{{- end }}
# ESO projection of the registration-provisioned Dex material (operator
# sunset Phase 2): the ArgoCD static-client secret argocd-cm references via
# $<name>:<key>, and the full Dex config.yaml the dex chart mounts with
# configSecret.create=false. References only — secret values never appear
# in git. The dex-namespace ExternalSecret retries until the dex
# Application creates the namespace (CreateNamespace=true).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.argocd.oidc.clientSecretRef.name }}
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "platform-config.componentLabels" (dict "root" . "component" "argocd") | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: {{ .Values.argocd.secrets.secretStoreKind }}
    name: {{ .Values.argocd.secrets.secretStore }}
  target:
    name: {{ .Values.argocd.oidc.clientSecretRef.name }}
  data:
    - secretKey: {{ .Values.argocd.oidc.clientSecretRef.key }}
      remoteRef:
        key: {{ .Values.argocd.secrets.vaultPath }}
        property: dex-argocd-client-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.argocd.secrets.dexConfigSecretName }}
  namespace: {{ .Values.argocd.secrets.dexNamespace }}
  labels:
    {{- include "platform-config.componentLabels" (dict "root" . "component" "argocd") | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: {{ .Values.argocd.secrets.secretStoreKind }}
    name: {{ .Values.argocd.secrets.secretStore }}
  target:
    name: {{ .Values.argocd.secrets.dexConfigSecretName }}
  data:
    - secretKey: config.yaml
      remoteRef:
        key: {{ .Values.argocd.secrets.vaultPath }}
        property: dex-config-yaml
{{- end }}
