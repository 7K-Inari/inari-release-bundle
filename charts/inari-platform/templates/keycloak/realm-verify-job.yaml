{{- if or .Values.keycloak.enabled .Values.keycloak.external.baseUrl }}
# Proves the admin auth path works before the release is marked successful:
# obtains a token with the client_credentials grant using the same admin
# client secret inari-server consumes, then calls the
# Keycloak Admin REST API. Hook weight 8 runs after client-setup (6) and
# realm-sync (7), so the service account already has realm-admin.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "platform-config.fullname" . }}-realm-verify
  labels:
    {{- include "platform-config.componentLabels" (dict "root" . "component" "keycloak") | nindent 4 }}
  annotations:
    "argocd.argoproj.io/hook": PostSync
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation,HookSucceeded
    "argocd.argoproj.io/hook-weight": "8"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "platform-config.componentLabels" (dict "root" . "component" "keycloak") | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: verify
          image: curlimages/curl:8.10.1
          env:
            - name: KC_BASE
              value: {{ include "platform-config.keycloakBaseUrl" . | quote }}
            - name: KC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform-config.keycloakAdminSecretName" . }}
                  key: {{ include "platform-config.keycloakAdminClientIdKey" . }}
            - name: KC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform-config.keycloakAdminSecretName" . }}
                  key: {{ include "platform-config.keycloakAdminClientSecretKey" . }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              for i in $(seq 1 60); do
                code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' "$KC_BASE/realms/inari" || true)
                [ "$code" = "200" ] && break
                echo "waiting for realm 'inari' (HTTP $code), attempt $i/60"
                sleep 5
              done
              [ "$code" = "200" ] || { echo "realm 'inari' never became reachable" >&2; exit 1; }

              TOKEN=$(curl -sS --max-time 15 -X POST "$KC_BASE/realms/inari/protocol/openid-connect/token" \
                -H 'Content-Type: application/x-www-form-urlencoded' \
                --data-urlencode "grant_type=client_credentials" \
                --data-urlencode "client_id=$KC_CLIENT_ID" \
                --data-urlencode "client_secret=$KC_CLIENT_SECRET" \
                | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
              [ -n "$TOKEN" ] || { echo "could not obtain admin token via client_credentials" >&2; exit 1; }

              code=$(curl -s --max-time 15 -o /dev/null -w '%{http_code}' \
                "$KC_BASE/admin/realms/inari" -H "Authorization: Bearer $TOKEN")
              [ "$code" = "200" ] || { echo "admin API GET /admin/realms/inari returned HTTP $code" >&2; exit 1; }
              echo "realm 'inari' reachable and admin access verified (client '$KC_CLIENT_ID')"
{{- end }}
