{{- if .Values.keycloak.enabled }}
# Credentials for the confidential admin client (service account) used by
# inari-server to call the Keycloak Admin REST API via the
# client_credentials grant.
apiVersion: v1
kind: Secret
metadata:
  annotations:
    "argocd.argoproj.io/sync-wave": "-1"
  name: inari-keycloak-admin
  labels:
    {{- include "platform-config.componentLabels" (dict "root" . "component" "keycloak") | nindent 4 }}
type: Opaque
stringData:
  client-id: {{ .Values.keycloak.adminClient.clientId | quote }}
  client-secret: {{ .Values.keycloak.adminClient.secret | quote }}
{{- end }}
