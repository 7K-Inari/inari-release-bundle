{{- if .Values.keycloak.enabled }}
# One-shot per install/upgrade: grants the inari-platform-admin service
# account the realm-management realm-admin role. Realm import cannot map
# roles onto a service account, so this closes the gap using the operator's
# temporary bootstrap admin (keycloak-initial-admin secret) — workloads
# themselves never see admin user/password credentials.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "platform-config.fullname" . }}-client-setup
  labels:
    {{- include "platform-config.componentLabels" (dict "root" . "component" "keycloak") | nindent 4 }}
  annotations:
    "argocd.argoproj.io/hook": PostSync
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation,HookSucceeded
    "argocd.argoproj.io/hook-weight": "6"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "platform-config.componentLabels" (dict "root" . "component" "keycloak") | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: client-setup
          image: curlimages/curl:8.10.1
          env:
            - name: KC_BASE
              value: http://keycloak-service:8080
            - name: ADMIN_CLIENT_ID
              value: {{ .Values.keycloak.adminClient.clientId | quote }}
            - name: KC_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-initial-admin
                  key: username
            - name: KC_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-initial-admin
                  key: password
            # provider-keycloak provisioner identity (master realm) —
            # ensured below; the secret is chart-rendered at sync wave -1.
            - name: PROV_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: inari-keycloak-provisioner
                  key: client-id
            - name: PROV_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: inari-keycloak-provisioner
                  key: client-secret
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              json_id() { sed -n 's/.*"id":"\([^"]*\)".*/\1/p' | head -1; }

              for i in $(seq 1 60); do
                code=$(curl -s -o /dev/null -w '%{http_code}' "$KC_BASE/realms/inari" || true)
                [ "$code" = "200" ] && break
                echo "waiting for realm 'inari' (HTTP $code), attempt $i/60"
                sleep 5
              done
              [ "$code" = "200" ] || { echo "realm 'inari' never became reachable" >&2; exit 1; }

              TOKEN=$(curl -sS -X POST "$KC_BASE/realms/master/protocol/openid-connect/token" \
                -H 'Content-Type: application/x-www-form-urlencoded' \
                -d "grant_type=password&client_id=admin-cli&username=$KC_ADMIN_USER&password=$KC_ADMIN_PASSWORD" \
                | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
              [ -n "$TOKEN" ] || { echo "could not obtain bootstrap admin token" >&2; exit 1; }
              AUTH="Authorization: Bearer $TOKEN"

              CLIENT_UUID=$(curl -sS "$KC_BASE/admin/realms/inari/clients?clientId=$ADMIN_CLIENT_ID" -H "$AUTH" | json_id)
              [ -n "$CLIENT_UUID" ] || { echo "client '$ADMIN_CLIENT_ID' not found in realm 'inari'" >&2; exit 1; }
              SA_USER=$(curl -sS "$KC_BASE/admin/realms/inari/clients/$CLIENT_UUID/service-account-user" -H "$AUTH" | json_id)
              RM_UUID=$(curl -sS "$KC_BASE/admin/realms/inari/clients?clientId=realm-management" -H "$AUTH" | json_id)
              ROLE=$(curl -sS "$KC_BASE/admin/realms/inari/clients/$RM_UUID/roles/realm-admin" -H "$AUTH")
              echo "$ROLE" | grep -q '"name":"realm-admin"' || { echo "realm-admin role not found" >&2; exit 1; }

              code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
                "$KC_BASE/admin/realms/inari/users/$SA_USER/role-mappings/clients/$RM_UUID" \
                -H "$AUTH" -H 'Content-Type: application/json' -d "[$ROLE]")
              [ "$code" = "204" ] || { echo "role assignment failed (HTTP $code)" >&2; exit 1; }
              echo "service account of client '$ADMIN_CLIENT_ID' now has realm-management/realm-admin"

              # --- provider-keycloak provisioner (operator sunset Phase 3) ---
              # Tenant realm/client management needs realm CREATION, and only
              # master-realm identities can hold the create-realm role — so
              # provider-keycloak gets a dedicated master-realm client instead
              # of the inari-realm admin client. Keycloak grants the creating
              # service account full admin on the realms it creates, so
              # create-realm is the only standing grant. Create-only (like the
              # realm import): an existing client is left untouched, so secret
              # rotation = delete the client and re-sync.
              PROV_UUID=$(curl -sS "$KC_BASE/admin/realms/master/clients?clientId=$PROV_CLIENT_ID" -H "$AUTH" | json_id)
              if [ -z "$PROV_UUID" ]; then
                code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$KC_BASE/admin/realms/master/clients" \
                  -H "$AUTH" -H 'Content-Type: application/json' \
                  -d "{\"clientId\":\"$PROV_CLIENT_ID\",\"enabled\":true,\"publicClient\":false,\"clientAuthenticatorType\":\"client-secret\",\"secret\":\"$PROV_CLIENT_SECRET\",\"standardFlowEnabled\":false,\"directAccessGrantsEnabled\":false,\"serviceAccountsEnabled\":true}")
                [ "$code" = "201" ] || { echo "provisioner client create failed (HTTP $code)" >&2; exit 1; }
                PROV_UUID=$(curl -sS "$KC_BASE/admin/realms/master/clients?clientId=$PROV_CLIENT_ID" -H "$AUTH" | json_id)
                echo "provisioner client '$PROV_CLIENT_ID' created in realm master"
              else
                echo "provisioner client '$PROV_CLIENT_ID' already exists in realm master"
              fi
              PROV_SA_USER=$(curl -sS "$KC_BASE/admin/realms/master/clients/$PROV_UUID/service-account-user" -H "$AUTH" | json_id)
              [ -n "$PROV_SA_USER" ] || { echo "provisioner service account user not found" >&2; exit 1; }
              # In the master realm the realm-management client is named
              # master-realm; create-realm is one of its roles.
              MASTER_RM_UUID=$(curl -sS "$KC_BASE/admin/realms/master/clients?clientId=master-realm" -H "$AUTH" | json_id)
              CREATE_REALM=$(curl -sS "$KC_BASE/admin/realms/master/clients/$MASTER_RM_UUID/roles/create-realm" -H "$AUTH")
              echo "$CREATE_REALM" | grep -q '"name":"create-realm"' || { echo "create-realm role not found" >&2; exit 1; }
              code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
                "$KC_BASE/admin/realms/master/users/$PROV_SA_USER/role-mappings/clients/$MASTER_RM_UUID" \
                -H "$AUTH" -H 'Content-Type: application/json' -d "[$CREATE_REALM]")
              [ "$code" = "204" ] || { echo "create-realm assignment failed (HTTP $code)" >&2; exit 1; }
              echo "service account of provisioner client '$PROV_CLIENT_ID' now has master-realm/create-realm"
{{- end }}
