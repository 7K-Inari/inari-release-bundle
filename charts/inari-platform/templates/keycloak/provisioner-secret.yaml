{{- if .Values.keycloak.enabled }}
# Credentials for the keycloak provisioner client (master realm, service
# account) used by Crossplane provider-keycloak to manage per-tenant realms
# and OIDC clients (operator sunset Phase 3, decision D1). The `credentials`
# key carries the provider's JSON format (terraform provider fields:
# client_id/client_secret/url/realm) and is what the inari-platform-graphs
# ClusterProviderConfig references by default.
apiVersion: v1
kind: Secret
metadata:
  annotations:
    "argocd.argoproj.io/sync-wave": "-1"
  name: inari-keycloak-provisioner
  labels:
    {{- include "platform-config.componentLabels" (dict "root" . "component" "keycloak") | nindent 4 }}
type: Opaque
stringData:
  client-id: {{ .Values.keycloak.provisionerClient.clientId | quote }}
  client-secret: {{ .Values.keycloak.provisionerClient.secret | quote }}
  credentials: {{ printf `{"client_id":%q,"client_secret":%q,"url":%q,"realm":"master"}`
    .Values.keycloak.provisionerClient.clientId
    .Values.keycloak.provisionerClient.secret
    (include "platform-config.keycloakBaseUrl" .) | quote }}
{{- end }}
