suite: keycloak instance, realm import, external instance
templates:
  - keycloak/keycloak.yaml
  - keycloak/realmimport-inari.yaml
  - keycloak/admin-secret.yaml
  - keycloak/provisioner-secret.yaml
  - keycloak/realm-verify-job.yaml
  - keycloak/realm-sync-job.yaml
  - keycloak/client-setup-job.yaml
tests:
  - it: renders the Keycloak CR wired to the CNPG cluster and inari-db secret
    template: keycloak/keycloak.yaml
    asserts:
      - isAPIVersion:
          of: k8s.keycloak.org/v2alpha1
      - isKind:
          of: Keycloak
      - equal:
          path: spec.db.host
          value: postgresql-rw
      - equal:
          path: spec.db.database
          value: keycloak
      - equal:
          path: spec.db.usernameSecret.name
          value: inari-db
      - equal:
          path: spec.db.passwordSecret.key
          value: keycloak-password
      - notExists:
          path: spec.bootstrapAdmin
  - it: syncs the Keycloak CR after the database secrets (sync wave 1)
    template: keycloak/keycloak.yaml
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "1"
  - it: pins the keycloak image and disables startOptimized for the custom image
    template: keycloak/keycloak.yaml
    asserts:
      - equal:
          path: spec.image
          value: quay.io/keycloak/keycloak:26.8.1
      - equal:
          path: spec.startOptimized
          value: false
  - it: allows overriding the keycloak image
    template: keycloak/keycloak.yaml
    set:
      keycloak.image: quay.io/keycloak/keycloak:99.0.0
    asserts:
      - equal:
          path: spec.image
          value: quay.io/keycloak/keycloak:99.0.0
  - it: renders no hostname by default with strict disabled
    template: keycloak/keycloak.yaml
    asserts:
      - notExists:
          path: spec.hostname.hostname
      - equal:
          path: spec.hostname.strict
          value: false
  - it: pins the issuer hostname when keycloak.hostname.hostname is set
    template: keycloak/keycloak.yaml
    set:
      keycloak.hostname.hostname: keycloak.local
      keycloak.hostname.strict: true
    asserts:
      - equal:
          path: spec.hostname.hostname
          value: keycloak.local
      - equal:
          path: spec.hostname.strict
          value: true
  - it: quotes hostname values containing a port or scheme
    # Keycloak hostname v2 requires full URL form when a port is present
    template: keycloak/keycloak.yaml
    set:
      keycloak.hostname.hostname: http://keycloak.local:8080
    asserts:
      - equal:
          path: spec.hostname.hostname
          value: http://keycloak.local:8080
  - it: renders the KeycloakRealmImport with the inari realm
    template: keycloak/realmimport-inari.yaml
    asserts:
      - isKind:
          of: KeycloakRealmImport
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "2"
      - equal:
          path: spec.keycloakCRName
          value: keycloak
      - equal:
          path: spec.realm.realm
          value: inari
      - equal:
          path: spec.realm.organizationsEnabled
          value: true
  - it: includes the basic scope so tokens carry a sub claim
    template: keycloak/realmimport-inari.yaml
    asserts:
      - contains:
          path: spec.realm.defaultDefaultClientScopes
          content: basic
      - contains:
          path: spec.realm.clients[?(@.clientId == "inari-server")].defaultClientScopes
          content: basic
      - contains:
          path: spec.realm.clients[?(@.clientId == "inari-ui")].defaultClientScopes
          content: basic
      - contains:
          path: spec.realm.clients[?(@.clientId == "inari-cli")].defaultClientScopes
          content: basic
  - it: exposes the device authorization grant on the inari-cli client
    template: keycloak/realmimport-inari.yaml
    asserts:
      - equal:
          path: spec.realm.clients[?(@.clientId == "inari-cli")].attributes["oauth2.device.authorization.grant.enabled"]
          value: "true"
      - equal:
          path: spec.realm.clients[?(@.clientId == "inari-cli")].publicClient
          value: true
  - it: maps aud=inari-server into access tokens for both clients
    template: keycloak/realmimport-inari.yaml
    asserts:
      - contains:
          path: spec.realm.clients[?(@.clientId == "inari-server")].protocolMappers
          content:
            name: audience-inari-server
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            consentRequired: false
            config:
              included.client.audience: inari-server
              access.token.claim: "true"
              id.token.claim: "false"
              userinfo.token.claim: "false"
      - contains:
          path: spec.realm.clients[?(@.clientId == "inari-ui")].protocolMappers
          content:
            name: audience-inari-server
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            consentRequired: false
            config:
              included.client.audience: inari-server
              access.token.claim: "true"
              id.token.claim: "false"
              userinfo.token.claim: "false"
  - it: creates the platform admin client role on the inari-server client
    template: keycloak/realmimport-inari.yaml
    asserts:
      - contains:
          path: spec.realm.roles.client.inari-server
          content:
            name: inari-platform-admin
            description: Inari platform administrator
  - it: renders an overridden platform admin role name
    template: keycloak/realmimport-inari.yaml
    set:
      keycloak.adminRole: custom-admin
    asserts:
      - contains:
          path: spec.realm.roles.client.inari-server
          content:
            name: custom-admin
            description: Inari platform administrator
      - contains:
          path: spec.realm.users[?(@.username == "dev-admin")].clientRoles.inari-server
          content: custom-admin
  - it: assigns the platform admin role to the dev-admin user
    template: keycloak/realmimport-inari.yaml
    asserts:
      - contains:
          path: spec.realm.users[?(@.username == "dev-admin")].clientRoles.inari-server
          content: inari-platform-admin
  - it: seeds the platform-admins group with dev-admin as a member
    template: keycloak/realmimport-inari.yaml
    asserts:
      - contains:
          path: spec.realm.groups
          content:
            name: platform-admins
            path: /platform-admins
      - contains:
          path: spec.realm.users[?(@.username == "dev-admin")].groups
          content: /platform-admins
  - it: renders the console redirect URIs from values (tpl-rendered realm)
    template: keycloak/realmimport-inari.yaml
    set:
      keycloak.consoleRedirectUris:
        - https://inari.example.org/*
      keycloak.consoleWebOrigins:
        - https://inari.example.org
    asserts:
      - contains:
          path: spec.realm.clients[?(@.clientId == "inari-ui")].redirectUris
          content: https://inari.example.org/*
      - contains:
          path: spec.realm.clients[?(@.clientId == "inari-ui")].webOrigins
          content: https://inari.example.org
  - it: renders the confidential admin client with a service account in the realm import
    template: keycloak/realmimport-inari.yaml
    asserts:
      - contains:
          path: spec.realm.clients
          content:
            clientId: inari-platform-admin
            enabled: true
            publicClient: false
            clientAuthenticatorType: client-secret
            secret: inari-dev-admin-client
            standardFlowEnabled: false
            directAccessGrantsEnabled: false
            serviceAccountsEnabled: true
  - it: renders the admin client secret with client-id/client-secret keys
    template: keycloak/admin-secret.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData.client-id
          value: inari-platform-admin
      - exists:
          path: stringData.client-secret
  # --- provider-keycloak provisioner identity (operator sunset Phase 3) ---
  - it: renders the provisioner secret with the provider-keycloak credentials JSON
    template: keycloak/provisioner-secret.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: inari-keycloak-provisioner
      - equal:
          path: stringData.client-id
          value: inari-keycloak-provisioner
      - exists:
          path: stringData.client-secret
      # provider-keycloak credentials format (terraform provider fields):
      # the provisioner client lives in the master realm — creating realms
      # requires master-level create-realm, which inari-realm identities
      # cannot hold.
      - matchRegex:
          path: stringData.credentials
          pattern: '"client_id":\s*"inari-keycloak-provisioner"'
      - matchRegex:
          path: stringData.credentials
          pattern: '"url":\s*"http://keycloak-service:8080"'
      - matchRegex:
          path: stringData.credentials
          pattern: '"realm":\s*"master"'
  - it: honors keycloak.baseUrl in the provisioner credentials JSON
    template: keycloak/provisioner-secret.yaml
    set:
      keycloak.baseUrl: http://keycloak-alias:8080
    asserts:
      - matchRegex:
          path: stringData.credentials
          pattern: '"url":\s*"http://keycloak-alias:8080"'
  - it: renders no provisioner secret when keycloak is disabled
    template: keycloak/provisioner-secret.yaml
    set:
      keycloak.enabled: false
      keycloak.external.baseUrl: http://keycloak-service.keycloak.svc:8080
      keycloak.external.issuerUrl: https://auth.example.org
      keycloak.external.adminSecret.name: inari-keycloak-admin
    asserts:
      - hasDocuments:
          count: 0
  - it: client-setup ensures the master-realm provisioner client and grants create-realm
    template: keycloak/client-setup-job.yaml
    asserts:
      # Realm creation needs master-realm create-realm (a role no inari-realm
      # identity can hold); Keycloak grants the creating service account full
      # admin on the realms it creates, so create-realm alone is sufficient.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROV_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: inari-keycloak-provisioner
                key: client-id
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROV_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: inari-keycloak-provisioner
                key: client-secret
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: /admin/realms/master/clients\?clientId=\$PROV_CLIENT_ID
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: clientId=master-realm
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: roles/create-realm
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: /admin/realms/master/users/\$PROV_SA_USER/role-mappings/clients/
  - it: renders the verify job as an ArgoCD PostSync hook running after client-setup
    template: keycloak/realm-verify-job.yaml
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: PostSync
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook-weight"]
          value: "8"
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook-delete-policy"]
          value: BeforeHookCreation,HookSucceeded
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: /realms/inari
  - it: verifies admin access via client_credentials from the admin client secret
    template: keycloak/realm-verify-job.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: grant_type=client_credentials
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: --data-urlencode
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: --max-time
      - equal:
          path: spec.activeDeadlineSeconds
          value: 600
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: /admin/realms/inari
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KC_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: inari-keycloak-admin
                key: client-id
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KC_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: inari-keycloak-admin
                key: client-secret
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KC_BASE
            value: http://keycloak-service:8080
  - it: renders the verify job against an external keycloak instance
    template: keycloak/realm-verify-job.yaml
    set:
      keycloak.enabled: false
      keycloak.external.baseUrl: http://keycloak-service.keycloak.svc:8080
      keycloak.external.issuerUrl: https://auth.example.org
      keycloak.external.adminSecret.name: vault-keycloak-admin
    asserts:
      - hasDocuments:
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KC_BASE
            value: http://keycloak-service.keycloak.svc:8080
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KC_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: vault-keycloak-admin
                key: client-secret
  - it: honors an explicit keycloak.baseUrl override
    template: keycloak/realm-verify-job.yaml
    set:
      keycloak.baseUrl: http://keycloak-alias:8080
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KC_BASE
            value: http://keycloak-alias:8080

  # --- external / shared-instance mode (keycloak.enabled=false) ---
  - it: renders only the realm import when keycloak is disabled and importInto is set
    template: keycloak/realmimport-inari.yaml
    set:
      keycloak.enabled: false
      keycloak.external.baseUrl: http://keycloak-service.keycloak.svc:8080
      keycloak.external.issuerUrl: https://auth.example.org
      keycloak.external.adminSecret.name: inari-keycloak-admin
      keycloak.external.importInto.name: keycloak
      keycloak.external.importInto.namespace: keycloak
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: KeycloakRealmImport
      - equal:
          path: metadata.namespace
          value: keycloak
      - equal:
          path: spec.keycloakCRName
          value: keycloak
  - it: renders nothing keycloak-side when disabled without importInto
    set:
      keycloak.enabled: false
      keycloak.external.baseUrl: http://keycloak-service.keycloak.svc:8080
      keycloak.external.issuerUrl: https://auth.example.org
      keycloak.external.adminSecret.name: inari-keycloak-admin
    templates:
      - keycloak/keycloak.yaml
      - keycloak/realmimport-inari.yaml
      - keycloak/admin-secret.yaml
      - keycloak/provisioner-secret.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: renders the client-setup job granting realm-admin to the admin client service account
    template: keycloak/client-setup-job.yaml
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: PostSync
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook-weight"]
          value: "6"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: role-mappings/clients
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KC_ADMIN_USER
            valueFrom:
              secretKeyRef:
                name: keycloak-initial-admin
                key: username
  - it: renders the realm-sync job when realmSync is enabled
    template: keycloak/realm-sync-job.yaml
    set:
      keycloak.realmSync.enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: PostSync
        documentSelector:
          path: kind
          value: Job
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook-weight"]
          value: "7"
        documentSelector:
          path: kind
          value: Job
      - equal:
          path: metadata.name
          value: RELEASE-NAME-inari-platform-realm-sync
        documentSelector:
          path: kind
          value: ConfigMap
  - it: renders no realm-sync job by default
    template: keycloak/realm-sync-job.yaml
    asserts:
      - hasDocuments:
          count: 0

  # --- cluster-local Dex clients + extension audience scopes ---
  - it: renders no dex clients by default
    template: keycloak/realmimport-inari.yaml
    asserts:
      - notContains:
          path: spec.realm.clients
          content:
            clientId: cluster-abc123-dex
  - it: renders a confidential cluster-<id>-dex client per dexClusters entry
    template: keycloak/realmimport-inari.yaml
    set:
      keycloak.dexClusters:
        - id: abc123
          secret: inari-dev-dex
        - id: def456
          secret: inari-dev-dex
    asserts:
      - equal:
          path: spec.realm.clients[?(@.clientId == "cluster-abc123-dex")].publicClient
          value: false
      - equal:
          path: spec.realm.clients[?(@.clientId == "cluster-abc123-dex")].clientAuthenticatorType
          value: client-secret
      - equal:
          path: spec.realm.clients[?(@.clientId == "cluster-abc123-dex")].secret
          value: inari-dev-dex
      - equal:
          path: spec.realm.clients[?(@.clientId == "cluster-abc123-dex")].serviceAccountsEnabled
          value: true
      - equal:
          path: spec.realm.clients[?(@.clientId == "cluster-abc123-dex")].attributes["standard.token.exchange.enabled"]
          value: "true"
      - equal:
          path: spec.realm.clients[?(@.clientId == "cluster-def456-dex")].enabled
          value: true
  - it: attaches the default extension audiences as optional client scopes
    template: keycloak/realmimport-inari.yaml
    set:
      keycloak.dexClusters:
        - id: abc123
          secret: inari-dev-dex
    asserts:
      - equal:
          path: spec.realm.clients[?(@.clientId == "cluster-abc123-dex")].optionalClientScopes
          value: [aud-kubernetes, aud-inari-extension-gateway]
      - contains:
          path: spec.realm.clients[?(@.clientId == "cluster-abc123-dex")].defaultClientScopes
          content: organization
  - it: honors explicit redirect URIs and audiences
    template: keycloak/realmimport-inari.yaml
    set:
      keycloak.dexClusters:
        - id: abc123
          secret: inari-dev-dex
          redirectUris:
            - https://dex.cluster-abc123.example.org/dex/callback
          audiences:
            - kubernetes
    asserts:
      - contains:
          path: spec.realm.clients[?(@.clientId == "cluster-abc123-dex")].redirectUris
          content: https://dex.cluster-abc123.example.org/dex/callback
      - equal:
          path: spec.realm.clients[?(@.clientId == "cluster-abc123-dex")].optionalClientScopes
          value: [aud-kubernetes]
  - it: honors an explicitly empty audiences list
    template: keycloak/realmimport-inari.yaml
    set:
      keycloak.dexClusters:
        - id: abc123
          secret: inari-dev-dex
          audiences: []
    asserts:
      - equal:
          path: spec.realm.clients[?(@.clientId == "cluster-abc123-dex")].optionalClientScopes
          value: []
  - it: fails on duplicate dexClusters ids
    template: keycloak/realmimport-inari.yaml
    set:
      keycloak.dexClusters:
        - id: abc123
          secret: inari-dev-dex
        - id: abc123
          secret: inari-dev-dex
    asserts:
      - failedTemplate:
          errorMessage: 'keycloak.dexClusters: duplicate id "abc123" — client ids cluster-<id>-dex must be unique'
  - it: defines audience client scopes for the extension audiences
    template: keycloak/realmimport-inari.yaml
    asserts:
      - equal:
          path: spec.realm.clientScopes[?(@.name == "aud-inari-agent-gateway")].protocol
          value: openid-connect
      - equal:
          path: spec.realm.clientScopes[?(@.name == "aud-inari-extension-gateway")].protocol
          value: openid-connect
      - equal:
          path: spec.realm.clientScopes[?(@.name == "aud-kubernetes")].protocol
          value: openid-connect
      - equal:
          path: spec.realm.clientScopes[?(@.name == "aud-kubernetes")].protocolMappers[0].config["included.custom.audience"]
          value: kubernetes
      - equal:
          path: spec.realm.clientScopes[?(@.name == "aud-inari-extension-gateway")].protocolMappers[0].config["included.custom.audience"]
          value: inari-extension-gateway
      - equal:
          path: spec.realm.clientScopes[?(@.name == "aud-inari-agent-gateway")].protocolMappers[0].config["included.custom.audience"]
          value: inari-agent-gateway
