suite: keycloak TenantRealm/TenantClient XRDs and Compositions
templates:
  - keycloak/xrd-tenantrealm.yaml
  - keycloak/composition-tenantrealm.yaml
  - keycloak/xrd-tenantclient.yaml
  - keycloak/composition-tenantclient.yaml
  - keycloak/clusterproviderconfig.yaml
tests:
  - it: renders nothing by default (keycloak.enabled defaults to false)
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when keycloak.enabled=false
    set:
      keycloak:
        enabled: false
        issuerBaseURL: https://keycloak.example.org
    asserts:
      - hasDocuments:
          count: 0

  - it: fails without keycloak.issuerBaseURL
    template: keycloak/xrd-tenantrealm.yaml
    set:
      keycloak:
        enabled: true
    asserts:
      - failedTemplate:
          errorMessage: keycloak.issuerBaseURL is required when keycloak.enabled=true — public base URL of the hub Keycloak, used for status.issuerURL

  - it: renders the TenantRealm XRD as a namespaced XR (Crossplane v2 — no claims)
    template: keycloak/xrd-tenantrealm.yaml
    set:
      keycloak:
        enabled: true
        issuerBaseURL: https://keycloak.example.org
    asserts:
      - isKind:
          of: CompositeResourceDefinition
      - equal:
          path: apiVersion
          value: apiextensions.crossplane.io/v2
      - equal:
          path: metadata.name
          value: tenantrealms.identity.inari.io
      - equal:
          path: spec.scope
          value: Namespaced
      - equal:
          path: spec.group
          value: identity.inari.io
      # v2: the namespaced XR IS the user-facing kind — no claimNames
      # (apiextensions.crossplane.io/v2 rejects them via CEL).
      - equal:
          path: spec.names.kind
          value: TenantRealm
      - equal:
          path: spec.names.plural
          value: tenantrealms
      - notExists:
          path: spec.claimNames
      - notExists:
          path: spec.connectionSecretKeys
      - equal:
          path: spec.versions[0].name
          value: v1alpha1
      # TenantReference spec shape preserved
      - equal:
          path: spec.versions[0].schema.openAPIV3Schema.properties.spec.required
          value: ["tenantID", "namespace"]
      - equal:
          path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.tenantID.pattern
          value: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
      - equal:
          path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.enabled.default
          value: true
      # status contract: realm + issuerURL
      - exists:
          path: spec.versions[0].schema.openAPIV3Schema.properties.status.properties.realm
      - exists:
          path: spec.versions[0].schema.openAPIV3Schema.properties.status.properties.issuerURL

  - it: renders the TenantClient XRD with the operator's spec surface
    template: keycloak/xrd-tenantclient.yaml
    set:
      keycloak:
        enabled: true
        issuerBaseURL: https://keycloak.example.org
    asserts:
      - equal:
          path: apiVersion
          value: apiextensions.crossplane.io/v2
      - equal:
          path: metadata.name
          value: tenantclients.identity.inari.io
      - equal:
          path: spec.scope
          value: Namespaced
      - equal:
          path: spec.names.kind
          value: TenantClient
      - notExists:
          path: spec.claimNames
      - equal:
          path: spec.versions[0].schema.openAPIV3Schema.properties.spec.required
          value: ["tenantID", "namespace", "realm"]
      - equal:
          path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.public.default
          value: false
      - equal:
          path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.serviceAccountsEnabled.default
          value: true
      - exists:
          path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.redirectURIs
      - exists:
          path: spec.versions[0].schema.openAPIV3Schema.properties.status.properties.clientID
      - exists:
          path: spec.versions[0].schema.openAPIV3Schema.properties.status.properties.secretName

  - it: composes a namespaced provider-keycloak Realm for TenantRealm
    template: keycloak/composition-tenantrealm.yaml
    set:
      keycloak:
        enabled: true
        providerConfigRef: hub-keycloak
        issuerBaseURL: https://keycloak.example.org
    asserts:
      - isKind:
          of: Composition
      - equal:
          path: spec.compositeTypeRef.apiVersion
          value: identity.inari.io/v1alpha1
      - equal:
          path: spec.compositeTypeRef.kind
          value: TenantRealm
      - equal:
          path: spec.mode
          value: Pipeline
      - equal:
          path: spec.pipeline[0].functionRef.name
          value: function-go-templating
      - matchRegex:
          path: spec.pipeline[0].input.inline.template
          pattern: 'apiVersion: realm\.keycloak\.m\.crossplane\.io/v1alpha1'
      - matchRegex:
          path: spec.pipeline[0].input.inline.template
          pattern: 'crossplane\.io/external-name: \{\{ \$realm \| quote \}\}'
      # spec.realm is a free string (not DNS-constrained): it must be quoted
      # everywhere it lands in composed YAML (forProvider + status)
      - matchRegex:
          path: spec.pipeline[0].input.inline.template
          pattern: 'realm: \{\{ \$realm \| quote \}\}'
      # Crossplane v2 namespaced MRs dropped spec.deletionPolicy (lifecycle
      # is governed by managementPolicies; the default full management
      # includes delete — the D7 declarative-recreate semantic)
      - notMatchRegex:
          path: spec.pipeline[0].input.inline.template
          pattern: 'deletionPolicy: '
      - matchRegex:
          path: spec.pipeline[0].input.inline.template
          pattern: 'kind: ClusterProviderConfig\s+name: hub-keycloak'
      - matchRegex:
          path: spec.pipeline[0].input.inline.template
          pattern: 'issuerURL: "https://keycloak\.example\.org/realms/\{\{ \$realm \}\}"'
      # realm defaults to tenantID
      - matchRegex:
          path: spec.pipeline[0].input.inline.template
          pattern: '\$spec\.realm \| default \$spec\.tenantID'
      # XR status write-back targets the namespaced XR kind itself (v2:
      # no separate claim/composite kinds)
      - matchRegex:
          path: spec.pipeline[0].input.inline.template
          pattern: 'apiVersion: identity\.inari\.io/v1alpha1\s+kind: TenantRealm\s+status:'

  - it: composes a namespaced provider-keycloak Client for TenantClient
    template: keycloak/composition-tenantclient.yaml
    set:
      keycloak:
        enabled: true
        providerConfigRef: hub-keycloak
        issuerBaseURL: https://keycloak.example.org
    asserts:
      - equal:
          path: spec.compositeTypeRef.kind
          value: TenantClient
      - equal:
          path: spec.pipeline[0].functionRef.name
          value: function-go-templating
      - matchRegex:
          path: spec.pipeline[0].input.inline.template
          pattern: 'apiVersion: openidclient\.keycloak\.m\.crossplane\.io/v1alpha1'
      - matchRegex:
          path: spec.pipeline[0].input.inline.template
          pattern: 'realmId: \{\{ \$spec\.realm \| quote \}\}'
      # spec.clientID is a free string (not DNS-constrained): quoted in the
      # composed MR so values like "portal: v2" can't break the YAML
      - matchRegex:
          path: spec.pipeline[0].input.inline.template
          pattern: 'clientId: \{\{ \$clientID \| quote \}\}'
      # public maps to accessType PUBLIC, default CONFIDENTIAL
      - matchRegex:
          path: spec.pipeline[0].input.inline.template
          pattern: 'accessType: \{\{ if \$spec\.public \}\}PUBLIC\{\{ else \}\}CONFIDENTIAL\{\{ end \}\}'
      # connection secret lands in the XR (tenant) namespace, confidential only;
      # keyed to the XR name (DNS-valid), not clientID
      - matchRegex:
          path: spec.pipeline[0].input.inline.template
          pattern: 'writeConnectionSecretToRef:\s+name: \{\{ \$xr\.metadata\.name \}\}-keycloak-connection'
      # Crossplane v2 namespaced MRs dropped spec.deletionPolicy (lifecycle
      # is governed by managementPolicies; the default full management
      # includes delete — the D7 declarative-recreate semantic)
      - notMatchRegex:
          path: spec.pipeline[0].input.inline.template
          pattern: 'deletionPolicy: '
      - matchRegex:
          path: spec.pipeline[0].input.inline.template
          pattern: 'name: hub-keycloak'
      # clientID defaults to the XR name
      - matchRegex:
          path: spec.pipeline[0].input.inline.template
          pattern: '\$spec\.clientID \| default \$xr\.metadata\.name'
      # XR status write-back targets the namespaced XR kind itself (v2)
      - matchRegex:
          path: spec.pipeline[0].input.inline.template
          pattern: 'apiVersion: identity\.inari\.io/v1alpha1\s+kind: TenantClient\s+status:'

  - it: renders the ClusterProviderConfig referenced by the compositions
    template: keycloak/clusterproviderconfig.yaml
    set:
      keycloak:
        enabled: true
        issuerBaseURL: https://keycloak.example.org
        providerConfigRef: hub-keycloak
        providerConfig:
          enabled: true
          credentialsSecretRef:
            name: inari-keycloak-admin
            namespace: inari
            key: credentials
    asserts:
      - isKind:
          of: ClusterProviderConfig
      - equal:
          path: apiVersion
          value: keycloak.m.crossplane.io/v1beta1
      - equal:
          path: metadata.name
          value: hub-keycloak
      - equal:
          path: spec.credentials.source
          value: Secret
      - equal:
          path: spec.credentials.secretRef
          value: {name: inari-keycloak-admin, namespace: inari, key: credentials}

  - it: defaults the ClusterProviderConfig credentials to the inari-platform provisioner secret
    # The provisioner secret (charts/inari-platform) holds the master-realm
    # client with create-realm; the inari-realm admin client cannot create
    # realms, so the default must NOT point at inari-keycloak-admin.
    template: keycloak/clusterproviderconfig.yaml
    set:
      keycloak:
        enabled: true
        issuerBaseURL: https://keycloak.example.org
    asserts:
      - equal:
          path: spec.credentials.secretRef
          value: {name: inari-keycloak-provisioner, namespace: inari, key: credentials}

  - it: skips the ClusterProviderConfig when providerConfig.enabled=false
    template: keycloak/clusterproviderconfig.yaml
    set:
      keycloak:
        enabled: true
        issuerBaseURL: https://keycloak.example.org
        providerConfig:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0
