{{- if .Values.keycloak.enabled }}
{{- if not .Values.keycloak.issuerBaseURL }}
{{- fail "keycloak.issuerBaseURL is required when keycloak.enabled=true — public base URL of the hub Keycloak, used for status.issuerURL" }}
{{- end }}
{{- $issuerBase := .Values.keycloak.issuerBaseURL -}}
# TenantRealm composition: one provider-keycloak Realm managed resource.
# The pipeline body lives in files/tenantrealm.gotmpl (included verbatim so
# its Go-template braces are not evaluated by helm); @@TOKENS@@ are replaced
# with chart values here.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: tenantrealm.identity.inari.io
  labels:
    {{- include "inari-platform-graphs.labels" . | nindent 4 }}
spec:
  compositeTypeRef:
    apiVersion: identity.inari.io/v1alpha1
    kind: TenantRealm
  mode: Pipeline
  pipeline:
    - step: realm
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1alpha1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- .Files.Get "files/tenantrealm.gotmpl"
                | replace "@@PROVIDER_CONFIG_REF@@" .Values.keycloak.providerConfigRef
                | replace "@@ISSUER_BASE_URL@@" $issuerBase
                | nindent 12 }}
{{- end }}
