{{- if .Values.keycloak.enabled }}
{{- if not .Values.keycloak.issuerBaseURL }}
{{- fail "keycloak.issuerBaseURL is required when keycloak.enabled=true — public base URL of the hub Keycloak, used for status.issuerURL" }}
{{- end }}
# Namespaced XR replacing the operator's KeycloakClient catalog item (sunset
# plan D1): hub-side self-service OIDC clients via provider-keycloak.
# Crossplane v2: claims are gone — with scope: Namespaced the composite
# resource IS the user-facing resource (no claimNames). Confidential
# client credentials reach the tenant namespace through the ESO SecretStore +
# ExternalSecret pair the server renders per tenant (see
# examples/keycloak-client-secret-delivery.yaml).
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: tenantclients.identity.inari.io
  labels:
    {{- include "inari-platform-graphs.labels" . | nindent 4 }}
spec:
  scope: Namespaced
  group: identity.inari.io
  names:
    kind: TenantClient
    plural: tenantclients
    singular: tenantclient
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - tenantID
                - namespace
                - realm
              properties:
                tenantID:
                  type: string
                  minLength: 1
                  maxLength: 63
                  pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                  description: Platform-wide tenant identifier (TenantReference).
                namespace:
                  type: string
                  minLength: 1
                  description: Tenant namespace on the hub cluster (TenantReference).
                realm:
                  type: string
                  minLength: 1
                  description: >-
                    Name of the Keycloak realm the client is provisioned into
                    (matches a sibling TenantRealm's status.realm).
                clientID:
                  type: string
                  description: OIDC client identifier. Defaults to the XR name.
                public:
                  type: boolean
                  default: false
                  description: Public client (no secret). Default is confidential.
                redirectURIs:
                  type: array
                  items:
                    type: string
                  description: Allowed redirect URIs for authorization code flows.
                serviceAccountsEnabled:
                  type: boolean
                  default: true
                  description: Enable the client credentials grant (workload federation).
                secretName:
                  type: string
                  description: >-
                    Name of the tenant-namespace Secret holding client
                    credentials. Defaults to "<xr-name>-keycloak-client".
                    Materialized by the server-rendered ExternalSecret.
            status:
              type: object
              properties:
                clientID:
                  type: string
                  description: Effective client identifier.
                realm:
                  type: string
                  description: Realm the client was provisioned into.
                secretName:
                  type: string
                  description: Tenant-namespace Secret holding credentials.
{{- end }}
