# Secret delivery for TenantClient credentials (sunset plan D1/D3; ESO per
# user decision). provider-keycloak writes the client connection secret into
# the XR's (tenant) namespace — namespaced managed resources support only
# a name in writeConnectionSecretToRef — so delivery is a NAMESPACED ESO
# SecretStore + ExternalSecret per tenant, rendered by the server into the
# hub-facing platform repo under tenants/<org>/keycloak/ next to the XR.
#
# The SecretStore + ServiceAccount + Role/RoleBinding below are rendered ONCE
# per tenant namespace; the ExternalSecret is rendered per client. Replace
# the tenant-acme / acme-portal placeholders.
---
# Read access for ESO to the provider-keycloak connection secrets in this
# tenant namespace only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-tenant-secret-reader
  namespace: tenant-acme
  labels:
    platform.inari.io/tenant: acme
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-tenant-secret-reader
  namespace: tenant-acme
  labels:
    platform.inari.io/tenant: acme
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-tenant-secret-reader
  namespace: tenant-acme
  labels:
    platform.inari.io/tenant: acme
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-tenant-secret-reader
subjects:
  - kind: ServiceAccount
    name: eso-tenant-secret-reader
    namespace: tenant-acme
---
# Namespaced store: reads Secrets in the tenant namespace (where
# provider-keycloak wrote <clientID>-keycloak-connection).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: keycloak-client-connections
  namespace: tenant-acme
  labels:
    platform.inari.io/tenant: acme
spec:
  provider:
    kubernetes:
      server:
        url: https://kubernetes.default.svc
        # ESO v1: caProvider nests under server, and a namespaced SecretStore
        # must NOT set caProvider.namespace (admission: the store implicitly
        # reads its own namespace; kube-root-ca.crt exists in every one).
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-tenant-secret-reader
---
# Materializes the operator-compatible credentials Secret
# (keys client-id / client-secret / issuer, tenant label) from the
# provider-keycloak connection secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: acme-portal-keycloak-client
  namespace: tenant-acme
  labels:
    platform.inari.io/tenant: acme
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: keycloak-client-connections
  target:
    name: acme-portal-keycloak-client # = TenantClient status.secretName
    template:
      type: Opaque
      metadata:
        labels:
          platform.inari.io/tenant: acme
      data:
        client-id: "acme-portal" # = TenantClient status.clientID
        issuer: "https://keycloak.example.org/realms/acme" # = TenantRealm status.issuerURL
        client-secret: "{{ .client_secret }}"
  data:
    - secretKey: client_secret
      remoteRef:
        # <xr-name>-keycloak-connection (composition keys the connection
        # secret to the XR name, not clientID, so non-DNS clientIDs are
        # safe). Public clients (public: true) get NO connection secret —
        # the server renders a plain Secret with only client-id/issuer then.
        key: acme-portal-keycloak-connection
        property: attribute.client_secret
