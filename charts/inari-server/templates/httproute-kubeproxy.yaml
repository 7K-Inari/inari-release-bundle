# kubeproxy route: hostnames routed wholly to inari-kubeproxy so both user
# kubectl (/api/v1/tenants/{org}/clusters/{id}/proxy/*) and tunnel-agent
# ConnectRPC streams (/inari.tunnel.v1.TunnelService/Connect) are reachable
# publicly. Same dedicated-hostname pattern as the agent gateway route.
{{- if and .Values.kubeproxy.enabled .Values.route.enabled .Values.route.kubeproxyHostnames }}
{{- $gateway := .Values.gateway }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "inari-server.kubeproxyName" . }}
  {{- with .Values.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "inari-server.kubeproxyLabels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $gateway.name }}
      {{- with $gateway.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with $gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames:
    {{- toYaml .Values.route.kubeproxyHostnames | nindent 4 }}
  rules:
    - backendRefs:
        - name: {{ include "inari-server.kubeproxyName" . }}
          port: {{ .Values.kubeproxy.service.port }}
{{- end }}
