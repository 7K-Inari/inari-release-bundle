# Crossplane — platform-wide self-service resources engine (sunset decision
# D1). Hosts provider-keycloak (wave -2) and, later, the Keycloak
# realm/client managed resources that replace the operator's
# KeycloakRealm/KeycloakClient CRDs (Phase 3).
# Pin must match scripts/e2e/stack/suite/provision.go crossplaneChartVersion
# (guarded by TestGitOpsPinParity).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: inari
  source:
    repoURL: https://charts.crossplane.io/stable
    chart: crossplane
    targetRevision: 2.4.3
    helm:
      releaseName: crossplane
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Crossplane CRDs exceed the 256KiB last-applied-configuration
      # annotation limit; client-side apply fails on them.
      - ServerSideApply=true
