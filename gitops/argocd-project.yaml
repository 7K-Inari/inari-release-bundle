# AppProject for the Inari platform stack.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: inari
  namespace: argocd
spec:
  description: Inari platform (GitOps-composed control plane)
  sourceRepos:
    # '**' crosses path separators (ArgoCD compiles globs with '/' as a
    # separator): covers ghcr.io/7k-inari/<repo>/charts/<chart>.
    - "ghcr.io/7k-inari/**"
    - "https://cloudnative-pg.github.io/charts"
    - "https://nats-io.github.io/k8s/helm/charts/"
    - "https://openfga.github.io/helm-charts"
    # Official dexidp chart — server-rendered per-tenant-cluster Dex
    # (inari-server internal/clusterdex) and the dev-only gitops/dev/dex.yaml.
    - "https://charts.dexidp.io"
    - "https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources/*"
    # Hub addons: cert-manager, ExternalDNS
    # (+ its upstream CRD manifests), ESO, Crossplane, KRO (OCI chart).
    - "https://charts.jetstack.io"
    - "https://kubernetes-sigs.github.io/external-dns/"
    - "https://github.com/kubernetes-sigs/external-dns.git"
    - "https://charts.external-secrets.io"
    - "https://charts.crossplane.io/stable"
    - "registry.k8s.io/kro/**"
    - "https://github.com/7K-Inari/inari-release-bundle.git"
    # Pre-rename name; ArgoCD apps point here until the rename lands.
    # Remove after cut-over.
    - "https://github.com/7K-Inari/inari-helm-charts.git"
  destinations:
    - server: "https://kubernetes.default.svc"
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
