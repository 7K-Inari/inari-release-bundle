# Secrets for the e2e environment, synced from Vault via the cluster's
# vault-internal ClusterSecretStore (pattern copied from the live instance:
# 7k-app-of-apps extras/7kgroup/inari/manifests/externalsecrets.yaml).
#
# REQUIRED one-time Vault writes before this app can sync (spec §5):
#   inari-e2e/database -> properties: superuser-password, inari-password,
#                         keycloak-password, openfga-password (all random)
#   inari-e2e/personas -> properties: dev-admin-password, operator-password,
#                         editor-password, viewer-password, member-password
#                         (consumed by the W3 seed step and the suites via
#                          E2E_USER/E2E_PASSWORD; created now so the seed
#                          never blocks on Vault)
#
# Connection URIs are TEMPLATED here from the passwords so the Vault key
# holds passwords only (host is the in-namespace CNPG service postgresql-rw
# rendered by the platform-config release; clusterName default).
---
# inari-db — consumed by CNPG initdb bootstrap (username/password/
# postgres-password), inari-server (inari-uri), OpenFGA (openfga-uri) and
# the platform chart's existingSecret contract (keycloak-username/password).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: inari-db
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-internal
    kind: ClusterSecretStore
  target:
    name: inari-db
    creationPolicy: Owner
    template:
      data:
        username: inari
        password: "{{ .inari_password }}"
        postgres-password: "{{ .superuser_password }}"
        inari-password: "{{ .inari_password }}"
        inari-uri: "postgres://inari:{{ .inari_password }}@postgresql-rw:5432/inari?sslmode=disable"
        keycloak-username: keycloak
        keycloak-password: "{{ .keycloak_password }}"
        openfga-password: "{{ .openfga_password }}"
        openfga-uri: "postgres://openfga:{{ .openfga_password }}@postgresql-rw:5432/openfga?sslmode=disable"
  data:
    - secretKey: superuser_password
      remoteRef: { key: inari-e2e/database, property: superuser-password }
    - secretKey: inari_password
      remoteRef: { key: inari-e2e/database, property: inari-password }
    - secretKey: keycloak_password
      remoteRef: { key: inari-e2e/database, property: keycloak-password }
    - secretKey: openfga_password
      remoteRef: { key: inari-e2e/database, property: openfga-password }
---
# Per-role basic-auth secrets for CNPG spec.managed.roles (CNPG requires one
# kubernetes.io/basic-auth secret per role; username must equal the role).
# Passwords come from the same Vault key as inari-db so they never drift.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: inari-db-role-keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-internal
    kind: ClusterSecretStore
  target:
    name: inari-db-role-keycloak
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: keycloak
        password: "{{ .keycloak_password }}"
  data:
    - secretKey: keycloak_password
      remoteRef: { key: inari-e2e/database, property: keycloak-password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: inari-db-role-openfga
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-internal
    kind: ClusterSecretStore
  target:
    name: inari-db-role-openfga
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: openfga
        password: "{{ .openfga_password }}"
  data:
    - secretKey: openfga_password
      remoteRef: { key: inari-e2e/database, property: openfga-password }
---
# inari-e2e-personas — fixed test personas (docs/e2e/environment-contract.md
# §1.3). The W3 seed step creates/updates the Keycloak users from these and
# the suites mount them as E2E_USER/E2E_PASSWORD. Secret, never workflow
# parameters (they would land in the Argo UI).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: inari-e2e-personas
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-internal
    kind: ClusterSecretStore
  target:
    name: inari-e2e-personas
    creationPolicy: Owner
  data:
    - secretKey: dev-admin-password
      remoteRef: { key: inari-e2e/personas, property: dev-admin-password }
    - secretKey: operator-password
      remoteRef: { key: inari-e2e/personas, property: operator-password }
    - secretKey: editor-password
      remoteRef: { key: inari-e2e/personas, property: editor-password }
    - secretKey: viewer-password
      remoteRef: { key: inari-e2e/personas, property: viewer-password }
    - secretKey: member-password
      remoteRef: { key: inari-e2e/personas, property: member-password }
