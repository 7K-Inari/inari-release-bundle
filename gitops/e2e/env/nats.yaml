# inari-e2e-nats — JetStream event bus for the e2e environment (wave 1).
# Permanently 3-node clustered with R=3 streams: standalone→clustered
# conversion is NOT supported (JetStream never elects a meta leader over a
# PVC born non-clustered — the 2026-11-07 nightly died on exactly this), and
# R=1↔R=3 stream flips remap every consumer (the 2026-11-10/11 nightlies
# then died on corrupt consumer Raft state). The baseline therefore matches
# the prod topology; non-HA runs trim the app tier, not NATS durability.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inari-e2e-nats
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: inari-e2e
  source:
    repoURL: https://nats-io.github.io/k8s/helm/charts/
    chart: nats
    targetRevision: 2.15.2
    helm:
      releaseName: nats
      # valuesObject, NOT values — ArgoCD never merges the two (see the
      # server app). Cluster block is CONSTANT (see the header comment).
      valuesObject:
        fullnameOverride: nats
        config:
          cluster:
            enabled: true
            replicas: 3
          jetstream:
            enabled: true
            fileStore:
              enabled: true
              pvc:
                size: 1Gi
                storageClassName: longhorn-hdd-no-backup
        container:
          merge:
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: inari-e2e
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
