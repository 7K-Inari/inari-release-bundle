# inari-e2e-nats — JetStream event bus for the e2e environment (wave 1).
# Permanently 3-node clustered: standalone→clustered conversion is NOT
# supported (JetStream never elects a meta leader over a PVC born
# non-clustered — the 2026-11-07 nightly died on exactly this), so the
# baseline matches the prod topology and HA runs no longer touch NATS (the
# flip covers server/console/agent only). The server pins streamReplicas per
# run (R=1 non-HA / R=3 HA); R=1 streams are fine on a clustered bus.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inari-e2e-nats
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: inari-e2e
  source:
    repoURL: https://nats-io.github.io/k8s/helm/charts/
    chart: nats
    targetRevision: 2.15.2
    helm:
      releaseName: nats
      # valuesObject, NOT values — ArgoCD never merges the two (see the
      # server app). Cluster block is CONSTANT (see the header comment).
      valuesObject:
        fullnameOverride: nats
        config:
          cluster:
            enabled: true
            replicas: 3
          jetstream:
            enabled: true
            fileStore:
              enabled: true
              pvc:
                size: 1Gi
                storageClassName: longhorn-hdd-no-backup
        container:
          merge:
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: inari-e2e
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
