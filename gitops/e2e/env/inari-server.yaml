# inari-e2e-server — control-plane API for the e2e environment (wave 3).
# Chart from this repo's working tree; image pulled through the Harbor
# ghcr-proxy pull-through cache (hard rule 7: pull-blocking on that project
# stays OFF — e2e deploys unscanned edge/old images for upgrade tests).
#
# Baseline is the NON-HA trim (1 replica, R=1 streams, memory cache, no
# kubeproxy — mirrors scripts/e2e/stack/testdata/server-values-e2e.yaml).
# HA legs and candidate image tags are applied per run by the W3 env-prep
# step; this file is the steady state the env converges back to.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inari-e2e-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: inari-e2e
  source:
    repoURL: https://github.com/7K-Inari/inari-release-bundle.git
    targetRevision: main
    path: charts/inari-server
    helm:
      releaseName: inari-server
      values: |
        replicaCount: 1
        image:
          repository: harbor.7kgroup.org/ghcr-proxy/7k-inari/inari-server
          # Chart appVersion. Pinned explicitly so the proxy path is visible
          # in review; env-prep overrides it with the candidate tag per run.
          tag: "3.0.0"
          pullPolicy: IfNotPresent
        # External NATS from inari-e2e-nats (wave 1 < 3), subchart off.
        nats:
          enabled: false
          url: nats://nats:4222
          streamReplicas: 1
        # kubectl gateway is covered by the docker-only suite
        # (scripts/e2e/kubectl/kubectl-tunnel.sh); its image is published
        # only at server release time — enabling it here would
        # ImagePullBackOff on the chart's appVersion tag.
        kubeproxy:
          enabled: false
        keycloak:
          baseUrl: "http://keycloak-service:8080"
          realm: inari
          adminSecret:
            name: inari-keycloak-admin
        oidc:
          issuerUrl: "https://auth-e2e.7kgroup.org/realms/inari"
        gateway:
          name: internet-gateway
          namespace: istio
          sectionName: https-7kgroup
        route:
          enabled: true
          hostnames:
            - inari-e2e.7kgroup.org
          pathPrefix: /api
          # Dedicated agent-gateway hostname: PathPrefix matching is
          # segment-based (live-instance lesson in 7k-app-of-apps
          # apps/7kgroup/inari.yaml); agent ConnectRPC gets its own
          # hostname routed wholly to inari-server.
          agentHostnames:
            - inari-e2e-gw.7kgroup.org
          annotations:
            external-dns.kubernetes.io/cloudflare-proxied: "false"
        extraEnv:
          - name: INARI_AGENT_GATEWAY_ADDRESS
            value: "https://inari-e2e-gw.7kgroup.org"
          - name: INARI_AGENT_IMAGE_REPO
            value: "harbor.7kgroup.org/ghcr-proxy/7k-inari/inari-agent"
          # Filesystem git provider + in-cluster git service (wave 1 app
          # inari-e2e-git-service): the server writes real bare repos into
          # the shared RWX PVC; suites clone them via E2E_GIT_URL.
          - name: INARI_GIT_PROVIDER
            value: "local"
          - name: INARI_GIT_LOCAL_ROOT
            value: "/var/lib/inari/git"
          - name: INARI_LOG_FORMAT
            value: "json"
        extraVolumes:
          - name: git-root
            persistentVolumeClaim:
              claimName: inari-e2e-git
        extraVolumeMounts:
          - name: git-root
            mountPath: /var/lib/inari/git
        # Platform Vault for the cluster-registration exchange
        # (RegisterCluster writes per-cluster OIDC client secrets).
        # Kubernetes auth: SA JWT login, no static token. PREREQUISITE:
        # Vault policy + role inari-e2e-server bound to SA inari-server in
        # ns inari-e2e (gitops/e2e/README.md §Prerequisites).
        vault:
          addr: "https://vault.int.7kgroup.org"
          kvMount: secret
          authMethod: kubernetes
          role: inari-e2e-server
  destination:
    server: https://kubernetes.default.svc
    namespace: inari-e2e
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
