# WorkflowTemplate e2e-stack — THE one parameter-driven e2e workflow
# (architecture plan C1, parameter contract §3.1, DAG §5). Replaces the
# kind-era .github/workflows/e2e-stack.yaml orchestration: no kind, no image
# tars, no NodePort hacks — the persistent e2e environment (gitops/e2e/env)
# is re-converged to the run's candidate artifact set per run (hard rule 5:
# the release gate tests exactly the submitted charts/images, never
# "whatever happens to be deployed").
#
# Documented deviations from the plan/contract (coordinator rulings
# 2026-11-05/06):
# - Q3: agent-image="build" is unsupported on the Argo path (no in-cluster
#   image builds); the agent repo publishes a moving "edge" image instead.
# - Q5: HA is an ENV-WIDE flip (env-prep scales the server to 2 replicas +
#   redis cache; NATS stays permanently 3-node — standalone→clustered
#   JetStream conversion is unsupported, the 2026-11-07 nightly died on it)
#   — one serialized env cannot run HA and non-HA legs in parallel, so the
#   plan §5 "HA legs via withParam" sketch becomes a single ginkgo leg with
#   E2E_HA=1.
# - Q9: PostSync smoke is chainsaw-only (gitops/e2e/chainsaw-hooks/);
#   Ginkgo/Playwright smoke sets run via mode=smoke submissions.
# - W6 (landed): the harbor-scan-gate leg fills the seam between
#   cosign-verify and env-prep — release-only, parallel with cosign-verify;
#   env-prep gates on both.
# - W5 (upgrade leg, plan §10): mode=upgrade prepends a previous-stable phase
#   — resolve-previous (latest stable chart release git tags + ghcr stable
#   image tags) → env-prep-previous → upgrade-fixture (pre-upgrade data) →
#   [upgrade-drill-pause] → the normal candidate env-prep → seed → suites
#   re-run the GATE selection (taxonomy §3 upgrade stage row) →
#   upgrade-assert proves the fixture survived. The taxonomy label "upgrade"
#   is realized as this mode/stage, not per-spec labels (coordinator ruling
#   2026-11-06 #1). Non-gating; the release-gating flip (a second submit in
#   release-e2e.yaml) is a deliberate follow-up after ~2 weeks stable.
#   Caveats:
#   * No stable inari-server CHART release exists yet (edge OCI tags only) —
#     resolve-previous falls back to the candidate chart ref for the server
#     until the first inari-server-vX.Y.Z tag lands; the latest stable server
#     IMAGE (3.0.0) predates the roles/membership APIs + the operator sunset,
#     so the CronWorkflow ships suspended until the first post-sunset stable.
#   * The agent is NOT downgraded (old agent charts lack the
#     discovery.name/namespaceCreate knobs, inari-agent #88) — agent-ensure
#     always installs the candidate.
#   * Migration semantics (goose v3, empirically verified against v3.29.0):
#     an old binary treats a NEWER database as a no-op (Up() ignores applied
#     versions absent from its FS), and failed migrations roll back
#     transactionally — no dirty-flag poisoning of the shared env.
#
# Semaphore: one permit (ConfigMap e2e-env-lock, see semaphore-e2e-env-lock.yaml)
# serializes ALL modes against the single env (plan §5.6). onExit imports every
# suite's JUnit into ReportPortal unconditionally — aborted/failed runs still
# report (hard rule 8/10; importer in the exit-handler template, W4).
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: e2e-stack
  namespace: inari-e2e
  labels:
    app.kubernetes.io/part-of: inari-e2e-workflows
spec:
  entrypoint: main
  serviceAccountName: e2e-runner
  # Whole-run cap: nightly HA worst case (env-prep 15m + seed 10m +
  # agent-ensure 10m + ginkgo HA ~50m + playwright shards ~40m, partially
  # parallel) fits in 3h with margin.
  activeDeadlineSeconds: 10800
  onExit: exit-handler
  arguments:
    parameters:
      # Release contract (plan §3.1) — thin GHA wrappers pass -p only.
      - name: mode
        value: edge
        enum: ["release", "edge", "nightly", "weekly", "smoke", "upgrade"]
      - name: ha
        value: "false"
        enum: ["true", "false"]
      - name: charts-ref
        # Bundle repo ref under test: branch, tag, or PR head SHA (release
        # PRs submit their head SHA — the candidate charts come from it).
        value: main
      - name: server-image
        # Unprefixed ghcr tag (1.8.0 | edge), pulled via Harbor ghcr-proxy.
        value: edge
      - name: console-image
        value: edge
      - name: agent-image
        value: edge
      - name: server-src-ref
        # inari-server ref for the api-schema driver checkout + the HA
        # migrations dir (hard rules 8/9).
        value: main
      - name: cosign-verify
        value: "false"
        enum: ["true", "false"]
      - name: scan-critical-threshold
        # Release-mode Harbor/Trivy scan gate (W6): a candidate image fails
        # when its Critical CVE count EXCEEDS this. CVE allowlists are
        # managed in Harbor (project ghcr-proxy), never here — raise this
        # only for a one-off debug submit, never on the release path.
        value: "0"
      - name: include-quarantined
        value: "false"
        enum: ["true", "false"]
      - name: retention-days
        value: "7"
      - name: reportportal-launch
        # Empty → resolve computes "<mode>-<workflow uid>".
        value: ""
      # --- upgrade mode only (W5) -------------------------------------------
      - name: upgrade-from-server-image
        # "auto" = resolve-previous picks the latest stable (chart release
        # appVersion, or the latest stable ghcr image while no stable server
        # chart exists). An explicit tag pins the previous baseline —
        # acceptance drills and debugging.
        value: auto
      - name: upgrade-from-console-image
        value: auto
      - name: upgrade-drill-pause-minutes
        # "0" = no pause. Any other integer suspends the run that many
        # minutes between upgrade-fixture and the candidate env-prep — a
        # deterministic sabotage window for the broken-migration drill
        # (gitops/e2e/README.md §upgrade leg). Numeric on purpose: the `when`
        # evaluator compares substituted tokens, and a duration token like
        # "15m" risks a parse error next to the proven bare-word pattern.
        value: "0"
  templates:
    # ------------------------------------------------------------------ DAG
    - name: main
      synchronization:
        semaphores:
          - configMapKeyRef:
              name: e2e-env-lock
              key: workflows
      dag:
        tasks:
          - name: resolve
            template: resolve
          - name: cosign-verify
            template: cosign-verify
            depends: resolve
            when: "{{workflow.parameters.cosign-verify}} == true"
          # Harbor/Trivy vulnerability scan gate (W6, plan C9/§5.2): release
          # only, parallel with cosign-verify — fail fast and cheap before
          # the expensive env-prep. Scans exactly the candidate image set
          # (hard rule 5) in the ghcr-proxy project; pull-blocking stays OFF
          # there (hard rule 7) — enforcement lives here, never in the pull
          # path. Emits the synthetic `security` JUnit (taxonomy §1.2/§5) and
          # archives the full vulnerability reports in S3.
          - name: harbor-scan-gate
            template: harbor-scan-gate
            depends: resolve
            when: "{{workflow.parameters.mode}} == release"
          # --- upgrade mode only (W5): previous-stable phase ----------------
          # Deploy the previous stable artifact set, write the pre-upgrade
          # fixture, then fall through to the normal candidate env-prep.
          # when-skipped tasks surface as .Skipped in depends (cosign-verify
          # precedent), so non-upgrade modes walk straight through.
          - name: resolve-previous
            template: resolve-previous
            depends: resolve
            when: "{{workflow.parameters.mode}} == upgrade"
          - name: env-prep-previous
            template: env-prep
            depends: resolve-previous
            when: "{{workflow.parameters.mode}} == upgrade"
            arguments:
              parameters:
                - name: stage
                  value: previous
                - name: server-ref
                  value: "{{tasks.resolve-previous.outputs.parameters.prev-server-ref}}"
                - name: console-ref
                  value: "{{tasks.resolve-previous.outputs.parameters.prev-console-ref}}"
                - name: server-image
                  value: "{{tasks.resolve-previous.outputs.parameters.prev-server-image}}"
                - name: console-image
                  value: "{{tasks.resolve-previous.outputs.parameters.prev-console-image}}"
                # The old stack deploys non-HA: it only needs to work; the HA
                # flip belongs to the candidate phase.
                - name: ha
                  value: "false"
          - name: upgrade-fixture
            template: upgrade-fixture
            depends: env-prep-previous
            when: "{{workflow.parameters.mode}} == upgrade"
          # Drill aid: optional suspend between the fixture and the candidate
          # env-prep (param upgrade-drill-pause-minutes, "0" by default).
          - name: upgrade-drill-pause
            template: upgrade-drill-pause
            depends: upgrade-fixture
            when: "{{workflow.parameters.mode}} == upgrade && {{workflow.parameters.upgrade-drill-pause-minutes}} != 0"
          # upgrade-fixture is listed explicitly (not just transitively via
          # upgrade-drill-pause): with the pause off, the pause node is
          # when-skipped and the fixture must still gate the candidate deploy.
          - name: env-prep
            template: env-prep
            depends: (cosign-verify.Succeeded || cosign-verify.Skipped) && (harbor-scan-gate.Succeeded || harbor-scan-gate.Skipped) && (upgrade-fixture.Succeeded || upgrade-fixture.Skipped) && (upgrade-drill-pause.Succeeded || upgrade-drill-pause.Skipped)
            arguments:
              parameters:
                - name: stage
                  value: candidate
                - name: server-ref
                  value: "{{workflow.parameters.charts-ref}}"
                - name: console-ref
                  value: "{{workflow.parameters.charts-ref}}"
                - name: server-image
                  value: "{{workflow.parameters.server-image}}"
                - name: console-image
                  value: "{{workflow.parameters.console-image}}"
                - name: ha
                  value: "{{workflow.parameters.ha}}"
          - name: seed
            template: seed
            depends: env-prep
          # Chainsaw cluster-state assertions run right after convergence,
          # parallel with the seed (plan §5). Never gates the legs.
          - name: chainsaw-verify
            template: chainsaw-verify
            depends: env-prep
            when: "{{workflow.parameters.mode}} != weekly"
          # Agent ensure (D13): the Ginkgo cluster/agent phases need a
          # connected agent; registration tokens are dynamic, so this is a
          # workflow step, never GitOps.
          - name: agent-ensure
            template: agent-ensure
            depends: seed
          # Suite legs: full signal per run — no leg depends on another leg,
          # so a failed sibling never blocks the others; the workflow phase
          # still ends Failed (the gate stays correct).
          - name: ginkgo
            template: ginkgo
            depends: agent-ensure
            when: "{{workflow.parameters.mode}} != weekly"
          - name: playwright
            template: playwright
            depends: seed
            when: "{{workflow.parameters.mode}} != weekly"
            arguments:
              parameters:
                - name: shard
                  value: "{{item.shard}}"
                - name: shard-safe
                  value: "{{item.safe}}"
            withParam: '[{"shard":"1/2","safe":"1-2"},{"shard":"2/2","safe":"2-2"}]'
          # Gate-only today (plan §5.4); its ReportPortal launch carries p0.
          - name: apischema
            template: apischema
            depends: seed
            when: "{{workflow.parameters.mode}} == release"
          # Upgrade mode only (W5): proves the pre-upgrade fixture tenant
          # survived the upgrade; emits the leg's synthetic JUnit.
          - name: upgrade-assert
            template: upgrade-assert
            depends: seed
            when: "{{workflow.parameters.mode}} == upgrade"

    # -------------------------------------------------------------- resolve
    # Validates the parameter contract (release ⇒ cosign ON, quarantined
    # excluded, image tag ↔ git tag consistency), writes the run-metadata
    # ConfigMap, computes the ReportPortal launch name.
    - name: resolve
      activeDeadlineSeconds: 300
      script:
        image: alpine/k8s:1.35.10
        command: [sh]
        env:
          - name: MODE
            value: "{{workflow.parameters.mode}}"
          - name: COSIGN
            value: "{{workflow.parameters.cosign-verify}}"
          - name: QUAR
            value: "{{workflow.parameters.include-quarantined}}"
          - name: SERVER_IMAGE
            value: "{{workflow.parameters.server-image}}"
          - name: SERVER_SRC_REF
            value: "{{workflow.parameters.server-src-ref}}"
          - name: RP_LAUNCH_PARAM
            value: "{{workflow.parameters.reportportal-launch}}"
          - name: UPGRADE_FROM_SERVER
            value: "{{workflow.parameters.upgrade-from-server-image}}"
          - name: UPGRADE_FROM_CONSOLE
            value: "{{workflow.parameters.upgrade-from-console-image}}"
        source: |
          set -eu
          echo "mode=$MODE ha={{workflow.parameters.ha}} charts-ref={{workflow.parameters.charts-ref}}"
          echo "images: server=$SERVER_IMAGE console={{workflow.parameters.console-image}} agent={{workflow.parameters.agent-image}}"
          echo "server-src-ref=$SERVER_SRC_REF cosign=$COSIGN include-quarantined=$QUAR"

          if [ "$MODE" = "release" ]; then
            # Hard rule 5: the release gate tests exactly the candidate set.
            [ "$COSIGN" = "true" ] || { echo "release mode requires cosign-verify=true" >&2; exit 1; }
            [ "$QUAR" = "false" ] || { echo "release mode never runs quarantined tests" >&2; exit 1; }
            echo "$SERVER_IMAGE" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' \
              || { echo "release mode needs a version-tagged server image (got $SERVER_IMAGE)" >&2; exit 1; }
            # ghcr tags are unprefixed, git tags v-prefixed (release-e2e.yaml convention).
            [ "$SERVER_SRC_REF" = "v$SERVER_IMAGE" ] \
              || { echo "release mode: server-src-ref must be v$SERVER_IMAGE (got $SERVER_SRC_REF)" >&2; exit 1; }
          fi

          if [ "$MODE" = "upgrade" ]; then
            # The upgrade leg re-runs the GATE selection on the upgraded
            # stack (taxonomy §3) — quarantined tests never join it.
            [ "$QUAR" = "false" ] || { echo "upgrade mode never runs quarantined tests" >&2; exit 1; }
            echo "upgrade leg: previous baseline server=$UPGRADE_FROM_SERVER console=$UPGRADE_FROM_CONSOLE drill-pause={{workflow.parameters.upgrade-drill-pause-minutes}}m"
          fi

          RUN_ID="{{workflow.uid}}"
          RP_LAUNCH="$RP_LAUNCH_PARAM"
          [ -n "$RP_LAUNCH" ] || RP_LAUNCH="$MODE-$RUN_ID"
          # The exit-handler recomputes this same value from the workflow
          # parameters — it is the single source (no output wiring).

          # Run metadata for later inspection/janitor correlation (plan §5.1).
          kubectl -n inari-e2e create configmap "e2e-run-$(echo "$RUN_ID" | cut -c1-8)" \
            --from-literal=mode="$MODE" \
            --from-literal=run-id="$RUN_ID" \
            --from-literal=charts-ref="{{workflow.parameters.charts-ref}}" \
            --from-literal=server-image="$SERVER_IMAGE" \
            --from-literal=console-image="{{workflow.parameters.console-image}}" \
            --from-literal=agent-image="{{workflow.parameters.agent-image}}" \
            --from-literal=server-src-ref="$SERVER_SRC_REF" \
            --from-literal=upgrade-from-server-image="$UPGRADE_FROM_SERVER" \
            --from-literal=upgrade-from-console-image="$UPGRADE_FROM_CONSOLE" \
            --from-literal=reportportal-launch="$RP_LAUNCH"
          echo "run metadata written; rp-launch=$RP_LAUNCH"

    # ------------------------------------------------------- resolve-previous
    # Upgrade mode only: resolves the PREVIOUS stable artifact set.
    #   chart ref  = latest stable release git tag (<chart>-vX.Y.Z; the chart
    #                content at that tag is byte-identical to the published
    #                OCI artifact, and git sources keep the env pointer's
    #                ignoreDifferences untouched). Strict semver only — the
    #                per-commit edge tags (<chart>-vX.Y.Z-<sha>) never match.
    #   image tag  = appVersion of the chart at that tag (normalized: server/
    #                console ghcr image tags are unprefixed).
    # FALLBACK (inari-server today): no stable chart release exists yet —
    # the chart ref falls back to charts-ref and the image to the latest
    # stable ghcr tag. upgrade-from-*-image != auto overrides the image.
    # No k8s writes (e2e-runner is configmaps get/list/watch+create only).
    - name: resolve-previous
      activeDeadlineSeconds: 300
      script:
        image: alpine/k8s:1.35.10
        command: [sh]
        env:
          - name: CHARTS_REF
            value: "{{workflow.parameters.charts-ref}}"
          - name: FROM_SERVER
            value: "{{workflow.parameters.upgrade-from-server-image}}"
          - name: FROM_CONSOLE
            value: "{{workflow.parameters.upgrade-from-console-image}}"
        source: |
          set -eu
          command -v git >/dev/null 2>&1 || apk add --no-cache git >/dev/null
          command -v jq >/dev/null 2>&1 || apk add --no-cache jq curl >/dev/null

          REPO=https://github.com/7K-Inari/inari-release-bundle.git

          # Latest strict-semver release tag for a chart ("" when none).
          latest_chart_tag() {
            git ls-remote --tags "$REPO" "$1-v[0-9]*" \
              | grep -oE "refs/tags/$1-v[0-9]+\.[0-9]+\.[0-9]+$" \
              | sed 's#refs/tags/##' | sort -V | tail -1 || true
          }

          # Latest strict-semver image tag on ghcr (public packages,
          # anonymous token flow; n=1000 — the unpaginated list truncates at
          # exactly 100, live-verified). $1 = repo path, $2 = tag prefix
          # ("" for server/console, "v" for agent).
          latest_image_tag() {
            tok=$(curl -s "https://ghcr.io/token?scope=repository:$1:pull" | jq -r .token)
            curl -sf -H "Authorization: Bearer $tok" "https://ghcr.io/v2/$1/tags/list?n=1000" \
              | jq -r '.tags[]' | grep -E "^$2[0-9]+\.[0-9]+\.[0-9]+$" | sort -V | tail -1
          }

          # appVersion of charts/$2 at git tag $1 ("" on failure).
          app_version_at() {
            curl -sf "https://raw.githubusercontent.com/7K-Inari/inari-release-bundle/$1/charts/$2/Chart.yaml" \
              | awk '/^appVersion:/ {gsub(/"/, "", $2); print $2}' || true
          }

          SRV_TAG=$(latest_chart_tag inari-server)
          if [ -n "$SRV_TAG" ]; then
            PREV_SERVER_REF="$SRV_TAG"
            PREV_SERVER_IMAGE=$(app_version_at "$SRV_TAG" inari-server)
          else
            PREV_SERVER_REF="$CHARTS_REF"
            PREV_SERVER_IMAGE=$(latest_image_tag 7k-inari/inari-server "")
            echo "NOTE: no stable inari-server chart release yet — chart falls back to charts-ref ($CHARTS_REF)"
          fi
          # ghcr server/console image tags are unprefixed (registry-verified).
          PREV_SERVER_IMAGE="${PREV_SERVER_IMAGE#v}"

          CON_TAG=$(latest_chart_tag inari-console)
          if [ -n "$CON_TAG" ]; then
            PREV_CONSOLE_REF="$CON_TAG"
            PREV_CONSOLE_IMAGE=$(app_version_at "$CON_TAG" inari-console)
          else
            PREV_CONSOLE_REF="$CHARTS_REF"
            PREV_CONSOLE_IMAGE=$(latest_image_tag 7k-inari/inari-ui-bundle "")
            echo "NOTE: no stable inari-console chart release yet — chart falls back to charts-ref ($CHARTS_REF)"
          fi
          PREV_CONSOLE_IMAGE="${PREV_CONSOLE_IMAGE#v}"

          # Explicit pins win over auto-resolution (acceptance drills).
          [ "$FROM_SERVER" = "auto" ] || PREV_SERVER_IMAGE="$FROM_SERVER"
          [ "$FROM_CONSOLE" = "auto" ] || PREV_CONSOLE_IMAGE="$FROM_CONSOLE"

          [ -n "$PREV_SERVER_REF" ] && [ -n "$PREV_SERVER_IMAGE" ] \
            && [ -n "$PREV_CONSOLE_REF" ] && [ -n "$PREV_CONSOLE_IMAGE" ] \
            || { echo "previous-stable resolution failed (empty value)" >&2; exit 1; }

          echo "previous server:  chart ref $PREV_SERVER_REF, image $PREV_SERVER_IMAGE"
          echo "previous console: chart ref $PREV_CONSOLE_REF, image $PREV_CONSOLE_IMAGE"
          printf %s "$PREV_SERVER_REF" > /tmp/prev-server-ref
          printf %s "$PREV_CONSOLE_REF" > /tmp/prev-console-ref
          printf %s "$PREV_SERVER_IMAGE" > /tmp/prev-server-image
          printf %s "$PREV_CONSOLE_IMAGE" > /tmp/prev-console-image
      outputs:
        parameters:
          - name: prev-server-ref
            valueFrom:
              path: /tmp/prev-server-ref
          - name: prev-console-ref
            valueFrom:
              path: /tmp/prev-console-ref
          - name: prev-server-image
            valueFrom:
              path: /tmp/prev-server-image
          - name: prev-console-image
            valueFrom:
              path: /tmp/prev-console-image

    # --------------------------------------------------------- cosign-verify
    # Release-only (when-gated). Verifies the three candidate images on
    # ghcr.io (signatures live there, not in the Harbor proxy-cache), keyless
    # against the component repos' GitHub Actions identity — ported from the
    # retired e2e-stack.yaml verify step.
    - name: cosign-verify
      activeDeadlineSeconds: 600
      script:
        image: alpine/k8s:1.35.10
        command: [sh]
        env:
          - name: SERVER_IMAGE
            value: "{{workflow.parameters.server-image}}"
          - name: CONSOLE_IMAGE
            value: "{{workflow.parameters.console-image}}"
          - name: AGENT_IMAGE
            value: "{{workflow.parameters.agent-image}}"
        source: |
          set -eu
          COSIGN_VERSION=v3.1.4
          COSIGN_SHA256=424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
          curl -sfL -o /tmp/cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "$COSIGN_SHA256  /tmp/cosign" | sha256sum -c -
          chmod +x /tmp/cosign

          mkdir -p /artifacts/out

          # Tag-prefix convention split (registry-verified): inari-agent
          # stable images are v-prefixed (v0.5.1), inari-server and
          # inari-ui-bundle are unprefixed (1.8.0). agent.recommended carries
          # the bare version, so normalize the AGENT tag defensively: prefix
          # 'v' iff it is a bare X.Y.Z release tag. "edge" and per-commit
          # edge builds (0.6.0-<sha>) stay unprefixed. The systemic fix
          # (inari-server baseline.go / platform values vs inari-agent's
          # image convention) is a separate cross-repo issue — the workflow
          # must not fail on the registry's current reality.
          AGENT_TAG="$AGENT_IMAGE"
          case "$AGENT_TAG" in
            v*) ;;
            *) echo "$AGENT_TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' && AGENT_TAG="v$AGENT_TAG" || true;;
          esac

          verify() { # image-ref, source-repo
            echo "== cosign verify $1 (identity $2)"
            /tmp/cosign verify "$1" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "https://github.com/7K-Inari/$2/" \
              2>&1 | tee -a /artifacts/out/verify.log
          }
          verify "ghcr.io/7k-inari/inari-server:$SERVER_IMAGE" inari-server
          verify "ghcr.io/7k-inari/inari-ui-bundle:$CONSOLE_IMAGE" inari-ui
          verify "ghcr.io/7k-inari/inari-agent:$AGENT_TAG" inari-agent
      outputs:
        artifacts:
          - name: cosign-log
            path: /artifacts/out/verify.log
            archive:
              none: {}
            s3:
              bucket: argo-workflows-artifacts
              endpoint: garage.garage.svc.cluster.local:3900
              insecure: true
              region: garage
              accessKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_KEY_ID
              secretKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_SECRET_KEY
              key: e2e/{{workflow.uid}}/cosign/verify.log

    # ------------------------------------------------------- harbor-scan-gate
    # W6 (plan C9/§5.2): Trivy scans of the candidate image set via the
    # Harbor API (driver: scripts/e2e/scan, Go). Release mode only. Per
    # image: prime the ghcr-proxy cache (manifest-only pull — a proxy-cache
    # artifact exists only after something pulls it), POST
    # .../artifacts/{tag}/scan, poll ?with_scan_overview=true until
    # scan_status=Success (async! never trusts a prior scan's freshness),
    # archive the full additions/vulnerabilities report in S3, and fail when
    # the Critical count exceeds scan-critical-threshold. CVE allowlists are
    # managed in Harbor, never in the driver. Complements cosign-verify
    # (provenance), never replaces it. All Harbor traffic is in-cluster
    # service DNS (harbor-core.harbor.svc: /api/v2.0, /v2/ proxy,
    # /service/token — live-verified) — the gate never depends on the public
    # gateway/DNS/TLS path (exit-handler RP_ENDPOINT precedent).
    #
    # Credentials: ESO secret harbor-scanner (harbor-scanner-secret.yaml;
    # robot account with pull/read + scan/create on ghcr-proxy only —
    # gitops/e2e/README.md §Harbor scan gate). optional: true so a missing
    # secret fails LOUD in the driver (config-error JUnit, run Failed) —
    # a gate that silently degrades to pass is worse than no gate.
    - name: harbor-scan-gate
      activeDeadlineSeconds: 1500
      volumes:
        - name: work
          emptyDir: {}
      initContainers:
        - name: clone-bundle
          image: alpine/git:2.45.2
          command: ["/bin/sh", "-c"]
          args:
            - git init -q /work && cd /work && git remote add origin https://github.com/7K-Inari/inari-release-bundle.git && git fetch -q --depth 1 origin "$REF" && git checkout -q FETCH_HEAD
          env:
            - name: REF
              value: "{{workflow.parameters.charts-ref}}"
          volumeMounts:
            - name: work
              mountPath: /work
      script:
        image: golang:1.26.3-bookworm
        command: [sh]
        env:
          - name: SERVER_IMAGE
            value: "{{workflow.parameters.server-image}}"
          - name: CONSOLE_IMAGE
            value: "{{workflow.parameters.console-image}}"
          - name: AGENT_IMAGE
            value: "{{workflow.parameters.agent-image}}"
          - name: SCAN_CRITICAL_THRESHOLD
            value: "{{workflow.parameters.scan-critical-threshold}}"
          - name: SCAN_RUN_ID
            value: "{{workflow.uid}}"
          - name: HARBOR_ROBOT_USERNAME
            valueFrom:
              secretKeyRef: {name: harbor-scanner, key: username, optional: true}
          - name: HARBOR_ROBOT_TOKEN
            valueFrom:
              secretKeyRef: {name: harbor-scanner, key: token, optional: true}
        source: |
          set -eu
          # Nested Go module (scripts/e2e/scan/go.mod) — run from inside the
          # module (the repo root has no go.mod; seed-leg precedent).
          cd /work/scripts/e2e/scan
          go run .
        volumeMounts:
          - name: work
            mountPath: /work
      outputs:
        artifacts:
          - name: junit
            path: /artifacts/out/junit.xml
            archive:
              none: {}
            s3:
              bucket: argo-workflows-artifacts
              endpoint: garage.garage.svc.cluster.local:3900
              insecure: true
              region: garage
              accessKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_KEY_ID
              secretKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_SECRET_KEY
              key: e2e/{{workflow.uid}}/scan/junit.xml
          # The full additions/vulnerabilities report per image — the
          # gate's evidence. Artifacts only; never imported to ReportPortal.
          - name: reports
            path: /artifacts/reports
            archive:
              none: {}
            s3:
              bucket: argo-workflows-artifacts
              endpoint: garage.garage.svc.cluster.local:3900
              insecure: true
              region: garage
              accessKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_KEY_ID
              secretKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_SECRET_KEY
              key: e2e/{{workflow.uid}}/scan/reports/

    # -------------------------------------------------------------- env-prep
    # Replaces kind bring-up: points the e2e env's per-component ArgoCD apps
    # at the run's candidate charts (targetRevision=charts-ref) and image tags
    # (helm valuesObject), then waits Healthy+Synced. The env pointer app
    # ignores exactly these fields (ignoreDifferences in 7k-app-of-apps), so
    # the patches persist for the run's duration; the next run re-converges
    # the env to ITS artifact set. Platform apps (env-extras, platform-config,
    # openfga, git-service) are health-checked, never mutated (plan §5.3).
    #
    # KNOWN LIMITATION (coordinator directive): a Release PR changing
    # charts/inari-platform gates against the merged platform chart; its
    # changes converge post-merge and are exercised by the nightly.
    #
    # HA flip (ha=true): NATS 3-node + R=3 streams, server 2 replicas + redis
    # cache + scaffold knobs (ported from suite/provision.go). Every patch
    # writes the COMPLETE valuesObject (baseline + flip) — ArgoCD never merges
    # a values string with valuesObject — so a non-HA run deterministically
    # resets HA-only keys back to the file baseline.
    #
    # KEEP IN SYNC: the valuesObject bodies below embed the baselines from
    # gitops/e2e/env/inari-server.yaml (valuesObject arrays replace, they do
    # not merge) — bump both sides together.
    #
    # Invoked TWICE per upgrade-mode run (W5): stage=previous with the
    # resolve-previous refs/images, then stage=candidate with the workflow's
    # own. Other modes invoke it once (stage=candidate).
    - name: env-prep
      activeDeadlineSeconds: 1500
      inputs:
        parameters:
          - name: stage        # candidate | previous (log lines + artifact key)
          - name: server-ref   # git ref for the inari-server chart source
          - name: console-ref  # git ref for the inari-console chart source
          - name: server-image
          - name: console-image
          - name: ha
      script:
        image: alpine/k8s:1.35.10
        command: [sh]
        env:
          - name: STAGE
            value: "{{inputs.parameters.stage}}"
          - name: HA
            value: "{{inputs.parameters.ha}}"
          - name: SERVER_REF
            value: "{{inputs.parameters.server-ref}}"
          - name: CONSOLE_REF
            value: "{{inputs.parameters.console-ref}}"
          - name: SERVER_IMAGE
            value: "{{inputs.parameters.server-image}}"
          - name: CONSOLE_IMAGE
            value: "{{inputs.parameters.console-image}}"
        source: |
          set -eu
          command -v jq >/dev/null 2>&1 || apk add --no-cache jq >/dev/null
          mkdir -p /artifacts/out

          # Git refs are JSON-encoded inside patch_app before they are
          # embedded in the JSON patch (raw shell interpolation would
          # break/mangle the patch on a ref containing a quote).

          # KEEP IN SYNC with gitops/e2e/env/*.yaml: the patches carry the
          # COMPLETE desired valuesObject — ArgoCD's ValuesYAML() returns
          # valuesObject XOR values, it never merges (v3.3.8 values.go;
          # "valuesObject takes precedence over values" = REPLACES). A delta
          # patch would silently drop the whole baseline (live-verified
          # 2026-11-06: chart defaults rendered, embedded nats + kubeproxy
          # came up). The env files hold the same baseline as valuesObject.
          SERVER_VALUES=$(jq -nc --arg tag "$SERVER_IMAGE" --arg ha "$HA" '
            def base: {
              replicaCount: 1,
              image: {
                repository: "harbor.7kgroup.org/ghcr-proxy/7k-inari/inari-server",
                tag: $tag,
                pullPolicy: "Always"
              },
              nats: {enabled: false, url: "nats://nats:4222", streamReplicas: 1},
              kubeproxy: {enabled: false},
              keycloak: {
                baseUrl: "http://keycloak-service:8080",
                realm: "inari",
                adminSecret: {name: "inari-keycloak-admin"}
              },
              oidc: {issuerUrl: "https://auth-e2e.7kgroup.org/realms/inari"},
              gateway: {name: "internet-gateway", namespace: "istio", sectionName: "https-7kgroup"},
              route: {
                enabled: true,
                hostnames: ["inari-e2e.7kgroup.org"],
                pathPrefix: "/api",
                agentHostnames: ["inari-e2e-gw.7kgroup.org"],
                annotations: {"external-dns.kubernetes.io/cloudflare-proxied": "false"}
              },
              extraEnv: [
                {name: "INARI_AGENT_GATEWAY_ADDRESS", value: "https://inari-e2e-gw.7kgroup.org"},
                {name: "INARI_AGENT_IMAGE_REPO", value: "harbor.7kgroup.org/ghcr-proxy/7k-inari/inari-agent"},
                {name: "INARI_GIT_PROVIDER", value: "local"},
                {name: "INARI_GIT_LOCAL_ROOT", value: "/var/lib/inari/git"},
                {name: "INARI_LOG_FORMAT", value: "json"},
                {name: "INARI_ESO_SECRET_NAMESPACE", value: "inari-e2e-agent"}
              ],
              extraVolumes: [{name: "git-root", persistentVolumeClaim: {claimName: "inari-e2e-git"}}],
              extraVolumeMounts: [{name: "git-root", mountPath: "/var/lib/inari/git"}],
              vault: {
                addr: "https://vault.int.7kgroup.org",
                kvMount: "secret",
                authMethod: "kubernetes",
                role: "inari-e2e-server"
              }
            };
            if $ha == "true" then
              base
              | .replicaCount = 2
              | .cache = {backend: "redis"}
              | .redis = {enabled: true, image: {registry: "docker.io", repository: "bitnamilegacy/redis", tag: "8.2.1"}}
              | .nats.streamReplicas = 3
              | .extraEnv += [
                  {name: "INARI_SCAFFOLD_TEMPLATE_DIR", value: "/templates"},
                  {name: "INARI_SCAFFOLD_GIT_ORG", value: "e2e-platform"},
                  {name: "INARI_SCAFFOLD_RECONCILE_INTERVAL", value: "5s"}
                ]
            else base end')
          CONSOLE_VALUES=$(jq -nc --arg tag "$CONSOLE_IMAGE" '{
            bundle: {
              repository: "harbor.7kgroup.org/ghcr-proxy/7k-inari/inari-ui-bundle",
              tag: $tag
            },
            gateway: {name: "internet-gateway", namespace: "istio", sectionName: "https-7kgroup"},
            route: {
              enabled: true,
              hostnames: ["inari-e2e.7kgroup.org"],
              pathPrefix: "/",
              annotations: {"external-dns.kubernetes.io/cloudflare-proxied": "false"}
            },
            keycloakUrl: "https://auth-e2e.7kgroup.org",
            keycloakRealm: "inari",
            keycloakClientId: "inari-ui",
            apiBaseUrl: "/api/v1"
          }')
          # Nats: full baseline either way — the cluster block is CONSTANT
          # (permanently 3-node since 2026-11-07: standalone→clustered
          # conversion is unsupported — the first nightly died on it). The
          # deterministic rewrite is pure self-heal. The HA flip now covers
          # server/console/agent only; the server pins streamReplicas per run.
          NATS_VALUES=$(jq -nc '{
            fullnameOverride: "nats",
            config: {
              cluster: {enabled: true, replicas: 3},
              jetstream: {
                enabled: true,
                fileStore: {
                  enabled: true,
                  pvc: {size: "1Gi", storageClassName: "longhorn-hdd-no-backup"}
                }
              }
            },
            container: {merge: {resources: {requests: {cpu: "50m", memory: "128Mi"}}}}
          }')

          # patch_app <app> <jsonPatchBase> <jqBase> <desiredValuesObject>
          # <rev|"-">: applies valuesObject (+ targetRevision when rev != "-")
          # ONLY on drift, recording the pre-patch reconciledAt in $GEN_DIR
          # for wait_app. rev="-" for nats: its targetRevision is the upstream
          # CHART VERSION (2.15.2), never the bundle ref — patching it to
          # charts-ref breaks the render (live-verified 2026-11-06) and the
          # env pointer's ignoreDifferences deliberately covers only
          # valuesObject for nats, so the bad revision self-healed back.
          # rev is JSON-encoded before embedding (quote-safe).
          GEN_DIR=/tmp/gens; mkdir -p "$GEN_DIR"
          patch_app() {
            app="$1"; pbase="$2"; jbase="$3"; desired="$4"; rev="$5"
            rec=$(kubectl -n argocd get application "$app" -o jsonpath='{.status.reconciledAt}')
            cur=$(kubectl -n argocd get application "$app" -o json | jq -cS ".${jbase}.helm.valuesObject // {}")
            des=$(echo "$desired" | jq -cS .)
            if [ "$rev" = "-" ]; then
              if [ "$cur" = "$des" ]; then
                echo "  $app values already at the $STAGE set — no patch"
                rm -f "$GEN_DIR/$app"
                return
              fi
              kubectl -n argocd patch application "$app" --type=json -p '[
                {"op":"add","path":"'"$pbase"'/helm/valuesObject","value":'"$desired"'}
              ]'
            else
              ref=$(kubectl -n argocd get application "$app" -o json | jq -r ".${jbase}.targetRevision // \"\"")
              if [ "$cur" = "$des" ] && [ "$ref" = "$rev" ]; then
                echo "  $app already at the $STAGE set — no patch"
                rm -f "$GEN_DIR/$app"
                return
              fi
              rev_json=$(jq -nc --arg v "$rev" '$v')
              kubectl -n argocd patch application "$app" --type=json -p '[
                {"op":"replace","path":"'"$pbase"'/targetRevision","value":'"$rev_json"'},
                {"op":"add","path":"'"$pbase"'/helm/valuesObject","value":'"$desired"'}
              ]'
            fi
            echo "$rec" > "$GEN_DIR/$app"
          }

          # wait_app <app> — Healthy+Synced, 10s interval, 15m budget. When a
          # patch WAS applied, additionally require status.reconciledAt to
          # ADVANCE past the pre-patch value: the patch→poll race
          # (live-verified 2026-11-06) is that health/sync status is STALE
          # until the controller's first reconciliation against the new
          # spec. (Application status has NO observedGeneration on ArgoCD
          # v3.3.8 — reconciledAt is the field that advances.)
          wait_app() {
            app="$1"
            base=$(cat "$GEN_DIR/$app" 2>/dev/null || echo "")
            i=0
            while [ $i -lt 90 ]; do
              out=$(kubectl -n argocd get application "$app" -o jsonpath='{.status.health.status}/{.status.sync.status}/{.status.reconciledAt}' 2>/dev/null || echo "Unknown/Unknown/")
              echo "  $app: $out"
              h="${out%%/*}"; rest="${out#*/}"; sy="${rest%%/*}"; rec="${rest#*/}"
              if [ "$h/$sy" = "Healthy/Synced" ] && { [ -z "$base" ] || [ "$rec" \> "$base" ]; }; then return 0; fi
              i=$((i+1)); sleep 10
            done
            echo "  $app never became Healthy/Synced" >&2
            return 1
          }

          echo "== [$STAGE] patching inari-e2e-server (ref=$SERVER_REF, image=$SERVER_IMAGE, ha=$HA)"
          patch_app inari-e2e-server "/spec/sources/0" "spec.sources[0]" "$SERVER_VALUES" "$SERVER_REF"

          echo "== [$STAGE] patching inari-e2e-console (ref=$CONSOLE_REF, bundle=$CONSOLE_IMAGE)"
          patch_app inari-e2e-console "/spec/source" "spec.source" "$CONSOLE_VALUES" "$CONSOLE_REF"

          echo "== patching inari-e2e-nats (ha=$HA)"
          patch_app inari-e2e-nats "/spec/source" "spec.source" "$NATS_VALUES" "-"

          echo "== waiting for candidate apps"
          wait_app inari-e2e-server
          wait_app inari-e2e-console
          wait_app inari-e2e-nats

          echo "== platform apps health check (never mutated)"
          for app in inari-e2e-env-extras inari-e2e-platform-config inari-e2e-openfga inari-e2e-git-service; do
            health=$(kubectl -n argocd get application "$app" -o jsonpath='{.status.health.status}' 2>/dev/null || echo Missing)
            echo "  $app: $health"
            [ "$health" = "Healthy" ] || { echo "$app is $health — env is not healthy enough to test" >&2; exit 1; }
          done

          # Post-convergence probe: 401 proves route + server + auth
          # middleware (no public health endpoint is routed — gitops/e2e
          # README verification convention).
          echo "== post-convergence probe"
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 12 --retry-delay 10 --retry-all-errors \
            "https://inari-e2e.7kgroup.org/api/v1/tenants" || true)
          echo "  /api/v1/tenants -> HTTP $code"
          [ "$code" = "401" ] || { echo "post-convergence probe failed (want 401, got $code)" >&2; exit 1; }

          jq -nc --arg stage "$STAGE" --arg serverRef "$SERVER_REF" --arg consoleRef "$CONSOLE_REF" \
            --arg server "$SERVER_IMAGE" --arg console "$CONSOLE_IMAGE" --arg ha "$HA" \
            '{stage: $stage, serverRef: $serverRef, consoleRef: $consoleRef, serverImage: $server, consoleImage: $console, ha: ($ha == "true")}' > /artifacts/out/env-prep.json
          echo "== env-prep ($STAGE) complete"
      outputs:
        artifacts:
          - name: env-prep-summary
            path: /artifacts/out/env-prep.json
            archive:
              none: {}
            s3:
              bucket: argo-workflows-artifacts
              endpoint: garage.garage.svc.cluster.local:3900
              insecure: true
              region: garage
              accessKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_KEY_ID
              secretKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_SECRET_KEY
              # stage-templated: upgrade mode invokes env-prep twice per run.
              key: e2e/{{workflow.uid}}/env-prep-{{inputs.parameters.stage}}/env-prep.json

    # -------------------------------------------------------- upgrade-fixture
    # Upgrade mode only (W5): creates the pre-upgrade fixture ON THE OLD
    # STACK — a tenant org written by the previous version whose survival the
    # upgrade-assert step checks after the candidate deploy (the
    # migration-0029 class: a candidate migration breaking on pre-existing
    # data). Slug e2e-<uid>-upgrade → the janitor reaps it like any suite org
    # (environment-contract invariant 6).
    #
    # The full Go seed is deliberately NOT run on the old stack: the latest
    # stable server (3.0.0) predates the roles/membership APIs the seed
    # exercises, so a seed there would fail for API-drift reasons, not
    # upgrade reasons.
    - name: upgrade-fixture
      activeDeadlineSeconds: 300
      script:
        image: alpine/k8s:1.35.10
        command: [sh]
        envFrom:
          - configMapRef:
              name: e2e-env-contract
        env:
          - name: E2E_USER
            value: dev-admin
          - name: E2E_PASSWORD
            valueFrom:
              secretKeyRef: {name: inari-e2e-personas, key: dev-admin-password}
          - name: FIXTURE_SLUG
            value: e2e-{{workflow.uid}}-upgrade
          - name: FIXTURE_NAME
            value: E2E Upgrade Fixture {{workflow.uid}}
        source: |
          set -eu
          command -v jq >/dev/null 2>&1 || apk add --no-cache jq >/dev/null

          echo "== direct-grant token ($E2E_USER)"
          TOKEN=$(curl -sf "$E2E_KC_URL/realms/inari/protocol/openid-connect/token" \
            -d grant_type=password -d client_id=inari-server \
            -d "username=$E2E_USER" -d "password=$E2E_PASSWORD" \
            -d "scope=openid organization:*" | jq -r '.access_token // ""')
          [ -n "$TOKEN" ] || { echo "could not obtain a user token" >&2; exit 1; }

          echo "== creating fixture tenant $FIXTURE_SLUG on the previous stack"
          CODE=$(curl -s -o /tmp/fixture-resp.json -w '%{http_code}' -X POST \
            "https://$E2E_BASE_DOMAIN/api/v1/tenants" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg slug "$FIXTURE_SLUG" --arg name "$FIXTURE_NAME" '{slug: $slug, displayName: $name}')")
          case "$CODE" in
            2*) echo "  created (HTTP $CODE)";;
            *)
              # Duplicate slugs are a 500 today (inari-server backlog:
              # duplicate-slug 500 vs 409). A rerun of a crashed upgrade run
              # must be idempotent — accept "already present" either way.
              echo "  POST returned HTTP $CODE — checking for a pre-existing fixture"
              curl -sf -H "Authorization: Bearer $TOKEN" "https://$E2E_BASE_DOMAIN/api/v1/tenants" \
                | jq -e --arg slug "$FIXTURE_SLUG" '.tenants[] | select(.slug == $slug)' >/dev/null \
                || { echo "  fixture absent and creation failed:" >&2; cat /tmp/fixture-resp.json >&2; exit 1; }
              echo "  already present — idempotent no-op";;
          esac

          # Poll after the mutation (contract invariant 2): the read-back
          # races the membership/list materialization — a token issued BEFORE
          # the create does not see the new org at all (live-verified
          # 2026-11-07: HTTP 200 on POST, immediate GET missed it, a fresh
          # token minutes later saw it). Re-issue the token per attempt.
          echo "== asserting the fixture is readable on the previous stack (poll)"
          i=0
          while [ $i -lt 24 ]; do
            TOKEN=$(curl -sf "$E2E_KC_URL/realms/inari/protocol/openid-connect/token" \
              -d grant_type=password -d client_id=inari-server \
              -d "username=$E2E_USER" -d "password=$E2E_PASSWORD" \
              -d "scope=openid organization:*" | jq -r '.access_token // ""') || TOKEN=""
            if [ -n "$TOKEN" ] && curl -sf -H "Authorization: Bearer $TOKEN" \
                "https://$E2E_BASE_DOMAIN/api/v1/tenants/$FIXTURE_SLUG" \
                | jq -e --arg slug "$FIXTURE_SLUG" --arg name "$FIXTURE_NAME" \
                    '.organization | select(.slug == $slug and .displayName == $name)' >/dev/null; then
              break
            fi
            i=$((i+1)); sleep 5
          done
          [ $i -lt 24 ] || { echo "fixture tenant not readable after creation (2m poll)" >&2; exit 1; }
          echo "== fixture tenant $FIXTURE_SLUG present on the previous stack (attempt $((i+1)))"

    # ----------------------------------------------------- upgrade-drill-pause
    # Drill aid (W5): when upgrade-drill-pause-minutes != 0, suspends the run
    # for that many minutes between the fixture and the candidate env-prep —
    # the deterministic window in which the broken-migration drill sabotages
    # DB state (gitops/e2e/README.md §upgrade leg). Auto-resumes. The node is
    # when-gated on != 0, so the "0m" duration never actually evaluates.
    - name: upgrade-drill-pause
      suspend:
        duration: "{{workflow.parameters.upgrade-drill-pause-minutes}}m"

    # --------------------------------------------------------- upgrade-assert
    # Upgrade mode only (W5), after the candidate seed: proves the
    # pre-upgrade fixture tenant survived the upgrade (read-only) and emits
    # the leg's synthetic JUnit — the leg's crisp ReportPortal signal even
    # when the suites are filtered to a small set.
    - name: upgrade-assert
      activeDeadlineSeconds: 300
      script:
        image: alpine/k8s:1.35.10
        command: [sh]
        envFrom:
          - configMapRef:
              name: e2e-env-contract
        env:
          - name: E2E_USER
            value: dev-admin
          - name: E2E_PASSWORD
            valueFrom:
              secretKeyRef: {name: inari-e2e-personas, key: dev-admin-password}
          - name: FIXTURE_SLUG
            value: e2e-{{workflow.uid}}-upgrade
          - name: FIXTURE_NAME
            value: E2E Upgrade Fixture {{workflow.uid}}
        source: |
          set -eu
          command -v jq >/dev/null 2>&1 || apk add --no-cache jq >/dev/null
          mkdir -p /artifacts/out

          # printf, not a heredoc: the XML declaration must sit at byte 0
          # (leading whitespace before <?xml is invalid) and an indented
          # heredoc terminator would not terminate.
          write_junit() { # $1 = pass | fail:<message>  (messages are fixed
                          # ASCII strings — no XML-escaping needed)
            if [ "$1" = "pass" ]; then
              printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?><testsuite name="upgrade" tests="2" failures="0"><testcase classname="upgrade" name="deploy-previous-stable"/><testcase classname="upgrade" name="fixture-survives-upgrade"/></testsuite>' \
                > /artifacts/out/junit.xml
            else
              msg=${1#fail:}
              printf '%s\n' "<?xml version=\"1.0\" encoding=\"UTF-8\"?><testsuite name=\"upgrade\" tests=\"2\" failures=\"1\"><testcase classname=\"upgrade\" name=\"deploy-previous-stable\"/><testcase classname=\"upgrade\" name=\"fixture-survives-upgrade\"><failure message=\"$msg\">$msg</failure></testcase></testsuite>" \
                > /artifacts/out/junit.xml
            fi
          }

          echo "== asserting fixture tenant $FIXTURE_SLUG survived the upgrade (poll)"
          i=0
          FOUND=""
          while [ $i -lt 12 ]; do
            # Fresh token per attempt (the post-create read-back race is
            # token-scope staleness — see upgrade-fixture).
            TOKEN=$(curl -sf "$E2E_KC_URL/realms/inari/protocol/openid-connect/token" \
              -d grant_type=password -d client_id=inari-server \
              -d "username=$E2E_USER" -d "password=$E2E_PASSWORD" \
              -d "scope=openid organization:*" | jq -r '.access_token // ""') || TOKEN=""
            if [ -n "$TOKEN" ] && curl -sf -H "Authorization: Bearer $TOKEN" \
                "https://$E2E_BASE_DOMAIN/api/v1/tenants/$FIXTURE_SLUG" \
                | jq -e --arg slug "$FIXTURE_SLUG" --arg name "$FIXTURE_NAME" \
                    '.organization | select(.slug == $slug and .displayName == $name)' >/dev/null; then
              FOUND=1; break
            fi
            i=$((i+1)); sleep 10
          done
          if [ -n "$FOUND" ]; then
            write_junit pass
            echo "== fixture survived the upgrade (attempt $((i+1)))"
          else
            write_junit "fail:fixture tenant $FIXTURE_SLUG missing or altered after the upgrade"
            cat /artifacts/out/junit.xml
            exit 1
          fi
      outputs:
        artifacts:
          - name: junit
            path: /artifacts/out/junit.xml
            archive:
              none: {}
            s3:
              bucket: argo-workflows-artifacts
              endpoint: garage.garage.svc.cluster.local:3900
              insecure: true
              region: garage
              accessKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_KEY_ID
              secretKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_SECRET_KEY
              key: e2e/{{workflow.uid}}/upgrade/junit.xml

    # ------------------------------------------------------------------ seed
    # Persona + handoff seed (W3a contract — scripts/e2e/seed, Go). Idempotent;
    # re-adds the inari-ui redirect whitelist (the realm re-import on every
    # candidate deploy wipes it — hard rule 4); writes the e2e-handoff
    # ConfigMap (namespace, tenant, kc_uid, org_kc_id, cluster_id, org_id,
    # toolbox); fails the run fast on membership-API misbehavior (P0 signal).
    - name: seed
      activeDeadlineSeconds: 600
      podSpecPatch: '{"serviceAccountName":"e2e-seed"}'
      volumes:
        - name: work
          emptyDir: {}
      initContainers:
        - name: clone-bundle
          image: alpine/git:2.45.2
          command: ["/bin/sh", "-c"]
          args:
            - git init -q /work && cd /work && git remote add origin https://github.com/7K-Inari/inari-release-bundle.git && git fetch -q --depth 1 origin "$REF" && git checkout -q FETCH_HEAD
          env:
            - name: REF
              value: "{{workflow.parameters.charts-ref}}"
          volumeMounts:
            - name: work
              mountPath: /work
      script:
        image: golang:1.26.3-bookworm
        command: [sh]
        envFrom:
          - configMapRef:
              name: e2e-env-contract
        env:
          - name: E2E_USER
            value: dev-admin
          - name: E2E_PASSWORD
            valueFrom:
              secretKeyRef: {name: inari-e2e-personas, key: dev-admin-password}
          - name: E2E_OPERATOR_PASSWORD
            valueFrom:
              secretKeyRef: {name: inari-e2e-personas, key: operator-password}
          - name: E2E_EDITOR_PASSWORD
            valueFrom:
              secretKeyRef: {name: inari-e2e-personas, key: editor-password}
          - name: E2E_VIEWER_PASSWORD
            valueFrom:
              secretKeyRef: {name: inari-e2e-personas, key: viewer-password}
          - name: E2E_MEMBER_PASSWORD
            valueFrom:
              secretKeyRef: {name: inari-e2e-personas, key: member-password}
          # optional: the ops-password key lands only after the Vault property
          # inari-e2e/personas.ops exists (#131 env-extras wiring) — until
          # then the pod must still start and the seed falls back to its
          # default, converging the identity on every run.
          - name: E2E_OPS_PASSWORD
            valueFrom:
              secretKeyRef: {name: inari-e2e-personas, key: ops-password, optional: true}
          - name: SEED_KC_ADMIN_CLIENT_SECRET
            valueFrom:
              secretKeyRef: {name: inari-keycloak-admin, key: client-secret}
        source: |
          set -eu
          # The seed is a nested Go module (scripts/e2e/seed/go.mod) and the
          # repo root has no go.mod — `go run ./scripts/e2e/seed` from /work
          # fails with "go.mod file not found". Run from inside the module.
          cd /work/scripts/e2e/seed
          go run .
        volumeMounts:
          - name: work
            mountPath: /work

    # ---------------------------------------------------------- agent-ensure
    # Installs/upgrades the e2e agent (release inari-agent-e2e) onto the
    # platform cluster as the registered e2e-self cluster's workload agent.
    # Idempotent: helm upgrade --install + a fresh TTL'd registration token
    # per run (burned on first connect). The OIDC client secret is delivered
    # by ESO from the existing vault-internal ClusterSecretStore — the control
    # plane wrote it during the seed's registration exchange.
    #
    # Chart source: the knobs this install relies on (discovery.name,
    # namespaceCreate — inari-agent #88) reach oci://ghcr.io/7k-inari/charts
    # via EDGE publishing (inari-agent #89) — no stable release needed.
    # agent-image=edge pins the chart to AGENT_CHART_VERSION_EDGE below (a
    # published edge chart, never a floating tag); move the pin to the next
    # stable chart version once one carries the knobs.
    - name: agent-ensure
      activeDeadlineSeconds: 900
      podSpecPatch: '{"serviceAccountName":"e2e-agent-ensure"}'
      script:
        image: alpine/k8s:1.35.10
        command: [sh]
        envFrom:
          - configMapRef:
              name: e2e-env-contract
        env:
          - name: E2E_USER
            value: dev-admin
          - name: E2E_PASSWORD
            valueFrom:
              secretKeyRef: {name: inari-e2e-personas, key: dev-admin-password}
          - name: AGENT_IMAGE
            value: "{{workflow.parameters.agent-image}}"
        source: |
          set -eu
          command -v jq >/dev/null 2>&1 || apk add --no-cache jq >/dev/null

          echo "== reading handoff ConfigMap"
          CM=$(kubectl -n inari-e2e get configmap e2e-handoff -o json)
          CLUSTER_ID=$(echo "$CM" | jq -r '.data.cluster_id // ""')
          ORG_ID=$(echo "$CM" | jq -r '.data.org_id // ""')
          [ -n "$CLUSTER_ID" ] && [ -n "$ORG_ID" ] \
            || { echo "e2e-handoff ConfigMap missing cluster_id/org_id — the seed step must publish them first" >&2; exit 1; }
          echo "  cluster_id=$CLUSTER_ID org_id=$ORG_ID"

          echo "== issuing registration token (dev-admin direct grant)"
          TOKEN=$(curl -sf "$E2E_KC_URL/realms/inari/protocol/openid-connect/token" \
            -d grant_type=password -d client_id=inari-server \
            -d "username=$E2E_USER" -d "password=$E2E_PASSWORD" \
            -d "scope=openid organization:*" | jq -r '.access_token // ""')
          [ -n "$TOKEN" ] || { echo "could not obtain a user token" >&2; exit 1; }
          REG_TOKEN=$(curl -sf -X POST \
            "https://$E2E_BASE_DOMAIN/api/v1/tenants/$E2E_TENANT_SLUG/clusters/$CLUSTER_ID/tokens" \
            -H "Authorization: Bearer $TOKEN" | jq -r '.token // ""')
          [ -n "$REG_TOKEN" ] || { echo "could not issue a registration token" >&2; exit 1; }

          # Chart==component versioning (release.yml seds both from the tag);
          # agent-image=edge pins the TEMPORARY edge chart carrying the
          # discovery.name/namespaceCreate knobs (never a floating tag — see
          # the step header). 0.6.0-c74e714 = inari-agent@c74e714 (merge of
          # #91: chart memory defaults raised to 128Mi/512Mi from the measured
          # OOM headroom), verified via helm show chart + helm show values
          # (defaults byte-identical to the override this file used to carry).
          # Move the pin to the next stable chart version once one carries
          # the knobs.
          #
          # Tag-prefix convention split (registry-verified): the agent CHART
          # version is unprefixed (0.5.1) but the agent IMAGE tag is
          # v-prefixed (v0.5.1) — normalize the image tag defensively (bare
          # X.Y.Z only; "edge" and per-commit edge builds stay as-is). The
          # systemic convention fix is a separate cross-repo issue.
          AGENT_CHART_VERSION_EDGE="0.6.0-c74e714"
          VERSION_ARGS=""
          AGENT_TAG="$AGENT_IMAGE"
          case "$AGENT_TAG" in
            v*) ;;
            *) echo "$AGENT_TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' && AGENT_TAG="v$AGENT_TAG" || true;;
          esac
          if [ "$AGENT_IMAGE" != "edge" ]; then
            VERSION_ARGS="--version $AGENT_IMAGE"
          elif [ -n "$AGENT_CHART_VERSION_EDGE" ]; then
            VERSION_ARGS="--version $AGENT_CHART_VERSION_EDGE"
          else
            echo "::warning:: edge chart pin unset — using the latest published chart (knobs may be missing until inari-agent #89 merges)"
          fi

          # Stale persisted-registration hazard (live-verified 2026-11-06):
          # the agent persists its registration (incl. the secret-delivery
          # reference) in inari-agent-registration and LOADS it on restart,
          # never re-registering — a run that registered against a broken
          # control plane poisons every later run. agent-ensure issues a
          # fresh token per run anyway, so force re-registration.
          kubectl -n inari-e2e-agent delete configmap inari-agent-registration --ignore-not-found

          # controlPlane: in-cluster h2c — the live agent precedent (the istio
          # gateway's H2 bidi path to the public gw hostname is broken; the
          # public hostname is for external clusters).
          # kubectlTunnel.enabled=false: kubeproxy is disabled on the e2e env;
          # the tunnel chain stays docker-only.
          # pullPolicy: floating tags need Always — with IfNotPresent the node
          # serves its FIRST cached "edge" manifest forever on this long-lived
          # cluster (live-verified 2026-11-06: agent-image=edge resolved to a
          # stale pre-#90 image and crash-looped on the inari-system
          # registration-CM lookup that #90 fixed).
          PULL_POLICY=IfNotPresent
          [ "$AGENT_IMAGE" = "edge" ] && PULL_POLICY=Always
          # Memory: no override anymore — the chart defaults ARE the measured
          # values since inari-agent#91 (128Mi/512Mi; the capability watchers'
          # initial LIST storm climbed ~1.3MB/s past the old 128Mi limit at
          # ~75s — cgroup SIGKILL, reported as exit 137 / reason Error, no
          # OOMKilled marker). The edge-chart pin above sits past #91.
          # No helm --wait: helm's kstatus-based waiter NEVER observes the
          # rollout under this SA — it burns the whole timeout and then
          # reports "Deployment ... not ready. status: Unknown" even when the
          # Deployment's Available condition has been True for minutes
          # (live-verified twice: round 10 @300s, round 13 @600s — pod Ready
          # 3m13s into a 600s wait, helm still timed out). kubectl rollout
          # status uses a plain get/list/watch the Role provably allows.
          # 600s budget: cold start is ~5.5min (live-verified: KC client
          # provision + Vault write + ESO sync + the agent's in-process 2m
          # ESO poll + a crash-restart cycle); round 13's full chain took
          # 3m13s.
          # Values go through a FILE, never a backslash-continued --set list:
          # a comment line severing the continuation silently dropped every
          # trailing flag TWICE (2026-11-06 — once losing --wait/--timeout,
          # once flipping kubectlTunnel back to the chart default true and
          # skipping the oidc/memory overrides of that era).
          cat > /tmp/agent-values.yaml <<AGENTVALUES
          namespace: inari-e2e-agent
          namespaceCreate: false
          discovery:
            name: inari-agent-e2e-discovery
          image:
            repository: harbor.7kgroup.org/ghcr-proxy/7k-inari/inari-agent
            tag: "$AGENT_TAG"
            pullPolicy: $PULL_POLICY
          config:
            tenantID: "$ORG_ID"
            controlPlane: http://inari-server.inari-e2e.svc:8080
            registrationToken: "$REG_TOKEN"
            clusterLabels: e2e=true
            helmNamespaces: inari-e2e-agent
          kubectlTunnel:
            enabled: false
          oidcSecret:
            create: true
            secretStore: vault-internal
            secretStoreKind: ClusterSecretStore
            remotePath: inari/clusters/${CLUSTER_ID#cluster:}/oidc-client-secret
          AGENTVALUES
          echo "== helm upgrade --install inari-agent-e2e (image $AGENT_TAG, chart ${VERSION_ARGS:-latest})"
          helm upgrade --install inari-agent-e2e oci://ghcr.io/7k-inari/charts/inari-agent \
            --namespace inari-e2e $VERSION_ARGS \
            -f /tmp/agent-values.yaml
          kubectl rollout status deployment/inari-agent -n inari-e2e-agent --timeout=600s
          echo "== agent installed; the Ginkgo cluster phase asserts the connected-agent chain"

    # -------------------------------------------------------- chainsaw-verify
    # Declarative cluster-state assertions (PR #108). release/smoke: the smoke
    # set; edge/nightly: the whole bootstrap dir (all smoke+p0). The dr/ set
    # never runs here — it asserts restored content and fails on a fresh env
    # by design.
    - name: chainsaw-verify
      activeDeadlineSeconds: 1800
      volumes:
        - name: work
          emptyDir: {}
      initContainers:
        - name: clone-bundle
          image: alpine/git:2.45.2
          command: ["/bin/sh", "-c"]
          args:
            - git init -q /work && cd /work && git remote add origin https://github.com/7K-Inari/inari-release-bundle.git && git fetch -q --depth 1 origin "$REF" && git checkout -q FETCH_HEAD
          env:
            - name: REF
              value: "{{workflow.parameters.charts-ref}}"
          volumeMounts:
            - name: work
              mountPath: /work
      script:
        # Not the kyverno/chainsaw image: the tests' script steps shell out to
        # kubectl, which the scratch image lacks — alpine/k8s has both.
        image: alpine/k8s:1.35.10
        command: [sh]
        env:
          - name: MODE
            value: "{{workflow.parameters.mode}}"
        source: |
          set -eu
          CHAINSAW_VERSION=0.2.13
          CHAINSAW_SHA256=6c8d4cdccacbea7100a8354893b3176d874eecfe70c930fbe0496b7967d61ca4
          curl -sfL -o /tmp/chainsaw.tgz "https://github.com/kyverno/chainsaw/releases/download/v${CHAINSAW_VERSION}/chainsaw_linux_amd64.tar.gz"
          echo "$CHAINSAW_SHA256  /tmp/chainsaw.tgz" | sha256sum -c -
          tar -xzf /tmp/chainsaw.tgz -C /tmp chainsaw

          SELECTOR=""
          case "$MODE" in
            release|smoke) SELECTOR="--selector e2e.inari.io/set=smoke";;
          esac

          mkdir -p /artifacts/out
          /tmp/chainsaw test \
            --config /work/scripts/e2e/chainsaw/.chainsaw.yaml \
            --test-dir /work/scripts/e2e/chainsaw/bootstrap \
            --values /work/scripts/e2e/chainsaw/values/expected.yaml \
            --namespace inari-e2e \
            --report-path /artifacts/out \
            $SELECTOR
        volumeMounts:
          - name: work
            mountPath: /work
      outputs:
        artifacts:
          - name: junit
            path: /artifacts/out/junit.xml
            archive:
              none: {}
            s3:
              bucket: argo-workflows-artifacts
              endpoint: garage.garage.svc.cluster.local:3900
              insecure: true
              region: garage
              accessKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_KEY_ID
              secretKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_SECRET_KEY
              key: e2e/{{workflow.uid}}/chainsaw/junit.xml

    # ---------------------------------------------------------------- ginkgo
    # Go stack suite (Ginkgo v2) in attach mode against the persistent env.
    # Label filters per stage (docs/e2e/test-taxonomy.md §3). ha=true: E2E_HA=1
    # + the inari-server checkout supplies E2E_MIGRATIONS_DIR (hard rule 9).
    - name: ginkgo
      activeDeadlineSeconds: 4500
      volumes:
        - name: work
          emptyDir: {}
        - name: srv
          emptyDir: {}
      initContainers:
        - name: clone-bundle
          image: alpine/git:2.45.2
          command: ["/bin/sh", "-c"]
          args:
            - git init -q /work && cd /work && git remote add origin https://github.com/7K-Inari/inari-release-bundle.git && git fetch -q --depth 1 origin "$REF" && git checkout -q FETCH_HEAD
          env:
            - name: REF
              value: "{{workflow.parameters.charts-ref}}"
          volumeMounts:
            - name: work
              mountPath: /work
        - name: clone-server
          image: alpine/git:2.45.2
          command: ["/bin/sh", "-c"]
          args:
            - git init -q /srv && cd /srv && git remote add origin https://github.com/7K-Inari/inari-server.git && git fetch -q --depth 1 origin "$REF" && git checkout -q FETCH_HEAD
          env:
            - name: REF
              value: "{{workflow.parameters.server-src-ref}}"
          volumeMounts:
            - name: srv
              mountPath: /srv
      script:
        image: golang:1.26.3-bookworm
        command: [sh]
        envFrom:
          - configMapRef:
              name: e2e-env-contract
        env:
          - name: E2E_RUN_ID
            value: "{{workflow.uid}}"
          - name: E2E_MODE
            value: "{{workflow.parameters.mode}}"
          - name: E2E_HA
            value: "{{workflow.parameters.ha}}"
          - name: INCLUDE_QUARANTINED
            value: "{{workflow.parameters.include-quarantined}}"
          - name: E2E_MIGRATIONS_DIR
            value: /srv/internal/db/migrations
          - name: E2E_USER
            value: dev-admin
          - name: E2E_PASSWORD
            valueFrom:
              secretKeyRef: {name: inari-e2e-personas, key: dev-admin-password}
        source: |
          set -eu
          curl -sfL -o /usr/local/bin/kubectl https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl
          chmod +x /usr/local/bin/kubectl

          case "$E2E_MODE" in
            # upgrade re-runs the GATE selection on the upgraded stack
            # (taxonomy §3 upgrade stage row).
            release|edge|upgrade) FILTER="(p0||smoke)&&!quarantine";;
            nightly)      FILTER="p0||p1||p2"
                          [ "$INCLUDE_QUARANTINED" = "true" ] || FILTER="($FILTER)&&!quarantine";;
            smoke)        FILTER="smoke";;
            *) echo "no ginkgo selection for mode $E2E_MODE" >&2; exit 1;;
          esac
          # The Ginkgo flag takes its value space-separated when passed via
          # -args (a --flag=value form is also accepted; keep = to be safe).
          TIMEOUT=40m
          [ "{{workflow.parameters.ha}}" = "true" ] && TIMEOUT=50m

          cd /work/scripts/e2e/stack
          mkdir -p /artifacts/out
          go test -tags=e2e -count=1 -timeout "$TIMEOUT" . \
            -args "--ginkgo.label-filter=$FILTER" \
                  "--ginkgo.junit-report=/artifacts/out/junit.xml"
        volumeMounts:
          - name: work
            mountPath: /work
          - name: srv
            mountPath: /srv
      outputs:
        artifacts:
          - name: junit
            path: /artifacts/out/junit.xml
            archive:
              none: {}
            s3:
              bucket: argo-workflows-artifacts
              endpoint: garage.garage.svc.cluster.local:3900
              insecure: true
              region: garage
              accessKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_KEY_ID
              secretKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_SECRET_KEY
              key: e2e/{{workflow.uid}}/ginkgo/junit.xml

    # ------------------------------------------------------------ playwright
    # UI suite, sharded (withParam over two shards — keep the exit-handler's
    # playwright junit inputs in sync). env.ts consumes the contract vars
    # (W3a re-parameterization); persona passwords come from the personas
    # secret, never from parameters.
    - name: playwright
      activeDeadlineSeconds: 3600
      inputs:
        parameters:
          - name: shard
          - name: shard-safe
      volumes:
        - name: work
          emptyDir: {}
      initContainers:
        - name: clone-bundle
          image: alpine/git:2.45.2
          command: ["/bin/sh", "-c"]
          args:
            - git init -q /work && cd /work && git remote add origin https://github.com/7K-Inari/inari-release-bundle.git && git fetch -q --depth 1 origin "$REF" && git checkout -q FETCH_HEAD
          env:
            - name: REF
              value: "{{workflow.parameters.charts-ref}}"
          volumeMounts:
            - name: work
              mountPath: /work
      script:
        image: mcr.microsoft.com/playwright:v1.64.1-noble
        command: [sh]
        envFrom:
          - configMapRef:
              name: e2e-env-contract
        env:
          - name: E2E_RUN_ID
            value: "{{workflow.uid}}"
          - name: E2E_MODE
            value: "{{workflow.parameters.mode}}"
          - name: E2E_USER
            value: dev-admin
          - name: E2E_PASSWORD
            valueFrom:
              secretKeyRef: {name: inari-e2e-personas, key: dev-admin-password}
          - name: E2E_OPERATOR_PASSWORD
            valueFrom:
              secretKeyRef: {name: inari-e2e-personas, key: operator-password}
          - name: E2E_EDITOR_PASSWORD
            valueFrom:
              secretKeyRef: {name: inari-e2e-personas, key: editor-password}
          - name: E2E_VIEWER_PASSWORD
            valueFrom:
              secretKeyRef: {name: inari-e2e-personas, key: viewer-password}
          - name: E2E_MEMBER_PASSWORD
            valueFrom:
              secretKeyRef: {name: inari-e2e-personas, key: member-password}
          - name: INCLUDE_QUARANTINED
            value: "{{workflow.parameters.include-quarantined}}"
        source: |
          set -eu
          # set -- keeps the grep expressions quoted (the | would otherwise
          # be a shell pipe).
          case "$E2E_MODE" in
            # upgrade re-runs the GATE selection on the upgraded stack
            # (taxonomy §3 upgrade stage row).
            release|edge|upgrade) set -- --grep "@p0|@smoke" --grep-invert @quarantine;;
            nightly)      if [ "$INCLUDE_QUARANTINED" = "true" ]; then
                            set -- --grep "@p0|@p1|@p2"
                          else
                            set -- --grep "@p0|@p1|@p2" --grep-invert @quarantine
                          fi;;
            smoke)        set -- --grep "@smoke";;
            *) echo "no playwright selection for mode $E2E_MODE" >&2; exit 1;;
          esac

          cd /work/scripts/e2e/ui
          npm ci --no-audit --no-fund
          mkdir -p /artifacts/out /artifacts/report

          # A red suite exits nonzero here — the wait container still uploads
          # the JUnit + report artifacts below (Argo collects outputs on
          # failure), so no exit-code masking needed.
          # PLAYWRIGHT_JUNIT_OUTPUT_FILE (not _OUTPUT_NAME — that one is only
          # consulted when the config sets no outputFile, and
          # playwright.config.ci.ts does) overrides the config's junit path
          # per shard.
          PLAYWRIGHT_JUNIT_OUTPUT_FILE="test-results/junit-{{inputs.parameters.shard-safe}}.xml" \
            npx playwright test --config playwright.config.ci.ts \
              "$@" --shard={{inputs.parameters.shard}}

          # Artifact declarations need static paths: normalize the junit name.
          cp "test-results/junit-{{inputs.parameters.shard-safe}}.xml" /artifacts/out/junit.xml
          [ -d playwright-report ] && cp -r playwright-report/. /artifacts/report/ || true
        volumeMounts:
          - name: work
            mountPath: /work
      outputs:
        artifacts:
          - name: junit
            path: /artifacts/out/junit.xml
            archive:
              none: {}
            s3:
              bucket: argo-workflows-artifacts
              endpoint: garage.garage.svc.cluster.local:3900
              insecure: true
              region: garage
              accessKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_KEY_ID
              secretKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_SECRET_KEY
              key: e2e/{{workflow.uid}}/playwright/junit-{{inputs.parameters.shard-safe}}.xml
          - name: report
            path: /artifacts/report
            s3:
              bucket: argo-workflows-artifacts
              endpoint: garage.garage.svc.cluster.local:3900
              insecure: true
              region: garage
              accessKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_KEY_ID
              secretKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_SECRET_KEY
              key: e2e/{{workflow.uid}}/playwright-report-{{inputs.parameters.shard-safe}}

    # -------------------------------------------------------------- apischema
    # API schema conformance (hard rule 8): the driver imports inari-server
    # modules, so it runs INSIDE an inari-server checkout at server-src-ref
    # with dist/openapi.yaml generated in-step. Release-mode only (today's
    # gate-only semantics).
    - name: apischema
      activeDeadlineSeconds: 1800
      volumes:
        - name: work
          emptyDir: {}
        - name: srv
          emptyDir: {}
      initContainers:
        - name: clone-bundle
          image: alpine/git:2.45.2
          command: ["/bin/sh", "-c"]
          args:
            - git init -q /work && cd /work && git remote add origin https://github.com/7K-Inari/inari-release-bundle.git && git fetch -q --depth 1 origin "$REF" && git checkout -q FETCH_HEAD
          env:
            - name: REF
              value: "{{workflow.parameters.charts-ref}}"
          volumeMounts:
            - name: work
              mountPath: /work
        - name: clone-server
          image: alpine/git:2.45.2
          command: ["/bin/sh", "-c"]
          args:
            - git init -q /srv && cd /srv && git remote add origin https://github.com/7K-Inari/inari-server.git && git fetch -q --depth 1 origin "$REF" && git checkout -q FETCH_HEAD
          env:
            - name: REF
              value: "{{workflow.parameters.server-src-ref}}"
          volumeMounts:
            - name: srv
              mountPath: /srv
      script:
        image: golang:1.26.3-bookworm
        command: [sh]
        envFrom:
          - configMapRef:
              name: e2e-env-contract
        env:
          - name: E2E_PASSWORD
            valueFrom:
              secretKeyRef: {name: inari-e2e-personas, key: dev-admin-password}
        source: |
          set -eu
          mkdir -p /srv/e2e /artifacts/out
          cp /work/scripts/e2e/api/api_schema_e2e_test.go /srv/e2e/
          cd /srv
          go run ./cmd/export-openapi dist/openapi.yaml
          go install gotest.tools/gotestsum@v1.13.0
          export PATH="$PATH:$(go env GOPATH)/bin"
          # Driver env names are its own contract (scripts/e2e/api); map from
          # the shared contract here.
          E2E_BASE_URL="https://$E2E_BASE_DOMAIN" \
          E2E_KEYCLOAK_URL="$E2E_KC_URL" \
          E2E_USERNAME="dev-admin" \
          E2E_PASSWORD="$E2E_PASSWORD" \
          E2E_ORG="$E2E_TENANT_SLUG" \
            gotestsum --junitfile /artifacts/out/junit.xml -- \
              -tags=e2e ./e2e/ -run TestAPISchemaConformance -count=1
        volumeMounts:
          - name: work
            mountPath: /work
          - name: srv
            mountPath: /srv
      outputs:
        artifacts:
          - name: junit
            path: /artifacts/out/junit.xml
            archive:
              none: {}
            s3:
              bucket: argo-workflows-artifacts
              endpoint: garage.garage.svc.cluster.local:3900
              insecure: true
              region: garage
              accessKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_KEY_ID
              secretKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_SECRET_KEY
              key: e2e/{{workflow.uid}}/apischema/junit.xml

    # ----------------------------------------------------- exit-handler
    # Unconditional result reporting (hard rule 8/10): every suite's JUnit
    # lands here even when the run failed or was aborted (optional inputs
    # tolerate absence) and is imported into ReportPortal as ONE launch per
    # run (name = reportportal-launch or "<mode>-<uid>"; attributes: mode,
    # run-id, image tags, charts-ref, status — plan §3.4). A synthesized
    # run-outcome testsuite anchors runs that died before any suite wrote
    # JUnit. Always exits 0 — reporting never masks the result; a missing
    # reportportal-importer secret (pre-owner-action) degrades to a skip
    # warning. Endpoint: the reportportal-api service directly (no gateway);
    # creds: ESO secret reportportal-importer (reportportal-importer-secret.yaml).
    - name: exit-handler
      activeDeadlineSeconds: 900
      inputs:
        artifacts:
          - name: ginkgo-junit
            optional: true
            path: /junit/ginkgo-junit.xml
            archive:
              none: {}
            s3:
              bucket: argo-workflows-artifacts
              endpoint: garage.garage.svc.cluster.local:3900
              insecure: true
              region: garage
              accessKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_KEY_ID
              secretKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_SECRET_KEY
              key: e2e/{{workflow.uid}}/ginkgo/junit.xml
          - name: chainsaw-junit
            optional: true
            path: /junit/chainsaw-junit.xml
            archive:
              none: {}
            s3:
              bucket: argo-workflows-artifacts
              endpoint: garage.garage.svc.cluster.local:3900
              insecure: true
              region: garage
              accessKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_KEY_ID
              secretKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_SECRET_KEY
              key: e2e/{{workflow.uid}}/chainsaw/junit.xml
          - name: apischema-junit
            optional: true
            path: /junit/apischema-junit.xml
            archive:
              none: {}
            s3:
              bucket: argo-workflows-artifacts
              endpoint: garage.garage.svc.cluster.local:3900
              insecure: true
              region: garage
              accessKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_KEY_ID
              secretKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_SECRET_KEY
              key: e2e/{{workflow.uid}}/apischema/junit.xml
          # Upgrade mode only (W5): the upgrade leg's synthetic JUnit.
          - name: upgrade-junit
            optional: true
            path: /junit/upgrade-junit.xml
            archive:
              none: {}
            s3:
              bucket: argo-workflows-artifacts
              endpoint: garage.garage.svc.cluster.local:3900
              insecure: true
              region: garage
              accessKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_KEY_ID
              secretKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_SECRET_KEY
              key: e2e/{{workflow.uid}}/upgrade/junit.xml
          # Release mode only (W6): the Harbor scan gate's synthetic
          # `security` JUnit — including the failed-gate case (the driver
          # writes the JUnit before exiting non-zero).
          - name: scan-junit
            optional: true
            path: /junit/scan-junit.xml
            archive:
              none: {}
            s3:
              bucket: argo-workflows-artifacts
              endpoint: garage.garage.svc.cluster.local:3900
              insecure: true
              region: garage
              accessKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_KEY_ID
              secretKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_SECRET_KEY
              key: e2e/{{workflow.uid}}/scan/junit.xml
          # Keep in sync with the playwright task's withParam shard list.
          - name: playwright-junit-1-2
            optional: true
            path: /junit/playwright-junit-1-2.xml
            archive:
              none: {}
            s3:
              bucket: argo-workflows-artifacts
              endpoint: garage.garage.svc.cluster.local:3900
              insecure: true
              region: garage
              accessKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_KEY_ID
              secretKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_SECRET_KEY
              key: e2e/{{workflow.uid}}/playwright/junit-1-2.xml
          - name: playwright-junit-2-2
            optional: true
            path: /junit/playwright-junit-2-2.xml
            archive:
              none: {}
            s3:
              bucket: argo-workflows-artifacts
              endpoint: garage.garage.svc.cluster.local:3900
              insecure: true
              region: garage
              accessKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_KEY_ID
              secretKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_SECRET_KEY
              key: e2e/{{workflow.uid}}/playwright/junit-2-2.xml
      script:
        image: alpine:3.22
        command: [sh]
        env:
          # Direct service DNS — no gateway/TLS/external-DNS dependency in the
          # reporting path. Humans use https://reportportal.7kgroup.org.
          - name: RP_ENDPOINT
            value: http://reportportal-api.reportportal.svc.cluster.local:8585
          - name: RP_PROJECT
            value: inari-e2e
          # optional: true is load-bearing — before the owner provisions the
          # ReportPortal API key (gitops/e2e/README.md §Prerequisites) the
          # secret does not exist and the exit-handler pod MUST still start.
          - name: RP_API_KEY
            valueFrom:
              secretKeyRef:
                name: reportportal-importer
                key: api-key
                optional: true
        source: |
          set -u
          LAUNCH="{{workflow.parameters.reportportal-launch}}"
          [ -n "$LAUNCH" ] || LAUNCH="{{workflow.parameters.mode}}-{{workflow.uid}}"
          echo "run: {{workflow.parameters.mode}} / {{workflow.uid}} (status {{workflow.status}})"
          echo "launch: $LAUNCH"
          echo "attributes: mode={{workflow.parameters.mode}} charts-ref={{workflow.parameters.charts-ref}} server-image={{workflow.parameters.server-image}} console-image={{workflow.parameters.console-image}} agent-image={{workflow.parameters.agent-image}}"

          mkdir -p /artifacts/out
          {
            echo "run_id={{workflow.uid}}"
            echo "launch=$LAUNCH"
            echo "mode={{workflow.parameters.mode}}"
            echo "status={{workflow.status}}"
          } > /artifacts/out/manifest.txt

          echo "== collected JUnit"
          for f in /junit/*.xml; do
            if [ -f "$f" ]; then
              echo "  $f ($(grep -c '<testcase' "$f" 2>/dev/null || echo 0) testcases)"
              echo "junit=$(basename "$f")" >> /artifacts/out/manifest.txt
            fi
          done

          # --- ReportPortal import (W4) --------------------------------
          # ONE launch per run: all suite JUnits in a single zip via the
          # bundled JUnit import plugin; launchImportRq carries the launch
          # name + attributes (plan §3.4). Unconditional (hard rule 8/10):
          # this runs even when the DAG failed or was aborted. Every failure
          # below degrades to a warning — reporting never masks the result.
          apk add --no-cache curl zip jq >/dev/null 2>&1 \
            || echo "WARNING: apk add failed — ReportPortal tooling unavailable"

          if ! command -v curl >/dev/null 2>&1 || ! command -v zip >/dev/null 2>&1 || ! command -v jq >/dev/null 2>&1; then
            echo "WARNING: curl/zip/jq missing — skipping ReportPortal import"
            echo "rp-import=skipped" >> /artifacts/out/manifest.txt
          elif [ -z "${RP_API_KEY:-}" ]; then
            echo "WARNING: RP_API_KEY unset (secret reportportal-importer not synced — owner action pending) — skipping ReportPortal import"
            echo "rp-import=skipped" >> /artifacts/out/manifest.txt
          else
            echo "== ReportPortal import: launch '$LAUNCH' -> $RP_ENDPOINT project $RP_PROJECT"

            # Hard rule 8/10 anchor: a run that died before any suite wrote
            # JUnit still lands in ReportPortal (failed launch) instead of
            # vanishing. Kept OUT of /junit so the collection log above
            # reflects suite artifacts only.
            mkdir -p /tmp/rp-in
            cp /junit/*.xml /tmp/rp-in/ 2>/dev/null || true
            # Guard the glob: a run that died before any suite wrote JUnit
            # (e.g. an upgrade drill failing at the candidate env-prep) has
            # an empty /tmp/rp-in until the run-outcome anchor lands below —
            # without the guard sed/awk noisily fail on the literal pattern
            # (live-verified 2026-11-07).
            if [ -n "$(find /tmp/rp-in -name '*.xml' -print -quit 2>/dev/null)" ]; then
              sed -i 's/ time=""//g' /tmp/rp-in/*.xml
            fi
            # Drop skipped testcases from the IMPORT copy: the plugin finishes
            # suites with no status, and service-api then derives FAILED for
            # any suite with a descendant not in {PASSED, INFO, WARN}
            # (resolveStatus, 5.15.6 — A/B-verified live: a suite with one
            # skipped child imports FAILED with or without skippedIsNotIssue).
            # Label-filtered skips are most of the gate junit (36 of 38 ginkgo
            # specs on a smoke run) and would mark every green run FAILED.
            # The full junit, skips included, remains in S3.
            # Implementation is compaction-proof: self-closing testcases are
            # normalized first, then awk splits on the </testcase> terminator
            # (RS), so single-line and pretty-printed files both work.
            for f in /tmp/rp-in/*.xml; do
              [ -f "$f" ] || continue
              sed 's#\(<testcase [^>]*\)/>#\1></testcase>#g' "$f" > "$f.norm" \
                && mv "$f.norm" "$f"
              awk '
                BEGIN { RS = "</testcase>"; ORS = "" }
                {
                  rest = $0; lastpos = 0; consumed = 0
                  while (match(rest, /<testcase/)) {
                    lastpos = consumed + RSTART
                    rest = substr(rest, RSTART + 9)
                    consumed = lastpos + 8
                  }
                  if (lastpos == 0) { printf "%s", $0; next }
                  printf "%s", substr($0, 1, lastpos - 1)
                  block = substr($0, lastpos)
                  if (block ~ /<skipped/ || block ~ /status="skipped"/) next
                  printf "%s</testcase>", block
                }
              ' "$f" > "$f.filtered" && mv "$f.filtered" "$f"
            done
            if [ "{{workflow.status}}" = "Succeeded" ]; then
              echo '<?xml version="1.0" encoding="UTF-8"?><testsuite name="e2e.run" tests="1" failures="0"><testcase classname="e2e.run" name="workflow-outcome"/></testsuite>' \
                > /tmp/rp-in/run-outcome.xml
            else
              echo '<?xml version="1.0" encoding="UTF-8"?><testsuite name="e2e.run" tests="1" failures="1"><testcase classname="e2e.run" name="workflow-outcome"><failure message="workflow {{workflow.status}}">Run ended in phase {{workflow.status}}; suite JUnits may be missing or partial. See the Argo workflow for node-level detail.</failure></testcase></testsuite>' \
                > /tmp/rp-in/run-outcome.xml
            fi

            rm -f /tmp/launch.zip
            (cd /tmp/rp-in && zip -q /tmp/launch.zip ./*.xml)

            RQ=$(jq -nc \
              --arg name "$LAUNCH" \
              --arg desc "Argo: https://argo-workflows.7kgroup.org/workflows/inari-e2e/{{workflow.name}} — workflow status {{workflow.status}}" \
              --arg mode "{{workflow.parameters.mode}}" \
              --arg runid "{{workflow.uid}}" \
              --arg chartsref "{{workflow.parameters.charts-ref}}" \
              --arg server "{{workflow.parameters.server-image}}" \
              --arg console "{{workflow.parameters.console-image}}" \
              --arg agent "{{workflow.parameters.agent-image}}" \
              --arg status "{{workflow.status}}" \
              '{name: $name, mode: "DEFAULT", description: $desc, attributes: [
                {key: "mode", value: $mode},
                {key: "run-id", value: $runid},
                {key: "charts-ref", value: $chartsref},
                {key: "server-image", value: $server},
                {key: "console-image", value: $console},
                {key: "agent-image", value: $agent},
                {key: "status", value: $status},
                {key: "skippedIsNotIssue", value: "true", system: true}]}')

            IMPORTED=""
            for attempt in 1 2 3; do
              # No -f: capture the HTTP code + response body — an unexplained
              # "import failed" costs a debug pod to diagnose (learned the
              # hard way, 2026-11-06: a bad API-key value was indistinguishable
              # from a plugin outage in the logs).
              CODE=$(curl -s -m 120 -o /tmp/rp-resp.txt -w '%{http_code}' -X POST \
                  "$RP_ENDPOINT/api/v1/plugin/$RP_PROJECT/junit/import" \
                  -H "Authorization: Bearer $RP_API_KEY" \
                  -F "file=@/tmp/launch.zip;type=application/x-zip-compressed" \
                  -F "launchImportRq=$RQ;type=application/json" 2>/dev/null) || CODE="000"
              case "$CODE" in
                2*)
                  IMPORTED=1
                  echo "  import accepted (HTTP $CODE): $(head -c 200 /tmp/rp-resp.txt 2>/dev/null)"
                  break;;
              esac
              echo "  import attempt $attempt failed (HTTP $CODE): $(head -c 300 /tmp/rp-resp.txt 2>/dev/null)"
              sleep 10
            done

            if [ -z "$IMPORTED" ]; then
              echo "WARNING: ReportPortal import failed after 3 attempts (run result unaffected; JUnits remain in S3 at e2e/{{workflow.uid}}/)"
              echo "rp-import=failed" >> /artifacts/out/manifest.txt
            else
              echo "rp-import=ok" >> /artifacts/out/manifest.txt
              # Import is processed asynchronously — poll until the launch is
              # visible so the step log carries the proof.
              LAUNCH_ID=""
              for i in $(seq 1 12); do
                LAUNCH_ID=$(curl -sf -m 30 "$RP_ENDPOINT/api/v1/$RP_PROJECT/launch?filter.eq.name=$LAUNCH&page.size=1&page.sort=startTime%2CDESC" \
                  -H "Authorization: Bearer $RP_API_KEY" 2>/dev/null | jq -r '.content[0].id // empty') || LAUNCH_ID=""
                [ -n "$LAUNCH_ID" ] && break
                sleep 15
              done
              if [ -n "$LAUNCH_ID" ]; then
                echo "  launch visible: id=$LAUNCH_ID — https://reportportal.7kgroup.org/ui/#$RP_PROJECT/launches/all/$LAUNCH_ID"
                echo "rp-launch-id=$LAUNCH_ID" >> /artifacts/out/manifest.txt
              else
                echo "WARNING: launch '$LAUNCH' not visible after 3m (async import lag) — check ReportPortal manually"
              fi
            fi
          fi
          # ------------------------------------------------------------------
          echo "== exit-handler done"
      outputs:
        artifacts:
          - name: manifest
            path: /artifacts/out/manifest.txt
            archive:
              none: {}
            s3:
              bucket: argo-workflows-artifacts
              endpoint: garage.garage.svc.cluster.local:3900
              insecure: true
              region: garage
              accessKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_KEY_ID
              secretKeySecret:
                name: argo-workflows-s3-credentials
                key: ACCESS_SECRET_KEY
              key: e2e/{{workflow.uid}}/manifest.txt
