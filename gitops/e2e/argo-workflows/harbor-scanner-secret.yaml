# Harbor robot-account credential for the e2e-stack harbor-scan-gate step
# (W6). Synced from Vault via the cluster's vault-internal ClusterSecretStore
# (same pattern as reportportal-importer-secret.yaml; the e2e plane's
# credentials stay under the inari-e2e/* Vault prefix).
#
# The harbor-scan-gate template references this secret with optional: true and
# the driver FAILS LOUD (config-error JUnit, run Failed) when it is absent —
# a release gate must never silently skip its own enforcement.
#
# REQUIRED one-time owner actions (gitops/e2e/README.md §Harbor scan gate):
#   1. Harbor UI (https://harbor.7kgroup.org, admin): project ghcr-proxy →
#      Robot Accounts → NEW ROBOT ACCOUNT — name "e2e-scan-gate", no
#      expiration, permissions limited to:
#        Pull Repository, List Repository, Read Repository (Artifact),
#        Create Scan.
#   2. vault kv put secret/inari-e2e/harbor-robot \
#        username='robot$ghcr-proxy+e2e-scan-gate' token='<token>'
#      (project-scoped robot names carry the "<project>+" prefix).
#   ESO refreshes hourly; force with:
#     kubectl annotate externalsecret harbor-scanner -n inari-e2e \
#       force-sync=$(date +%s) --overwrite
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-scanner
  namespace: inari-e2e
  labels:
    app.kubernetes.io/part-of: inari-e2e-workflows
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-internal
    kind: ClusterSecretStore
  target:
    name: harbor-scanner
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef: { key: inari-e2e/harbor-robot, property: username }
    - secretKey: token
      remoteRef: { key: inari-e2e/harbor-robot, property: token }
