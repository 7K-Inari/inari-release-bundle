# ReportPortal importer credential for the e2e-stack onExit handler (W4).
# Synced from Vault via the cluster's vault-internal ClusterSecretStore (same
# pattern as ../env-extras/external-secrets.yaml). The e2e plane's credentials
# stay under the inari-e2e/* Vault prefix (precedent: inari-e2e/database,
# inari-e2e/personas).
#
# The exit-handler references this secret with optional: true, so runs before
# the Vault write simply skip the import with a warning — nothing fails.
#
# REQUIRED one-time owner actions (gitops/e2e/README.md §Prerequisites):
#   1. ReportPortal (https://reportportal.int.7kgroup.org, superadmin):
#      create project "inari-e2e"; create local user "e2e-importer", assign
#      it to the project (MEMBER suffices — the import endpoint allows
#      Admin/PM/Member/Customer/Operator); generate an API key.
#   2. vault kv put secret/inari-e2e/reportportal api-key=<uuid>
#   ESO refreshes hourly; force with:
#     kubectl annotate externalsecret reportportal-importer -n inari-e2e \
#       force-sync=$(date +%s) --overwrite
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reportportal-importer
  namespace: inari-e2e
  labels:
    app.kubernetes.io/part-of: inari-e2e-workflows
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-internal
    kind: ClusterSecretStore
  target:
    name: reportportal-importer
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef: { key: inari-e2e/reportportal, property: api-key }
