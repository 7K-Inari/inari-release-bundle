# Semaphore backing store: ONE permit per key — serializes every e2e-stack
# run (release/edge/nightly/weekly/smoke) against the single persistent env.
# The role-lifecycle spec mutates the e2e-member persona and env-prep flips
# the deployed artifact set; parallel runs would collide (plan §5.6, C11).
#
# Argo v4 semantics (verified against controller v4.1.6 source +
# live): the data VALUE is the permit LIMIT (integer). Holder bookkeeping
# is in-memory + workflow statuses — the controller NEVER writes this
# ConfigMap, so no value drift occurs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: e2e-env-lock
  namespace: inari-e2e
  labels:
    app.kubernetes.io/part-of: inari-e2e-workflows
data:
  workflows: "1"
