# M1W9 LitmusChaos identities — namespaced to inari-e2e only.
# The driver owns run-scoped manifests, exact target snapshots, domain probes,
# and cleanup. The runner has only the upstream fault's namespaced permissions.
# Neither identity can read Secrets, Nodes, Namespaces, CRDs, or live-agent
# resources, and no ClusterRole/ClusterRoleBinding is present. CRD installation
# and Established proof belong to the GitOps install acceptance.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: e2e-chaos-driver
  namespace: inari-e2e
  labels:
    app.kubernetes.io/part-of: inari-e2e-workflows
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: e2e-chaos-driver
  namespace: inari-e2e
  labels:
    app.kubernetes.io/part-of: inari-e2e-workflows
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
  - apiGroups: ["litmuschaos.io"]
    resources: ["chaosengines", "chaosexperiments", "chaosresults"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  # Org-scoped outbox/data-survival SQL uses pod-local peer auth on the CNPG
  # primary, so no inari-db Secret read is needed.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch"]
  # Only exact runner/experiment Job names recorded in ChaosEngine status are
  # deleted; list/watch supports the post-run leak assertion.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: e2e-chaos-driver
  namespace: inari-e2e
  labels:
    app.kubernetes.io/part-of: inari-e2e-workflows
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: e2e-chaos-driver
subjects:
  - kind: ServiceAccount
    name: e2e-chaos-driver
    namespace: inari-e2e
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: e2e-chaos-runner
  namespace: inari-e2e
  labels:
    app.kubernetes.io/part-of: inari-e2e-workflows
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: e2e-chaos-runner
  namespace: inari-e2e
  labels:
    app.kubernetes.io/part-of: inari-e2e-workflows
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "deletecollection"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "list", "create"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets", "daemonsets"]
    verbs: ["list", "get"]
  - apiGroups: [""]
    resources: ["replicationcontrollers"]
    verbs: ["get", "list"]
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts"]
    verbs: ["list", "get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "list", "get", "delete", "deletecollection"]
  - apiGroups: ["litmuschaos.io"]
    resources: ["chaosengines", "chaosexperiments", "chaosresults"]
    verbs: ["create", "list", "get", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: e2e-chaos-runner
  namespace: inari-e2e
  labels:
    app.kubernetes.io/part-of: inari-e2e-workflows
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: e2e-chaos-runner
subjects:
  - kind: ServiceAccount
    name: e2e-chaos-runner
    namespace: inari-e2e
