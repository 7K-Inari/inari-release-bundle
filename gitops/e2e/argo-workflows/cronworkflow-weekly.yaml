# Weekly LOAD run (plan C2, taxonomy §1.3 execution-profile label `load` —
# never in PR/release gates). The e2e-stack template's weekly mode runs the
# k6 legs (W7): permissions-cache → login-storm → provisioning-outbox,
# sequential k6-operator TestRuns, thresholds gating via the runner exit
# code. LitmusChaos legs join this same slot in W9 (taxonomy `chaos`).
#
# Enabled after the W7 acceptance run (2026-11-12): all three legs went green
# end-to-end and ReportPortal launch 72 recorded the three named k6 testsuites.
#
# Ordering vs the nightly reset is deliberate: Saturday 02:17 UTC leaves ~23h
# before the Sunday 01:17 nightly-reset CronWorkflow — the plan's "load/chaos
# the night before the reset" DR-adjacent ordering.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: e2e-weekly
  namespace: inari-e2e
  labels:
    app.kubernetes.io/part-of: inari-e2e-workflows
spec:
  suspend: false
  # Saturday 02:17 UTC — off-peak, ahead of the reset window.
  schedules: ["17 2 * * 6"]
  concurrencyPolicy: Forbid
  workflowSpec:
    workflowTemplateRef:
      name: e2e-stack
    workflowMetadata:
      labels:
        e2e.inari.io/mode: weekly
    arguments:
      parameters:
        - name: mode
          value: weekly
        - name: ha
          value: "true"
        - name: charts-ref
          value: main
        - name: server-image
          value: edge
        - name: console-image
          value: edge
        - name: agent-image
          value: edge
        - name: server-src-ref
          value: main
        - name: cosign-verify
          value: "false"
        - name: include-quarantined
          value: "true"
        - name: retention-days
          value: "7"
        - name: reportportal-launch
          value: ""
