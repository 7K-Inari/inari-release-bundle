# Artifact-repository credentials for workflow pods in THIS namespace.
#
# The controller-wide default artifact repo (7k-app-of-apps
# apps/7kgroup/argo-workflows.yaml) points at the Garage S3 bucket
# argo-workflows-artifacts with accessKeySecret argo-workflows-s3-credentials.
# Artifact secret references are resolved IN THE WORKFLOW'S NAMESPACE (the
# controller injects them into wait containers as secretKeyRef env), so the
# secret must exist in inari-e2e too — or every artifact upload AND archived
# log (archiveLogs: true) fails.
#
# The GarageKey here creates that secret copy; the bucket lives in the
# argo-workflows namespace, so a GarageReferenceGrant (in the bucket's
# namespace, per the garage-operator's cross-namespace rule) allows the
# reference. Modeled on extras/7kgroup/argo-workflows-extras/artifact-repo.yaml.
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: argo-workflows-artifacts-key
  namespace: inari-e2e
  labels:
    app.kubernetes.io/part-of: inari-e2e-workflows
spec:
  clusterRef:
    name: garage
    namespace: garage
  secretTemplate:
    name: argo-workflows-s3-credentials
    accessKeyIdKey: ACCESS_KEY_ID
    secretAccessKeyKey: ACCESS_SECRET_KEY
  bucketPermissions:
    - bucketRef:
        name: argo-workflows-artifacts
        namespace: argo-workflows
      read: true
      write: true
      owner: false
---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageReferenceGrant
metadata:
  name: inari-e2e-artifacts
  namespace: argo-workflows
  labels:
    app.kubernetes.io/part-of: inari-e2e-workflows
spec:
  from:
    - kind: GarageKey
      namespace: inari-e2e
  to:
    - kind: GarageBucket
      name: argo-workflows-artifacts
